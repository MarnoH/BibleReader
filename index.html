<!DOCTYPE html>
<html lang="en" data-theme="auto">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-visual">
<title>Bybel</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="theme-color" content="#d3d0c8" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#131211" media="(prefers-color-scheme: dark)">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Bybel">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<style>
@font-face{font-family:"SS4";src:url(fonts/SourceSerif4-Regular.woff2) format("woff2");font-weight:400;font-style:normal;font-display:block}
@font-face{font-family:"SS4";src:url(fonts/SourceSerif4-It.woff2) format("woff2");font-weight:400;font-style:italic;font-display:block}
@font-face{font-family:"SS4";src:url(fonts/SourceSerif4-Semibold.woff2) format("woff2");font-weight:600;font-style:normal;font-display:block}

:root{
  color-scheme:light;
  --desk:#d3d0c8; --page:#f6f4ee; --page2:#ece9e1; --ink:#1f1d1a; --soft:#6d675d; --faint:#a29c91;
  --rule:#cfcac0; --panel:#fbfaf7; --line:#dcd8cf; --sel:#2a2724; --sel-ink:#f6f4ee;
  --rubric:#a2392a; --shadow:rgba(46,36,24,.20); --fold:rgba(70,52,30,.24); --fold2:rgba(70,52,30,.07); --sheen:rgba(255,255,255,.5); --edgebg:#f1eee7; --edgeln2:#d3ccbe;
  --xline:color-mix(in srgb,var(--rubric) 62%,transparent); --xthick:1px;
  --serif:"SS4","Iowan Old Style","Palatino Linotype",Georgia,serif;
  --sans:system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
}
[data-theme=dark]{
  color-scheme:dark;
  --desk:#0e0d0c; --page:#211f1c; --page2:#2b2926; --ink:#e5e0d5; --soft:#9a948a; --faint:#69645c;
  --rule:#302d2a; --panel:#22201e; --line:#393633; --sel:#d8d1c2; --sel-ink:#1c1b19;
  --rubric:#d8806a; --shadow:rgba(0,0,0,.5); --fold:rgba(0,0,0,.6); --fold2:rgba(0,0,0,.2); --sheen:rgba(255,255,255,.04); --edgebg:#5e574d; --edgeln2:#37332e;
  --xline:#e39a82; --xthick:2px;
}
@media (prefers-color-scheme:dark){
  [data-theme=auto]{
    color-scheme:dark;
    --desk:#0e0d0c; --page:#211f1c; --page2:#2b2926; --ink:#e5e0d5; --soft:#9a948a; --faint:#69645c;
    --rule:#302d2a; --panel:#22201e; --line:#393633; --sel:#d8d1c2; --sel-ink:#1c1b19;
    --rubric:#d8806a; --shadow:rgba(0,0,0,.5); --fold:rgba(0,0,0,.6); --fold2:rgba(0,0,0,.2); --sheen:rgba(255,255,255,.04); --edgebg:#5e574d; --edgeln2:#37332e;
    --xline:#e39a82; --xthick:2px;
  }
}
*{box-sizing:border-box}
[hidden]{display:none!important}
#shelf,#set,#nav .box,#pop,#chap,#notes .nbody{scrollbar-width:thin;scrollbar-color:var(--line) transparent;scrollbar-gutter:stable}
#shelf::-webkit-scrollbar,#set::-webkit-scrollbar,#nav .box::-webkit-scrollbar,#pop::-webkit-scrollbar,#chap::-webkit-scrollbar,#notes .nbody::-webkit-scrollbar{width:9px;height:9px}
#shelf::-webkit-scrollbar-thumb,#set::-webkit-scrollbar-thumb,#nav .box::-webkit-scrollbar-thumb,#pop::-webkit-scrollbar-thumb,#chap::-webkit-scrollbar-thumb,#notes .nbody::-webkit-scrollbar-thumb{background:var(--line);border-radius:6px}
#shelf::-webkit-scrollbar-track,#set::-webkit-scrollbar-track,#nav .box::-webkit-scrollbar-track,#pop::-webkit-scrollbar-track,#chap::-webkit-scrollbar-track,#notes .nbody::-webkit-scrollbar-track{background:transparent}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;height:100vh;height:100dvh;display:flex;flex-direction:column;overflow:hidden;
  background:var(--desk);color:var(--ink);font:14px/1.4 var(--sans);
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
  -webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit}
button:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--rubric);outline-offset:2px}

/* ---------- chrome ---------- */
#top{flex:none;height:48px;display:flex;align-items:center;gap:6px;padding:0 14px}
.tb{background:none;border:0;padding:6px 10px;border-radius:7px;cursor:pointer;color:var(--ink)}
.tb:hover{background:color-mix(in srgb,var(--ink) 7%,transparent)}
#bookbtn{position:relative;font-family:var(--serif);font-size:17px;display:flex;align-items:center;gap:7px;padding:5px 15px;border-radius:4px;
  color:#efe2bf;background:linear-gradient(90deg,rgba(0,0,0,.3),rgba(255,255,255,.11) 28%,rgba(255,255,255,.04) 60%,rgba(0,0,0,.3)),var(--c,#4a4642);
  box-shadow:inset 0 0 0 1px rgba(0,0,0,.28),0 1px 3px var(--shadow);transition:background-color .2s}
#bookbtn::before,#bookbtn::after{content:"";position:absolute;top:4px;bottom:4px;width:2px;border-left:1px solid rgba(226,196,122,.75);border-right:1px solid rgba(226,196,122,.75)}
#bookbtn::before{left:5px}
#bookbtn::after{right:5px}
#bookbtn:hover{filter:brightness(1.1)}
#bookbtn svg{width:12px;height:12px;opacity:.8}
#aa{font-family:var(--serif);font-size:19px}
#back{font-size:13px;color:var(--soft)}
.grow{flex:1}
#work{flex:1;min-height:0;display:flex;position:relative;overflow:hidden}
#stage{flex:1;min-width:0;min-height:0;position:relative;display:flex;align-items:center;justify-content:center}
#status{flex:none;height:36px;display:flex;align-items:center;justify-content:center;gap:14px;
  border-top:1px solid var(--rule);font-family:var(--serif);font-size:14px;color:var(--soft);cursor:pointer;user-select:none}
#status[hidden]{display:none}
#status .a5{color:var(--faint)}
.mks{display:flex;gap:5px}
.mk{border:1px solid var(--line);background:none;color:var(--soft);border-radius:999px;padding:0 10px;font-family:var(--serif);font-size:13px;
  line-height:22px;cursor:pointer;font-feature-settings:"lnum"}
.mk:hover{color:var(--ink);border-color:var(--soft)}
.mk.was{color:var(--ink)}
.mk.on{background:var(--sel);color:var(--sel-ink);border-color:var(--sel)}

/* ---------- the book ---------- */
#book{position:relative;touch-action:pan-y pinch-zoom;filter:drop-shadow(0 14px 28px var(--shadow)) drop-shadow(0 1px 1px var(--shadow));cursor:default;user-select:text}
.pg{position:absolute;top:0;background:var(--page)}
.pg.l{left:0;border-radius:4px 0 0 4px;
  background:linear-gradient(to left,var(--fold) 0,var(--fold2) 2.5%,transparent 8%,var(--sheen) 12%,transparent 19%) ,var(--page);
  box-shadow:none}
.pg.r{border-radius:0 4px 4px 0;
  background:linear-gradient(to right,var(--fold) 0,var(--fold2) 2.5%,transparent 8%,var(--sheen) 12%,transparent 19%) ,var(--page);
  box-shadow:none}
/* the hard cover the pages lie on: a board in the book's cloth colour, a little larger than the pages */
.cover{position:absolute;z-index:-2;display:none;pointer-events:none;top:calc(-1 * var(--bd,7px));bottom:calc(-1 * var(--bd,7px));
  left:calc(-1 * (var(--wl,0px) + var(--bd,7px)));right:calc(-1 * (var(--wr,0px) + var(--bd,7px)));border-radius:6px;
  background:linear-gradient(to right,rgba(0,0,0,.38),rgba(255,255,255,.07) 1.2%,transparent 3.5%,transparent 96.5%,rgba(255,255,255,.07) 98.8%,rgba(0,0,0,.38)),
    linear-gradient(rgba(255,255,255,.09),transparent 25%,transparent 75%,rgba(0,0,0,.2)),var(--coverc,#5a1f22);
  box-shadow:inset 0 0 0 1px rgba(0,0,0,.4),inset 0 1px 0 rgba(255,255,255,.14)}
#book.covered .cover{display:block}
/* the crease where the two pages meet in the binding */
#book:not(.single)::before{content:"";position:absolute;left:calc(50% - 1.5px);top:var(--dip,0);bottom:0;width:3px;z-index:2;pointer-events:none;
  background:linear-gradient(to right,transparent,var(--fold) 40%,var(--fold) 60%,transparent)}
/* The edges of the pages beside the open book: as in a printed Bible, the stack on the left grows and the one
   on the right shrinks as you read on, so you can feel how far into the Bible you are. A thin gold line in the
   stack marks where the New Testament begins. */
.edge{position:absolute;top:0;bottom:0;width:var(--w,4px);z-index:-1;
  background:repeating-linear-gradient(to right,var(--edgebg) 0 1px,var(--edgeln2) 1px 2px);box-shadow:inset 0 0 0 .5px rgba(0,0,0,.18)}
.edge.l{right:100%;border-radius:3px 0 0 3px;top:var(--sag,0);bottom:var(--sag,0)}
.edge.r{left:100%;border-radius:0 3px 3px 0;top:var(--sag,0);bottom:var(--sag,0)}
.edge .nt{position:absolute;top:0;bottom:0;width:1px;background:#c9a04a;opacity:.85}
.edge.l .nt{right:var(--at)}.edge.r .nt{left:var(--at)}
#book.single .pg.l{border-radius:4px;background:var(--page);box-shadow:none}
#book.single .pg.r{display:none}
.rh,.fo{position:absolute;font-family:var(--serif);font-size:calc(var(--fs) * .8);color:var(--soft);
  white-space:nowrap;font-feature-settings:"lnum"}
.rh{text-transform:uppercase;letter-spacing:.09em;color:var(--ink);opacity:.8}
.rh{top:calc(var(--mt) * .36)}
.fo .fb{opacity:.55}
.fo{bottom:calc(var(--mb) * .32)}
.pg.l .rh,.pg.l .fo{left:var(--mo)}
.pg.r .rh,.pg.r .fo{right:var(--mo);text-align:right}
#book.single .pg.l .fo{left:auto;right:var(--mo)}
#book.hd-off .rh{display:none}
#book.hd-dim .rh{opacity:.6}
#vp{position:absolute;overflow:hidden}

.flowcss{position:absolute;left:0;top:0;column-fill:auto;font-family:var(--serif);line-height:1.32;
  color:var(--ink);text-align:justify;hyphens:auto;-webkit-hyphens:auto;orphans:2;widows:2;
  font-kerning:normal;text-rendering:optimizeLegibility;font-variant-ligatures:common-ligatures}
.flowcss .bt{font-weight:400;text-align:center;font-size:1.75em;line-height:1.15;letter-spacing:.14em;text-transform:uppercase;
  margin:.15em 0 .75em;break-after:avoid}
.flowcss.hd-off .bt{display:none}
.flowcss.hd-dim .bt{opacity:.6}
.flowcss .chp{margin:0}
.flowcss.gap-on .chp+.chp{margin-top:.75em}
.flowcss.lay-lines .vs{display:block}
.flowcss.lay-para .vs{display:inline}
.flowcss .pa{margin:0}
.flowcss.lay-lines .pa+.pa{margin-top:.55em}
.flowcss.lay-para .pa+.pa{text-indent:1.1em}
.vn{font-size:.86em;font-feature-settings:"lnum";margin-right:.3em}
.flowcss.vn-off .vn{display:none}
.flowcss.vn-dim .vn{color:var(--soft);opacity:.75}
.cn{float:left;font-size:2.7em;line-height:.84;font-weight:600;margin:.06em .12em 0 0;font-feature-settings:"lnum"}
.flowcss.ch-off .cn{display:none}
.flowcss.ch-dim .cn{opacity:.42}
.flowcss.ch-on .vs.hascn>.vn,.flowcss.ch-dim .vs.hascn>.vn{display:none}
.psh{text-align:center;font-weight:600;letter-spacing:.12em;text-transform:uppercase;font-size:.82em;margin:.75em 0 .3em;break-after:avoid}
.chp:first-of-type .psh{margin-top:0}
.flowcss.ch-off .psh{display:none}
.flowcss.ch-dim .psh{opacity:.5}
.xa{text-decoration:underline dotted var(--xline);text-decoration-thickness:var(--xthick);text-underline-offset:.2em;cursor:pointer}
.xa:hover{text-decoration-style:solid}
.xm{color:var(--xline);text-decoration:none;font-size:.8em;vertical-align:.35em;padding:0 .12em}
.flash{animation:flash 1.8s ease-out}
@keyframes flash{from{background:color-mix(in srgb,var(--rubric) 26%,transparent)}to{background:transparent}}

#measure .cal{break-before:column}
#measure .cal:first-child{break-before:auto}
#measure{position:fixed;left:0;top:0;width:0;height:0;overflow:hidden;visibility:hidden;pointer-events:none;contain:strict}

/* ---------- panels ---------- */
#busy{position:absolute;inset:0;display:none;align-items:center;justify-content:center;background:var(--desk);z-index:70;
  font-family:var(--serif);font-size:17px;color:var(--soft)}
#busy.on{display:flex}
#set{position:absolute;top:6px;right:14px;z-index:60;width:410px;max-width:calc(100vw - 28px);max-height:calc(100% - 12px);
  overflow:auto;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px 16px 12px;
  box-shadow:0 22px 50px -12px var(--shadow);display:none}
#set.on{display:block}
.seth{display:flex;justify-content:space-between;align-items:center;margin:0 0 6px}
.lnk{background:none;border:0;color:var(--soft);cursor:pointer;padding:4px 0}
.lnk:hover{color:var(--ink)}
.x{background:none;border:0;font-size:20px;line-height:1;color:var(--soft);cursor:pointer;padding:2px 6px;border-radius:6px}
.x:hover{color:var(--ink)}
.srow{display:grid;grid-template-columns:118px 1fr;align-items:center;gap:10px;margin:6px 0}
.srow>span{color:var(--ink);opacity:.85}
.seg{display:flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{flex:1;border:0;border-left:1px solid var(--line);background:transparent;padding:7px 4px;cursor:pointer;white-space:nowrap}
.seg button:first-child{border-left:0}
.seg button:hover{background:color-mix(in srgb,var(--ink) 6%,transparent)}
.seg .cvsw{min-width:0;padding:0;flex:.6;background:linear-gradient(var(--c),var(--c)) center/14px 14px no-repeat}
.seg .cvsw[aria-pressed=true]{background:linear-gradient(var(--c),var(--c)) center/18px 18px no-repeat,var(--sel)}
.seg button[aria-pressed=true]{background:var(--sel);color:var(--sel-ink)}
.sep{height:8px}
.cred{font-size:11.5px;color:var(--faint);margin:12px 0 0;line-height:1.45}

#nav,#find{position:absolute;inset:0;z-index:50;display:none;align-items:flex-start;justify-content:center;padding:14px;
  background:color-mix(in srgb,var(--desk) 82%,transparent);backdrop-filter:blur(3px)}
#nav.on,#find.on{display:flex}
#nav .box,#find .box{width:100%;max-width:880px;max-height:100%;overflow:auto;background:var(--panel);border:1px solid var(--line);
  border-radius:12px;padding:14px 20px 18px;box-shadow:0 22px 50px -12px var(--shadow)}
.navh{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
.navh b{font-family:var(--serif);font-size:19px;font-weight:600}
.bks{display:grid;grid-template-columns:1fr 1fr;gap:0 28px}
.bks h3{font-family:var(--serif);font-weight:400;font-size:13px;color:var(--soft);margin:8px 0 4px;font-variant-caps:small-caps;letter-spacing:.05em}
.bks button,.chs button{background:none;border:0;cursor:pointer;border-radius:6px}
.bks button{display:block;width:100%;text-align:left;padding:4px 8px;font-family:var(--serif);font-size:15px}
.bks button:hover,.chs button:hover{background:color-mix(in srgb,var(--ink) 7%,transparent)}
.bks button.cur,.chs button.cur{color:var(--rubric)}
.bkcols{columns:2;column-gap:16px}
.navg{display:grid;grid-template-columns:1.15fr 1fr;gap:4px 30px}
@media (max-width:680px){.navg{grid-template-columns:1fr}}
.navcol h3{font-family:var(--serif);font-weight:400;font-size:13px;color:var(--soft);margin:6px 0 2px;font-variant-caps:small-caps;letter-spacing:.06em}
.ngrp{margin:10px 0 0}
.nplate{display:inline-block;font-family:var(--serif);font-size:11px;letter-spacing:.06em;color:#3a2a14;padding:1px 9px 0;border-radius:2px;
  background:linear-gradient(#e7d29c,#bf9d5a);box-shadow:0 1px 1px rgba(0,0,0,.3)}
.tiles{display:flex;flex-wrap:wrap;gap:4px;margin-top:6px}
.bk{position:relative;border:0;cursor:pointer;color:#efe2bf;font-family:var(--serif);font-size:14.5px;line-height:1.2;padding:6px 15px;border-radius:3px;
  background:linear-gradient(rgba(255,255,255,.1),rgba(255,255,255,.02) 45%,rgba(0,0,0,.22)),var(--c);
  box-shadow:inset 0 0 0 1px rgba(0,0,0,.28),0 1px 2px var(--shadow);transition:transform .12s}
.bk::before,.bk::after{content:"";position:absolute;top:5px;bottom:5px;width:0;border-left:1px solid rgba(226,196,122,.55)}
.bk::before{left:5px}
.bk::after{right:5px}
.bk:hover,.bk:focus-visible{transform:translateY(-2px)}
.bk.cur{box-shadow:inset 0 0 0 1px rgba(0,0,0,.28),0 0 0 2px #e2bf35}
.tg{display:inline-block;width:9px;height:9px;margin-left:8px;border-radius:1px;vertical-align:.02em;box-shadow:0 0 0 1px rgba(255,255,255,.35)}
.tg[data-l="2"]{background:#cfdbe4}.tg[data-l="4"]{background:#93afc3}.tg[data-l="6"]{background:#4e7c9a}.tg[data-l="7"]{background:#2b5a7d}.tg[data-l="8"]{background:#e3c25b}
.navbk{padding:3px 14px;border-radius:3px;color:#efe2bf;font-size:17px!important;background:linear-gradient(rgba(255,255,255,.1),rgba(0,0,0,.2)),var(--c)}
.navsub{margin:-2px 0 10px;text-align:center;color:var(--soft);font-size:12.5px}
.cc.here{outline:2px solid var(--rubric);outline-offset:-1px}
.chs{display:grid;grid-template-columns:repeat(auto-fill,minmax(46px,1fr));gap:6px}
.chs button{padding:9px 0;border:1px solid var(--line);font-feature-settings:"lnum";font-family:var(--serif);font-size:15px}

#pop{position:fixed;z-index:80;width:min(400px,calc(100vw - 24px));max-height:min(62vh,540px);overflow:auto;
  background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:8px 8px 10px;
  box-shadow:0 22px 50px -12px var(--shadow);display:none}
#pop.on{display:block}
.poph{display:flex;justify-content:space-between;align-items:center;padding:2px 6px 4px;color:var(--soft);font-size:12.5px}
.ph{font-family:var(--serif);font-style:italic;color:var(--soft);margin:8px 6px 2px;font-size:14px}
.ref{display:block;width:100%;text-align:left;border:0;background:none;padding:6px 8px;border-radius:7px;cursor:pointer}
.ref:hover{background:color-mix(in srgb,var(--ink) 7%,transparent)}
.rl{font-weight:600;font-size:13px}
.sn{display:block;font-family:var(--serif);font-size:14px;color:var(--soft);line-height:1.35;margin-top:1px}


/* ---------- register colours (same scales as the leesregister) ---------- */
:root{--r1:#D5DEE4;--r2:#B4C6D2;--r3:#92AEC0;--r4:#6F95AE;--r5:#4E7C9A;--r6:#336385;--r7:#1E4B6B;--r8:#0E3450;
  --c1:#1E4B6B;--c2:#4E7C9A;--c3:#83A6BC;--c4:#B4C9D5;--c5:#DCE4E8;
  --v1:#7FB069;--v2:#A7C66B;--v3:#CBD96E;--v4:#EBDE72;--v5:#F2CB63;--v6:#EFA85C;--v7:#E3815A;--v8:#D1584B;--on-dark:#F2F3EF;
  --case:#e4ddd0;--plank:#8d6239;--plank-hi:#b07d4c;--plank-lo:#5e3f22}
[data-theme=dark]{--r1:#20303B;--r2:#2A4253;--r3:#35566C;--r4:#416A85;--r5:#4E7F9E;--r6:#5E95B6;--r7:#7FB1CD;--r8:#A8CCE2;
  --c1:#A8CCE2;--c2:#6E9FBD;--c3:#4B758F;--c4:#334E60;--c5:#253540;
  --v1:#4F7C45;--v2:#6D8F43;--v3:#8C9B45;--v4:#A99A4A;--v5:#B08746;--v6:#AE6C40;--v7:#A1543E;--v8:#8E3E36;--on-dark:#0E1316;
  --case:#1a1816;--plank:#4b3322;--plank-hi:#664631;--plank-lo:#2c1d12}
@media (prefers-color-scheme:dark){[data-theme=auto]{--r1:#20303B;--r2:#2A4253;--r3:#35566C;--r4:#416A85;--r5:#4E7F9E;--r6:#5E95B6;--r7:#7FB1CD;--r8:#A8CCE2;
  --c1:#A8CCE2;--c2:#6E9FBD;--c3:#4B758F;--c4:#334E60;--c5:#253540;
  --v1:#4F7C45;--v2:#6D8F43;--v3:#8C9B45;--v4:#A99A4A;--v5:#B08746;--v6:#AE6C40;--v7:#A1543E;--v8:#8E3E36;--on-dark:#0E1316;
  --case:#1a1816;--plank:#4b3322;--plank-hi:#664631;--plank-lo:#2c1d12}}

/* ---------- the bookshelf ---------- */
#shelf{position:absolute;inset:0;z-index:30;overflow:auto;background:var(--desk);padding:6px 16px 26px;display:none}
#shelf.on{display:block}
.case{margin:14px auto 0;display:flex;flex-wrap:wrap;width:max-content;background:var(--case);
  border:12px solid var(--plank);border-bottom:0;border-radius:3px 3px 0 0;box-shadow:inset 0 10px 24px -14px rgba(0,0,0,.45),0 18px 40px -18px var(--shadow)}
.bay{position:relative;padding:0 22px}
.case.side .bay+.bay{border-left:12px solid var(--plank)}
.case.stack{display:block}

.row{display:flex;align-items:flex-end;gap:22px;height:var(--rowh);padding:18px 0 0;margin-bottom:22px;position:relative}

  background:linear-gradient(var(--plank-hi),var(--plank) 35%,var(--plank-lo));box-shadow:0 6px 10px -6px rgba(0,0,0,.45)}

.grp{position:relative;display:flex;flex-direction:column;align-items:center}
.books{display:flex;align-items:flex-end;gap:1px}

.sp{position:relative;width:var(--w);height:var(--h);padding:0;border:0;cursor:pointer;border-radius:2px 2px 1px 1px;
  background:linear-gradient(90deg,rgba(0,0,0,.34),rgba(255,255,255,.12) 28%,rgba(255,255,255,.05) 55%,rgba(0,0,0,.36)),var(--c);
  box-shadow:inset 0 0 0 1px rgba(0,0,0,.28),2px 0 3px -1px rgba(0,0,0,.35);color:#efe2bf;

.sp::before,.sp::after{content:"";position:absolute;left:2px;right:2px;height:3px;border-top:1px solid rgba(226,196,122,.75);border-bottom:1px solid rgba(226,196,122,.75)}
.sp::before{top:9px}
.sp::after{bottom:30px}
.sp:hover,.sp:focus-visible{transform:translateY(-9px)}
.sp.pull{transform:translateY(-24px) scale(1.03)}
.sp .nm{writing-mode:vertical-rl;font-family:var(--serif);font-size:var(--fz);letter-spacing:.05em;white-space:nowrap;
  overflow:hidden;max-height:calc(var(--h) - 52px);margin-bottom:12px}
.tag{position:absolute;bottom:9px;left:3px;right:3px;height:12px;border-radius:1px;box-shadow:0 0 0 1px rgba(255,255,255,.35)}
.tag[data-l="2"]{background:#cfdbe4}.tag[data-l="4"]{background:#93afc3}.tag[data-l="6"]{background:#4e7c9a}
.tag[data-l="7"]{background:#2b5a7d}.tag[data-l="8"]{background:#e3c25b}
.rib{position:absolute;bottom:-34px;left:calc(50% - 4px);width:8px;height:42px;background:#e2bf35;z-index:3;
  clip-path:polygon(0 0,100% 0,100% 100%,50% 80%,0 100%);box-shadow:0 2px 2px rgba(0,0,0,.3)}
.shelfnote{max-width:760px;margin:16px auto 0;text-align:center;color:var(--soft);font-size:13px;line-height:1.5}
.shelfnote button{background:none;border:1px solid var(--line);border-radius:7px;padding:4px 10px;margin-left:6px;cursor:pointer}

/* ---------- chapter chooser ---------- */
#chap{position:fixed;z-index:85;width:min(420px,calc(100vw - 24px));max-height:min(78vh,620px);overflow:auto;background:var(--panel);
  border:1px solid var(--line);border-radius:12px;padding:12px 14px 12px;box-shadow:0 22px 50px -12px var(--shadow);display:none}
#chap.on{display:block}
.chh{display:flex;align-items:baseline;gap:10px;margin-bottom:8px}
.chh b{font-family:var(--serif);font-size:19px;font-weight:600}
.chh span{color:var(--soft);font-size:12.5px;flex:1}
#chap .seg{margin-bottom:10px}
#chap .seg button{font-size:12.5px;padding:5px 4px}
.ccg{display:grid;grid-template-columns:repeat(auto-fill,minmax(38px,1fr));gap:3px}
.cc{height:32px;border:1px solid var(--line);background:var(--page);color:var(--ink);font-family:var(--serif);font-size:14px;
  font-feature-settings:"lnum";cursor:pointer;border-radius:3px;padding:0}
.cc:hover{outline:2px solid var(--rubric);outline-offset:-1px}
.ccg[data-view=read] .cc[data-l="1"]{background:var(--r1)}.ccg[data-view=read] .cc[data-l="2"]{background:var(--r2)}
.ccg[data-view=read] .cc[data-l="3"]{background:var(--r3)}.ccg[data-view=read] .cc[data-l="4"]{background:var(--r4)}
.ccg[data-view=read] .cc[data-l="5"]{background:var(--r5);color:var(--on-dark)}.ccg[data-view=read] .cc[data-l="6"]{background:var(--r6);color:var(--on-dark)}
.ccg[data-view=read] .cc[data-l="7"]{background:var(--r7);color:var(--on-dark)}.ccg[data-view=read] .cc[data-l="8"]{background:var(--r8);color:var(--on-dark)}
.ccg[data-view=recency] .cc[data-l="1"]{background:var(--c1);color:var(--on-dark)}.ccg[data-view=recency] .cc[data-l="2"]{background:var(--c2);color:var(--on-dark)}
.ccg[data-view=recency] .cc[data-l="3"]{background:var(--c3)}.ccg[data-view=recency] .cc[data-l="4"]{background:var(--c4)}
.ccg[data-view=recency] .cc[data-l="5"]{background:var(--c5)}.ccg[data-view=recency] .cc[data-l="6"]{border-style:dotted;border-color:var(--rubric)}
.ccg[data-view=verses] .cc[data-l="1"]{background:var(--v1)}.ccg[data-view=verses] .cc[data-l="2"]{background:var(--v2)}
.ccg[data-view=verses] .cc[data-l="3"]{background:var(--v3)}.ccg[data-view=verses] .cc[data-l="4"]{background:var(--v4)}
.ccg[data-view=verses] .cc[data-l="5"]{background:var(--v5)}.ccg[data-view=verses] .cc[data-l="6"]{background:var(--v6)}
.ccg[data-view=verses] .cc[data-l="7"]{background:var(--v7)}.ccg[data-view=verses] .cc[data-l="8"]{background:var(--v8)}
.ccg[data-view=binary] .cc[data-l="1"]{background:var(--r6);color:var(--on-dark)}
.lg{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin-top:10px;font-size:11.5px;color:var(--soft)}
.lg i{display:inline-block;width:15px;height:12px;border:1px solid var(--line);vertical-align:middle}
#resume{font-family:var(--serif);font-size:15px;border:1px solid var(--line)}
#regbtn,#libbtn{display:flex;align-items:center;gap:7px;text-decoration:none;font-family:var(--serif);font-size:15px}
#regbtn svg,#libbtn svg{width:17px;height:17px}
body.phone #regbtn span,body.phone #libbtn span{display:none}
#home svg{width:20px;height:20px;display:block}

/* ---------- notes ---------- */
#notesbtn{position:relative}
#notesbtn svg,#findbtn svg{width:20px;height:20px;display:block}
#notesbtn[aria-pressed=true]{background:color-mix(in srgb,var(--ink) 10%,transparent)}
#notesbtn .dot{position:absolute;top:5px;right:6px;width:7px;height:7px;border-radius:50%;background:var(--rubric)}
#notes{position:absolute;top:0;right:0;bottom:0;width:min(420px,92vw);z-index:45;display:flex;flex-direction:column;
  background:var(--panel);border-left:1px solid var(--line);box-shadow:-20px 0 44px -22px var(--shadow);
  transform:translateX(104%);visibility:hidden;transition:transform .24s cubic-bezier(.2,.7,.2,1),visibility 0s .24s}
#notes.open{transform:none;visibility:visible;transition:transform .24s cubic-bezier(.2,.7,.2,1),visibility 0s}
#notes.open.pinned{position:relative;flex:none;box-shadow:none;transition:none}
.nhead{display:flex;align-items:center;gap:8px;padding:10px 12px 6px 16px}
.ntabs button{font-family:var(--serif);font-size:15px;padding:4px 12px}
.shead{display:flex;gap:6px;align-items:center;margin-bottom:6px}
.shead input,.sref{font-family:var(--serif);font-size:15px;color:var(--ink);background:var(--page);border:1px solid var(--line);border-radius:6px;padding:5px 8px;min-width:0}
.shead .sp{flex:1}
.shead .sd{flex:none;font-family:var(--sans);font-size:13px}
.sref{display:block;width:100%;margin-bottom:6px;font-style:italic}
.sdel{background:none;border:0;color:var(--soft);cursor:pointer;padding:4px;border-radius:6px}
.sdel:hover{color:var(--rubric)}
.sdel svg{width:18px;height:18px;display:block}
.sheet.serm{padding-top:2px}
.snew{display:block;width:100%;border:1px dashed var(--line);background:none;border-radius:8px;padding:8px;margin:0 0 12px;cursor:pointer;font-family:var(--serif);font-size:15px;color:var(--ink)}
.snew:hover{border-color:var(--soft)}
.sempty{color:var(--soft);font-size:13px;margin:-4px 2px 12px}
.slist .lnkb{display:block;width:100%;text-align:left}
.nstore{margin:12px 0 0;font-size:11.5px;color:var(--faint)}
.nstore.warn{color:var(--rubric)}
/* ---------- word marks ---------- */
:root{--edgeln:#dcd6ca;--hy:rgba(255,212,0,.42);--hg:rgba(90,190,110,.36);--hb:rgba(90,160,240,.33);--hp:rgba(240,110,170,.32);--ho:rgba(255,150,40,.36);--hv:rgba(155,95,220,.30);--cr:#b3261e;--cb:#1f4fa3;--cg:#2e7d32;--cy:#a07800;--co:#c25400;--cv:#7b3fa0}
[data-theme=dark]{--edgeln:#33302c;--hy:rgba(240,200,40,.30);--hg:rgba(110,200,120,.26);--hb:rgba(110,170,250,.27);--hp:rgba(245,120,180,.26);--ho:rgba(255,160,60,.28);--hv:rgba(175,125,240,.30);--cr:#ff8a80;--cb:#8ab4f8;--cg:#81c995;--cy:#f2c94c;--co:#ffab61;--cv:#c79bf2}
@media (prefers-color-scheme:dark){[data-theme=auto]{--edgeln:#33302c;--hy:rgba(240,200,40,.30);--hg:rgba(110,200,120,.26);--hb:rgba(110,170,250,.27);--hp:rgba(245,120,180,.26);--ho:rgba(255,160,60,.28);--hv:rgba(175,125,240,.30);--cr:#ff8a80;--cb:#8ab4f8;--cg:#81c995;--cy:#f2c94c;--co:#ffab61;--cv:#c79bf2}}
.h-y,.h-g,.h-b,.h-p{border-radius:2px;-webkit-box-decoration-break:clone;box-decoration-break:clone}
.h-y{background:var(--hy)}.h-g{background:var(--hg)}.h-b{background:var(--hb)}.h-p{background:var(--hp)}.h-o{background:var(--ho)}.h-v{background:var(--hv)}
.c-r{color:var(--cr)}.c-b{color:var(--cb)}.c-g{color:var(--cg)}.c-y{color:var(--cy)}.c-o{color:var(--co)}.c-v{color:var(--cv)}
#markbar{position:fixed;z-index:90;display:none;align-items:center;gap:4px;padding:5px 6px;background:var(--panel);border:1px solid var(--line);
  border-radius:10px;box-shadow:0 12px 30px -10px var(--shadow)}
#markbar.on{display:flex}
#markbar button{width:28px;height:28px;border-radius:7px;border:1px solid transparent;background:none;cursor:pointer;padding:0;
  font-family:var(--serif);font-size:17px;font-weight:600;display:flex;align-items:center;justify-content:center}
#markbar button:hover{border-color:var(--line)}
#markbar [data-h] {background-clip:content-box;padding:4px}
#markbar [data-h=y]{background-color:var(--hy)}#markbar [data-h=g]{background-color:var(--hg)}#markbar [data-h=b]{background-color:var(--hb)}#markbar [data-h=p]{background-color:var(--hp)}#markbar [data-h=o]{background-color:var(--ho)}#markbar [data-h=v]{background-color:var(--hv)}
#markbar [data-c=r]{color:var(--cr)}#markbar [data-c=b]{color:var(--cb)}#markbar [data-c=g]{color:var(--cg)}#markbar [data-c=y]{color:var(--cy)}#markbar [data-c=o]{color:var(--co)}#markbar [data-c=v]{color:var(--cv)}
.mg{display:flex;align-items:center;gap:4px}
body.phone #markbar{flex-direction:column;align-items:stretch;gap:2px}
body.phone #markbar .msep.top{display:none}
#markbar [data-x]{color:var(--soft)} #markbar [data-x] svg{width:16px;height:16px}
.msep{width:1px;height:20px;background:var(--line);margin:0 3px}
body.phone #markbar button{width:36px;height:36px}
@media (pointer:coarse){ #flow{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none} }
::highlight(pick){background-color:rgba(70,130,220,.32)}
/* handles at both ends of a selection on a touch screen: drag them to adjust it word by word */
.hdl{position:fixed;z-index:89;width:44px;margin-left:-22px;display:none;touch-action:none;-webkit-user-select:none;user-select:none;cursor:grab}
.hdl.on{display:block}
.hdl::before{content:"";position:absolute;left:21px;top:0;width:2px;height:var(--lh,20px);background:#3c78d0;border-radius:1px}
.hdl::after{content:"";position:absolute;left:12px;top:var(--lh,20px);width:20px;height:20px;background:#3c78d0;box-shadow:0 1px 3px rgba(0,0,0,.35)}
#hA::after{border-radius:50% 0 50% 50%}
#hB::after{border-radius:0 50% 50% 50%}
.hdl.drag::after{transform:scale(1.15)}
body.phone #book{touch-action:none}
.npass{flex:1;color:var(--soft);font-family:var(--serif);font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nbtn{background:none;border:1px solid transparent;border-radius:7px;padding:4px 6px;cursor:pointer;color:var(--soft)}
.nbtn:hover{color:var(--ink);border-color:var(--line)}
.nbtn svg{width:18px;height:18px;display:block}
.nbtn[aria-pressed=true]{color:var(--sel-ink);background:var(--sel)}
.ntext{font-size:12.5px;padding:5px 8px;border-color:var(--line)}
.ntools{display:flex;flex-wrap:wrap;align-items:center;gap:6px 8px;padding:4px 14px 10px;border-bottom:1px solid var(--line)}
.ntool button{font-size:12.5px;padding:5px 9px}
.inks{display:flex;gap:5px}
.inks button{width:20px;height:20px;border-radius:50%;border:2px solid var(--panel);box-shadow:0 0 0 1px var(--line);cursor:pointer;padding:0}
.inks button[aria-pressed=true]{box-shadow:0 0 0 2px var(--ink)}
.inks [data-ink=ink]{background:var(--ink)} .inks [data-ink=blue]{background:var(--nblue)}
.inks [data-ink=red]{background:var(--nred)} .inks [data-ink=green]{background:var(--ngreen)}
.nsize button{padding:4px 8px;display:flex;align-items:center;justify-content:center}
.nsize i{display:block;border-radius:50%;background:currentColor}
.nsize [data-size="1.4"] i{width:4px;height:4px}.nsize [data-size="2.4"] i{width:7px;height:7px}.nsize [data-size="4"] i{width:11px;height:11px}
#notes[data-tool=type] .inks,#notes[data-tool=type] .nsize{opacity:.4}
.nbody{flex:1;min-height:0;overflow:auto;padding:12px 14px 18px}
.sheet{margin:0 0 16px}
.sheet h4{margin:0 0 6px;font-family:var(--serif);font-weight:600;font-size:15px;display:flex;justify-content:space-between;align-items:baseline}
.sheet h4 span{font-weight:400;font-size:11.5px;color:var(--faint);font-family:var(--sans)}
.paper{position:relative;background-color:var(--page);border:1px solid var(--line);border-radius:4px;overflow:hidden;
  box-shadow:0 1px 2px var(--shadow)}
#notes.lines .paper{background-image:repeating-linear-gradient(to bottom,transparent 0 27px,var(--nline) 27px 28px);background-position:0 8px}
.paper textarea{position:absolute;inset:0;width:100%;height:100%;resize:none;border:0;outline:0;background:transparent;color:var(--ink);
  font:16px/28px var(--serif);padding:8px 14px 14px;box-sizing:border-box;overflow:hidden}
.paper textarea::placeholder{color:var(--faint)}
.paper canvas{position:absolute;left:0;top:0;pointer-events:none}
#notes:not([data-tool=type]) .paper canvas{pointer-events:auto;touch-action:none;cursor:crosshair}
#notes[data-tool=erase] .paper canvas{cursor:cell}
.nmore{margin-top:20px;border-top:1px solid var(--line);padding-top:10px;font-size:12.5px;color:var(--soft)}
.nmore b{display:block;font-weight:600;color:var(--ink);margin-bottom:6px}
.nmore .lnkb{background:none;border:1px solid var(--line);border-radius:6px;padding:2px 8px;margin:0 4px 5px 0;cursor:pointer;font-family:var(--serif);font-size:13.5px}
.nmore .lnkb:hover{border-color:var(--soft)}
.nmore .acts{margin-top:10px;display:flex;gap:8px;flex-wrap:wrap}
.nmore .acts button{background:none;border:1px solid var(--line);border-radius:7px;padding:4px 10px;cursor:pointer;font-size:12.5px}
:root{--nline:#d5dbe3;--nblue:#2457a6;--nred:#b0352b;--ngreen:#2f6b3a}
[data-theme=dark]{--nline:rgba(255,255,255,.09);--nblue:#8db4ee;--nred:#e8907c;--ngreen:#8fc79a}
@media (prefers-color-scheme:dark){[data-theme=auto]{--nline:rgba(255,255,255,.09);--nblue:#8db4ee;--nred:#e8907c;--ngreen:#8fc79a}}

.ngrab{display:none}
body.phone #top{position:absolute;left:0;right:0;top:0;z-index:58;height:auto;min-height:50px;padding:env(safe-area-inset-top,0px) 10px 0;
  background:color-mix(in srgb,var(--desk) 90%,transparent);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);

  border-radius:16px 16px 0 0;transform:translateY(104%);box-shadow:0 -16px 36px -12px var(--shadow)}

body.phone .ngrab{display:block;height:20px;cursor:ns-resize;touch-action:none;flex:none}

body.phone .nhead{padding:6px 10px 4px 14px}
body.phone .ntools{padding:2px 12px 8px;gap:6px}
body.phone .nbody{padding:10px 10px 16px}
@media (prefers-reduced-motion:reduce){.flash{animation:none}.sp{transition:none}#notes,#notes.open{transition:none}body.phone #top{transition:none}}

/* ---------- stronger contrast, for screens that wash out the shading ---------- */

  --fold:rgba(60,40,15,.45);--fold2:rgba(60,40,15,.15);--sheen:rgba(255,255,255,.7);--edgebg:#fffdf8;--edgeln2:#9e937e;--shadow:rgba(30,20,10,.38)}

  --fold:rgba(0,0,0,.85);--fold2:rgba(0,0,0,.32);--sheen:rgba(255,255,255,.06);--edgebg:#958b78;--edgeln2:#3e3933;--shadow:rgba(0,0,0,.8)}

  --fold:rgba(0,0,0,.85);--fold2:rgba(0,0,0,.32);--sheen:rgba(255,255,255,.06);--edgebg:#958b78;--edgeln2:#3e3933;--shadow:rgba(0,0,0,.8)}}


/* gilt page edges, as on a leather Bible: gold, or red under gold */
#book[data-gilt=gold] .edge{background:linear-gradient(rgba(255,250,220,.4),transparent 28%,transparent 72%,rgba(60,35,0,.28)),repeating-linear-gradient(to right,#e6c874 0 1px,#b08835 1px 2px)}
#book[data-gilt=red] .edge{background:linear-gradient(rgba(236,196,104,.55),transparent 22%,transparent 78%,rgba(236,196,104,.42)),repeating-linear-gradient(to right,#a8322b 0 1px,#7a1d18 1px 2px)}
#book[data-gilt] .edge .nt{background:#2b2420}

/* thumb index: a tab for each group of books on the fore-edge, on the side where that group lies */
#thumbs{position:absolute;inset:0;pointer-events:none;z-index:1}
.tab{position:absolute;width:17px;pointer-events:auto;border:0;padding:0;cursor:pointer;display:flex;align-items:center;justify-content:center;
  background:linear-gradient(to right,rgba(255,255,255,.08),transparent 40%,rgba(0,0,0,.25)),#1e1b18;color:#e2c47c;font:600 9.5px/1 var(--sans);letter-spacing:.06em;

/* ---------------- page geometry ----------------
   Every page has A5 proportions. The text flows through CSS columns: one column per page
   (or two, like the printed AOV), with the inner margins of facing pages forming the gap. */
function geomFor(P,ppv,cpp,k,scale,ratio=SQ2){
  let g,mo,mi;
  if(ppv===2){ if(cpp===2){ g=.055*P; mi=g/2; mo=.07*P; } else { mi=.055*P; g=2*mi; mo=.075*P; } }
  else { mo=cpp===2?.07*P:.08*P; g=cpp===2?.055*P:2*mo; mi=mo; }

  return {P,ppv,cpp,g,mo,mi,w,cw,H,mt,mb,h:H-mt-mb,vw:ppv===2?2*w+g:w,fs:k*scale*P,pitch:cw+g};
}

  const two=W/H>1.08&&W>=640&&H>=480&&!phone;
  let P, ratio;
  if(two){ P=Math.min((W-2*pad)/2,(H-2*pad)/SQ2); ratio=SQ2; }
  else { P=Math.min(W-2*pad,(H-2*pad)/.62); ratio=Math.max(.62,Math.min(phone?2.6:1.9,(H-2*pad)/P)); }

/* ---------------- calibration ----------------
   Find the type size at which your A5 sample (Galatians to Jude, without Hebrews) fills
   exactly as many pages as in the printed Bible. Done once per translation and layout. */
async function calibrate(t,cpp,layout){
  const key=t+'|'+cpp+'|'+layout+'|4';
  if(CAL[key]) return CAL[key];
  busy(L.fitting); await frame();
  const m=$('#measure .mflow'), P0=600, target=D.a5pages;
  m.className='mflow '+flowClasses({layout,verses:'on',chapters:'on',headings:'on',gap:'off'});
  let lo=0, hi=1;
  const SEED={aov:{'2lines':.02196,'2para':.02322,'1lines':.02064,'1para':.0238},kjv:{'2lines':.02234,'2para':.0236,'1lines':.02143,'1para':.0242},
              bsb:{'2lines':.02234,'2para':.02382,'1lines':.02123,'1para':.0244}};
  let k=(SEED[t]||{})[cpp+layout]||.022, best=null;
  for(let it=0;it<8;it++){
    const G=geomFor(P0,2,cpp,k,1); styleFlow(m,G);
    m.innerHTML=D.a5books.map(b=>'<div class="cal">'+bookHTML(t,b,false).h+'</div>').join('');
    const fr=m.getBoundingClientRect(), at=x=>Math.floor((x-fr.left+1)/G.pitch);
    let pages=0;
    for(const w of m.querySelectorAll('.cal')){
      const a=w.firstElementChild.getClientRects()[0], vs=w.querySelectorAll('.vs'), zr=vs[vs.length-1].getClientRects();
      pages+=Math.ceil((at(zr[zr.length-1].left)-at(a.left)+1)/cpp);
    }
    if(!best||Math.abs(pages-target)<Math.abs(best.p-target)||(pages===best.p&&k>best.k)) best={k,p:pages};
    if(pages===target) break;
    if(pages<target) lo=Math.max(lo,k); else hi=Math.min(hi,k);
    // Newton-style step on pages ~ size^2, then bisect once the target is bracketed
    k = (lo>0&&hi<1) ? (lo+hi)/2 : k*Math.sqrt(target/pages);
    if(hi<1&&lo>0&&(hi-lo)/lo<.002) break;
  }
  m.innerHTML='';
  CAL[key]=best.k; persist(); busy(null);
  return best.k;
}

/* ---------------- page numbers through the testament ----------------
   Every book is paged in the background with exactly the layout on screen, one book per task,
   so the Old and New Testament can be numbered straight through, as in a printed Bible. */
const CNT={key:'',pages:new Array(66).fill(0),gen:0};
try{ const c=JSON.parse(localStorage.getItem('bybel-leser-pages')||'null'); if(c&&c.key&&c.pages&&c.pages.length===66){ CNT.key=c.key; CNT.pages=c.pages; } }catch(e){}
function countKey(){ const G=CUR.G; if(!G) return '';
  return [S.tr,S.cols,S.layout,S.verses,S.chapters,S.headings,S.gap,S.xref,G.ppv,Math.round(G.cw*10),Math.round(G.h*10),Math.round(G.fs*100)].join('|'); }
function testamentPage(p){ const a=CUR.b<39?0:39; let n=0;
  for(let b=a;b<CUR.b;b++){ if(!CNT.pages[b]) return 0; n+=CNT.pages[b]; } return n+p+1; }
function folioHTML(p){
  const bp=p+1; if(S.folio==='book') return String(bp);
  const tp=testamentPage(p);
  if(!tp) return '<span class="fb">'+bp+'</span>';                     // still counting: the book's own number, faintly
  return S.folio==='testament'? String(tp) : tp+'<span class="fb"> \u00b7 '+bp+'</span>';
}
function updateFolios(){ if(!CUR.G||CUR.par) return; const p0=CUR.spread*CUR.G.ppv;
  for(let k=0;k<CUR.G.ppv;k++){ const p=p0+k, fo=pgs[k].querySelector('.fo'); fo.innerHTML=p<CUR.pages?folioHTML(p):''; } }
function scheduleCounts(){
  if(!CUR.G||S.folio==='book') return;
  const key=countKey(), G=CUR.G, gen=++CNT.gen;
  if(key!==CNT.key){ CNT.key=key; CNT.pages=new Array(66).fill(0); }
  CNT.pages[CUR.b]=CUR.pages;
  const ot=CUR.b<39, first=ot?[0,39]:[39,66], second=ot?[39,66]:[0,39], order=[];
  for(const [a,z] of [first,second]) for(let b=a;b<z;b++) if(!CNT.pages[b]) order.push(b);
  if(!order.length){ updateFolios(); return; }
  const m=$('#measure .cflow');
  m.className='cflow '+flowClasses(S); m.lang=S.tr==='aov'?'af':'en'; styleFlow(m,G);
  let i=0;
  // only when the browser has nothing else to do, so turning pages, typing or dragging is never held up
  const later=()=>window.requestIdleCallback?requestIdleCallback(step,{timeout:2000}):setTimeout(step,30);
  const step=()=>{
    if(gen!==CNT.gen) return;
    if(i>=order.length){ m.innerHTML=''; try{ localStorage.setItem('bybel-leser-pages',JSON.stringify({key:CNT.key,pages:CNT.pages})); }catch(e){} return; }
    const b=order[i++];
    if(!CNT.pages[b]){
      m.innerHTML=bookHTML(S.tr,b,S.xref==='on').h;
      const vs=m.querySelectorAll('.vs'), fr=m.getBoundingClientRect(), rs=vs[vs.length-1].getClientRects();
      CNT.pages[b]=Math.max(1,Math.ceil((Math.floor((rs[rs.length-1].left-fr.left+1)/G.pitch)+1)/G.cpp));
      if((b<39)===(CUR.b<39)&&b<CUR.b) updateFolios();
    }
    later();
  };
  setTimeout(later,700);
}

const pop=$('#pop');
function decodeGroup(s){
  if(s.includes('+')){ const [a,n]=s.split('+').map(Number); return Array.from({length:n+1},(_,i)=>a+i); }
  return s.split('.').map(Number);
}
function groupLabel(t,rows){
  const n=NUM[t], b=bookOf[rows[0]], seen=[];
  for(const r of rows){ const c=n.c[r], v=n.v[r]; if(!seen.length||seen[seen.length-1][0]!==c||seen[seen.length-1][1]!==v) seen.push([c,v]); }
  const contiguous=rows.every((r,i)=>i===0||r===rows[i-1]+1);
  let s=bookAbbr(b,t)+' '+seen[0][0]+':'+seen[0][1];
  if(seen.length>1){
    const z=seen[seen.length-1];
    if(contiguous) s+='\u2013'+(z[0]===seen[0][0]?z[1]:z[0]+':'+z[1]);
    else for(let i=1;i<seen.length;i++) s+=(seen[i][0]===seen[i-1][0]?', '+seen[i][1]:'; '+seen[i][0]+':'+seen[i][1]);
  }
  return s;
}

/* ---------------- the leesregister (shared through this browser's storage) ---------------- */

 'Job','Ps','Prov','Eccl','Song','Isa','Jer','Lam','Ezek','Dan','Hos','Joel','Amos','Obad','Jonah','Mic','Nah','Hab','Zeph','Hag',

const GSIZE=[5,12,5,5,12,5,13,8,1], GROUP=[]; GSIZE.forEach((n,g)=>{ for(let i=0;i<n;i++) GROUP.push(g); });
const booksOf=g=>GROUP.map((x,b)=>x===g?b:-1).filter(b=>b>=0);

const CHV=[];
for(let b=0;b<66;b++){ const n=NUM.aov, m=new Map(); for(let r=D.bs[b];r<D.bs[b+1];r++){ const c=n.c[r]; if(!m.has(c)) m.set(c,new Set()); m.get(c).add(n.v[r]); }
  CHV.push([...m.keys()].sort((a,z)=>a-z).map(c=>m.get(c).size)); }

function level(view,b,c){
  const ds=regDates(b,c), n=ds.length;
  if(view==='read') return n===0?0:n>=10?8:n>=7?7:n;
  if(view==='recency'){ if(!n) return 0; const d=daysAgo(ds[n-1]); return d<=7?1:d<=30?2:d<=90?3:d<=180?4:d<=365?5:6; }
  if(view==='verses'){ const v=CHV[b][c-1], t=[10,16,22,28,35,45,60]; for(let i=0;i<7;i++) if(v<=t[i]) return i+1; return 8; }
  return n?1:0;
}

const shelf=$('#shelf'), caseEl=shelf.querySelector('.case'), chap=$('#chap');

function buildShelf(fit=1){
  loadReg();
  const nm=names(S.tr), SL=S.tr==='aov'?UI.af:UI.en;
  const w0=b=>12+.9*Math.sqrt(D.bs[b+1]-D.bs[b]);
  const rowW=gs=>gs.reduce((s,g)=>s+booksOf(g).reduce((t,b)=>t+w0(b)+1,0),0)+22*(gs.length-1);
  const avail=shelf.clientWidth-32-24;                         // frame
  const wideW=BAYS.map(rows=>Math.max(...rows.map(rowW)));
  const sideNeed=wideW[0]+wideW[1]+44*2+12;
  const side=avail>=sideNeed*.85, layout=side?BAYS:BAYS_NARROW;   // on a narrow screen: one bay above the other, one group per shelf
  const bayW=layout.map(rows=>Math.max(...rows.map(rowW)));
  const scale=fit*(side? Math.min(1.4,avail/sideNeed) : Math.max(.72,Math.min(1.4,(avail-44)/Math.max(...bayW))));
  const H=Math.round(side? Math.max(130,Math.min(235,(shelf.clientHeight-268)/3)) : Math.max(150,Math.min(200,(shelf.clientHeight-70)/3-46)));
  caseEl.className='case '+(side?'side':'stack');
  caseEl.style.setProperty('--rowh',(H+18)+'px');
  let h='';
  layout.forEach((rows,bi)=>{
  h+='<div class="bay"><div class="bayname">'+esc(bi?SL.nt:SL.ot)+'</div>';
  for(const gs of rows){
    h+='<div class="row">';
    for(const g of gs){
      h+='<div class="grp"><div class="books">';
      for(const b of booksOf(g)){
        const w=Math.round(w0(b)*scale), hh=Math.round(H*TALL[g]), fz=Math.max(10,Math.min(15,w*.5));
        const full=nm[b][0], lab=full.length*fz*.58<hh-58?full:nm[b][1];
        const {rd,tot}=bookProgress(b), pct=rd/tot;
        const tag=rd?(rd===tot?8:pct<.25?2:pct<.5?4:pct<.75?6:7):0;
        h+='<button class="sp" type="button" data-b="'+b+'" style="--w:'+w+'px;--h:'+hh+'px;--c:'+CLOTH[g]+';--fz:'+fz+'px" title="'+
           esc(full)+' \u2014 '+rd+L.of+tot+L.chRead+'"><span class="nm">'+esc(lab)+'</span>'+(tag?'<i class="tag" data-l="'+tag+'"></i>':'')+
           (b===CUR.b?'<i class="rib"></i>':'')+'</button>';
      }
      h+='</div><div class="plate">'+esc(SL.groups[g])+'</div></div>';
    }
    h+='</div>';
  }
  h+='</div>';
  });
  caseEl.innerHTML=h;
  const bays=caseEl.querySelectorAll('.bay');
  bays.forEach((el,i)=>{ el.style.width=Math.ceil(bayW[i]*scale+44+(side&&i?12:0))+'px'; });
  if(!side) bays.forEach(el=>{ el.style.width=Math.ceil(Math.max(...bayW)*scale+44)+'px'; });
  // measured, not estimated: if the case is still wider than the room (a scrollbar appeared, rounding), shrink once
  const room=shelf.clientWidth-32;
  if(fit===1&&caseEl.offsetWidth>room&&room>200){ buildShelf(room/caseEl.offsetWidth*.985); return; }
  shelf.querySelector('.shelfnote').innerHTML=esc(L.shelfHint)+'<br>'+(REG?esc(L.regFrom)
    :esc(L.noReg)+' <button type="button" data-act="loadreg">'+esc(L.loadReg)+'</button>');
}

/* ---------------- notes and sermons: typed and hand-written ----------------
   One panel, two tabs. Notes: a sheet for every chapter on the open spread. Sermons: each with
   preacher, date and text, kept apart so they can be told apart and found again later.
   Ink is stored as strokes (not pictures), so it stays sharp and takes little room. */
const NKEY='bybel-notas-v1', SKEY='bybel-preke-v1', LW=360, LH=28;
/* Ink is stored compactly: each stroke is thinned to the points that shape it (no line moves by more than
   half a pixel) and packed as a short string of small steps. A handwritten page takes about 28 KB instead of 375 KB. */
const B64='ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789-_', B64I={}; for(let i=0;i<64;i++) B64I[B64[i]]=i;
function encPts(p){ let out='', px=0, py=0, pp=0;
  const put=v=>{ v=v<0?-2*v-1:2*v; do{ let c=v&31; v=Math.floor(v/32); if(v) c|=32; out+=B64[c]; }while(v); };
  for(let i=0;i<p.length;i+=3){ const x=Math.round(p[i]*2), y=Math.round(p[i+1]*2), q=Math.round(p[i+2]*15); put(x-px); put(y-py); put(q-pp); px=x; py=y; pp=q; }
  return out; }
function decPts(s){ const p=[]; let i=0, px=0, py=0, pp=0;
  const get=()=>{ let v=0, m=1, c; do{ c=B64I[s[i++]]; v+=(c&31)*m; m*=32; }while(c&32); return v&1?-(v+1)/2:v/2; };
  while(i<s.length){ px+=get(); py+=get(); pp+=get(); p.push(px/2,py/2,pp/15); } return p; }
function thin(p){
  const n=p.length/3; if(n<3) return p;
  const pts=[]; for(let i=0;i<n;i++){ const x=p[3*i],y=p[3*i+1],q=p[3*i+2]; const l=pts[pts.length-1];
    if(l&&i<n-1&&Math.hypot(x-l[0],y-l[1])<.8) continue; pts.push([x,y,q]); }
  const keep=new Uint8Array(pts.length); keep[0]=keep[pts.length-1]=1; const stack=[[0,pts.length-1]];
  while(stack.length){ const [a,b]=stack.pop(); if(b-a<2) continue; const A=pts[a],B=pts[b], dx=B[0]-A[0], dy=B[1]-A[1], L=Math.hypot(dx,dy)||1;
    let md=0, mi=-1;
    for(let i=a+1;i<b;i++){ const P=pts[i], t=(i-a)/(b-a);
      const d=Math.max(Math.abs(dy*P[0]-dx*P[1]+B[0]*A[1]-B[1]*A[0])/L, Math.abs(P[2]-(A[2]+(B[2]-A[2])*t))*4);
      if(d>md){ md=d; mi=i; } }
    if(md>.3){ keep[mi]=1; stack.push([a,mi],[mi,b]); } }
  const out=[]; pts.forEach((P,i)=>{ if(keep[i]) out.push(P[0],P[1],P[2]); }); return out; }
const unpackInk=store=>{ for(const k in store){ const n=store[k]; if(n&&n.s) n.s=n.s.map(st=>typeof st[2]==='string'?[st[0],st[1],decPts(st[2])]:st); } return store; };
const packInk=(key,val)=>key==='s'&&Array.isArray(val)?val.map(st=>Array.isArray(st[2])?[st[0],st[1],encPts(st[2])]:st):val;
let NOTES={}; try{ NOTES=unpackInk(JSON.parse(localStorage.getItem(NKEY)||'{}')||{}); }catch(e){ NOTES={}; }
let SERM={};  try{ SERM=unpackInk(JSON.parse(localStorage.getItem(SKEY)||'{}')||{}); }catch(e){ SERM={}; }
const notesEl=$('#notes'), nBody=notesEl.querySelector('.nbody');
let nSaveT=0, nSig='', NUNDO=[], drawing=null, sawPen=false, justMade=null;
const storeOf=st=>st==='s'?SERM:NOTES;
const recGet=sec=>storeOf(sec.dataset.st)[sec.dataset.k]||{};
const recOf=sec=>{ const T_=storeOf(sec.dataset.st); return T_[sec.dataset.k]||(T_[sec.dataset.k]={}); };
const filled=n=>!!n&&!!((n.t&&n.t.trim())||(n.s&&n.s.length));
const hasNote=k=>filled(NOTES[k]);
const sermFilled=n=>filled(n)||!!(n&&n.p&&n.p.trim());
function saveNotes(){ clearTimeout(nSaveT);
  for(const k in NOTES) if(!filled(NOTES[k])) delete NOTES[k];
  try{ localStorage.setItem(NKEY,JSON.stringify(NOTES,packInk)); localStorage.setItem(SKEY,JSON.stringify(SERM,packInk)); }catch(e){ alert(L.nFull); } }
function saveMarks(){ try{ localStorage.setItem(MKEY,JSON.stringify(MARKS)); }catch(e){ alert(L.nFull); } }
const saveNotesSoon=()=>{ clearTimeout(nSaveT); nSaveT=setTimeout(saveNotes,350); };
const notesOpen=()=>notesEl.classList.contains('open');
const cssVar=v=>getComputedStyle(document.documentElement).getPropertyValue(v).trim();
const inkColor=c=>cssVar({ink:'--ink',blue:'--nblue',red:'--nred',green:'--ngreen'}[c]||'--ink');
function keyLabel(k){ const [o,c]=k.split('.'), b=OSIS.indexOf(o); return (b===18?'Psalm':bookName(b))+' '+c; }
const keyOrder=(a,z)=>{ const [ao,ac]=a.split('.'),[zo,zc]=z.split('.'); return (OSIS.indexOf(ao)-OSIS.indexOf(zo))||(ac-zc); };
const sermOrder=(a,z)=>((SERM[z].d||'').localeCompare(SERM[a].d||''))||z.localeCompare(a);
const sermonsFor=keys=>Object.keys(SERM).filter(id=>keys.includes(SERM[id].k)).sort(sermOrder);
function sermLabel(id){ const n=SERM[id]; return [n.d?fmtDate(n.d):'',(n.p||'').trim(),(n.r||'').trim()||keyLabel(n.k)].filter(Boolean).join(' \u00b7 '); }

function spreadChapters(){
  if(!CUR.G||CUR.b<0) return [];
  const p0=CUR.spread*CUR.G.ppv, fv=firstOnPage(p0), lv=lastOnPage(Math.min(CUR.pages-1,p0+CUR.G.ppv-1)), cs=[];
  for(let i=fv;i<=lv;i++){ const c=CUR.V[i].c; if(cs[cs.length-1]!==c) cs.push(c); }
  return cs;
}
function updateNotesBadge(){
  const keys=spreadChapters().map(c=>OSIS[CUR.b]+'.'+c);
  $('#notesbtn .dot').hidden=!(keys.some(hasNote)||sermonsFor(keys).some(id=>sermFilled(SERM[id])));
}
const TRASH='<svg viewBox="0 0 20 20" aria-hidden="true"><path d="M4.5 6h11M8 6V4.5h4V6M6 6l.8 10h6.4L14 6" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linejoin="round"/></svg>';
function makeSheet(st,k){
  const n=storeOf(st)[k]||{}, sec=document.createElement('section');
  sec.className='sheet'+(st==='s'?' serm':''); sec.dataset.st=st; sec.dataset.k=k;
  const paper='<div class="paper"><textarea spellcheck="true" placeholder="'+esc(st==='s'?L.sPlace:L.nPlace)+'"></textarea><canvas></canvas></div>';
  sec.innerHTML= st==='s'
    ? '<div class="shead"><input class="sp" data-f="p" list="preachers" autocomplete="off" placeholder="'+esc(L.sPreacher)+'" aria-label="'+esc(L.sPreacher)+'">'+
      '<input class="sd" type="date" data-f="d" aria-label="'+esc(L.sDate)+'"><button type="button" class="sdel" data-n="sdel" title="'+esc(L.sDelete)+'" aria-label="'+esc(L.sDelete)+'">'+TRASH+'</button></div>'+
      '<input class="sref" data-f="r" autocomplete="off" placeholder="'+esc(L.sText)+'" aria-label="'+esc(L.sText)+'">'+paper
    : '<h4>'+esc(keyLabel(k))+(n.u?'<span>'+fmtDate(n.u)+'</span>':'')+'</h4>'+paper;
  sec.querySelector('textarea').value=n.t||'';
  if(st==='s'){ sec.querySelector('.sp').value=n.p||''; sec.querySelector('.sd').value=n.d||''; sec.querySelector('.sref').value=n.r||''; }
  return sec;
}
function renderNotes(force){
  updateNotesBadge();
  if(!notesOpen()) return;
  const tab=S.notesTab==='s'?'s':'n';
  const cs=spreadChapters(), keys=cs.map(c=>OSIS[CUR.b]+'.'+c);
  if(tab==='s') for(const id in SERM) if(id!==justMade&&!sermFilled(SERM[id])) delete SERM[id];   // an empty sermon left behind is not kept
  const ids=tab==='s'?sermonsFor(keys):keys, sig=tab+'|'+ids.join();
  if(!force&&sig===nSig) return;
  if(drawing) return;
  saveNotes();
  const kept=new Map([...nBody.querySelectorAll('.sheet')].map(e=>[e.dataset.st+e.dataset.k,e]));
  const sameStart=kept.has(tab+ids[0]), top=nBody.scrollTop;
  nSig=sig;
  notesEl.querySelector('.npass').textContent=cs.length?(CUR.b===18&&cs.length===1?'Psalm':bookName(CUR.b))+' '+(cs.length>1?cs[0]+'\u2013'+cs[cs.length-1]:cs[0]):'';
  notesEl.querySelectorAll('[data-tab]').forEach(b=>b.setAttribute('aria-pressed',b.dataset.tab===tab));
  // sheets still on the spread are moved, not rebuilt: no flash, no lost scroll position, no lost cursor
  const fresh=[], secs=ids.map(k=>{ let e=!force&&kept.get(tab+k); if(!e){ e=makeSheet(tab,k); fresh.push(e); } return e; });
  const head=[];
  if(tab==='s'){ const nb=document.createElement('button'); nb.type='button'; nb.className='snew'; nb.dataset.n='snew'; nb.textContent='+ '+L.sNew; head.push(nb);
    if(!ids.length){ const p=document.createElement('p'); p.className='sempty'; p.textContent=L.sNone; head.push(p); } }
  const more=document.createElement('div'); more.className='nmore';
  if(tab==='s'){
    const others=Object.keys(SERM).filter(id=>!ids.includes(id)&&sermFilled(SERM[id])).sort(sermOrder);
    more.innerHTML=(others.length?'<b>'+esc(L.sAll)+'</b><div class="slist">'+others.map(id=>'<button type="button" class="lnkb" data-goto="'+SERM[id].k+'">'+esc(sermLabel(id))+'</button>').join('')+'</div>':'');
    const names=[...new Set(Object.values(SERM).map(n=>(n.p||'').trim()).filter(Boolean))].sort();
    $('#preachers').innerHTML=names.map(p=>'<option value="'+esc(p)+'">').join('');
  } else {
    const others=Object.keys(NOTES).filter(k=>hasNote(k)&&!keys.includes(k)).sort(keyOrder);
    more.innerHTML=(others.length?'<b>'+esc(L.nOther)+'</b>'+others.map(k=>'<button type="button" class="lnkb" data-goto="'+k+'">'+esc(keyLabel(k))+'</button>').join(''):'');
  }
  more.innerHTML+='<div class="acts"><button type="button" data-n="backup">'+esc(L.nBackup)+'</button><button type="button" data-n="restore">'+esc(L.nRestore)+'</button></div>'+storageLine();
  const focusEl=document.activeElement&&nBody.contains(document.activeElement)?document.activeElement:null;
  let sel=null; try{ sel=focusEl&&[focusEl.selectionStart,focusEl.selectionEnd]; }catch(e){}
  nBody.replaceChildren(...head,...secs,more);
  fresh.forEach(sizeSheet);
  if(focusEl&&focusEl.isConnected){ focusEl.focus({preventScroll:true}); try{ focusEl.setSelectionRange(sel[0],sel[1]); }catch(e){} }
  nBody.scrollTop=sameStart&&!force?top:0;
}
function middleChapter(){ const p0=CUR.spread*CUR.G.ppv, fv=firstOnPage(p0), lv=lastOnPage(Math.min(CUR.pages-1,p0+CUR.G.ppv-1));
  return CUR.V[Math.floor((fv+lv)/2)].c; }
const normName=x=>x.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[\s.]/g,'');
function keyFromText(txt){
  const m=/^\s*([1-3]?\s*[^\d\s:.,;\-\u2013]+)\.?\s*(\d+)/.exec(txt||''); if(!m) return null;
  const q=normName(m[1]); if(q.length<2) return null;
  let b=-1;
  for(const list of [D.names.af,D.names.en]) for(let i=0;i<66&&b<0;i++){ const [n,a]=list[i]; if(normName(n)===q||normName(a)===q) b=i; }
  for(const list of [D.names.af,D.names.en]) for(let i=0;i<66&&b<0;i++){ if(normName(list[i][0]).startsWith(q)) b=i; }
  if(b<0){ const o=OSIS.findIndex(x=>x.toLowerCase()===q); b=o; }
  const c=+m[2]; return b>=0&&c>=1&&c<=CHV[b].length?OSIS[b]+'.'+c:null;
}
function storageLine(){
  let used=0; try{ for(let i=0;i<localStorage.length;i++){ const k=localStorage.key(i); used+=k.length+(localStorage.getItem(k)||'').length; } }catch(e){ return ''; }
  const mb=used/1048576, full=mb/5, size=mb<1?Math.max(1,Math.round(used/1024))+' KB':mb.toFixed(1)+' MB';
  return '<p class="nstore'+(full>.7?' warn':'')+'">'+esc(L.nStore.replace('{size}',size))+'</p>';
}
function newSermon(){
  const cs=spreadChapters(); if(!cs.length) return;
  for(const id in SERM) if(!sermFilled(SERM[id])) delete SERM[id];
  const k=OSIS[CUR.b]+'.'+middleChapter(), id='s'+Date.now().toString(36);
  SERM[id]={k,d:todayISO(),r:keyLabel(k),p:S.lastPreacher||'',u:todayISO()}; justMade=id;
  saveNotes(); renderNotes(true);
  const sec=nBody.querySelector('.sheet[data-st="s"][data-k="'+id+'"]');
  if(sec){ sec.scrollIntoView({block:'nearest'}); const p=sec.querySelector('.sp'); p.focus(); p.select(); }
}
function sizeSheet(sec){
  const n=recGet(sec), paper=sec.querySelector('.paper'), ta=sec.querySelector('textarea'), cv=sec.querySelector('canvas');
  const W=paper.clientWidth||LW, sc=W/LW;
  ta.style.height='0px'; const th=ta.scrollHeight; ta.style.height='';
  let inkBottom=0; for(const st of (n.s||[])) for(let i=1;i<st[2].length;i+=3) inkBottom=Math.max(inkBottom,st[2][i]);
  const h=Math.ceil(Math.max(LH*7+8, th+LH, (inkBottom+LH*2)*sc, (n.h||0)*sc)/LH)*LH+8;
  paper.style.height=h+'px';
  const dpr=devicePixelRatio||1; cv.width=Math.round(W*dpr); cv.height=Math.round(h*dpr); cv.style.width=W+'px'; cv.style.height=h+'px';
  drawSheet(sec);
}
function strokeCtx(cv){ const ctx=cv.getContext('2d'), sc=cv.width/LW; ctx.setTransform(sc,0,0,sc,0,0); ctx.lineCap='round'; ctx.lineJoin='round'; return ctx; }
function drawStroke(ctx,st,from){

  if(p.length===3){ ctx.beginPath(); ctx.arc(p[0],p[1],w*(.35+p[2]*1.3)/2,0,7); ctx.fill(); return; }
  for(let i=Math.max(3,from||3);i<p.length;i+=3){
    ctx.lineWidth=w*(.35+p[i+2]*1.3); ctx.beginPath(); ctx.moveTo(p[i-3],p[i-2]); ctx.lineTo(p[i],p[i+1]); ctx.stroke(); }

function drawSheet(sec){

  sec._inked=true;
  const cv=sec.querySelector('canvas'), ctx=cv.getContext('2d'); ctx.setTransform(1,0,0,1,0,0); ctx.clearRect(0,0,cv.width,cv.height);

}
function touchRec(sec){ recOf(sec).u=todayISO(); updateNotesBadge(); }
function eraseAt(d,pt){

}

  const pt=ev=>[+((ev.clientX-r.left)/sc).toFixed(1),+((ev.clientY-r.top)/sc).toFixed(1),ev.pointerType==='pen'?+((ev.pressure||.5)).toFixed(2):.5];
  if(S.notesTool==='erase'){ drawing={erase:true,sec,pt,removed:[]}; eraseAt(drawing,pt(e)); return; }
  const st=[S.penColor,S.penSize,pt(e)], n=recOf(sec); (n.s=n.s||[]).push(st);

nBody.addEventListener('pointermove',e=>{

  if(drawing.erase){ for(const ev of evs) eraseAt(drawing,drawing.pt(ev)); return; }
  const p=drawing.st[2], from=p.length; for(const ev of evs) p.push(...drawing.pt(ev));
  drawStroke(strokeCtx(drawing.cv),drawing.st,from);
  const y=p[p.length-2]*(drawing.cv.clientWidth/LW);

});

/* ---------------- marking words in the text ----------------
   Select words (drag, or hold on a phone); a small bar offers highlight and text colours.
   A mark always covers whole words, even if the selection stops part-way through one. */
const markbar=$('#markbar');
const rwText=rw=>{ const x=rw.querySelector('.xm'); return x?rw.textContent.slice(0,-x.textContent.length):rw.textContent; };
function offsetIn(rw,node,off){ const r=document.createRange(); r.setStart(rw,0); r.setEnd(node,off); return r.toString().length; }
function pickedRange(){
  if(PICK.range&&PICK.range.startContainer.isConnected) return PICK.range;
  const sel=getSelection(); if(!sel.rangeCount||sel.isCollapsed) return null;
  const rg=sel.getRangeAt(0); return flow.contains(rg.commonAncestorContainer)?rg:null;
}
function selectedWords(){
  const rg=pickedRange(); if(!rg) return null;
  const out=[];
  for(const rw of flow.querySelectorAll('.rw')){
    if(!rg.intersectsNode(rw)) continue;
    const words=[...rwText(rw).matchAll(/\S+/g)].map(m=>[m.index,m.index+m[0].length]); if(!words.length) continue;
    let a=0, b=words.length-1;
    if(rw.contains(rg.startContainer)){ const p=offsetIn(rw,rg.startContainer,rg.startOffset); a=words.findIndex(w=>w[1]>p); if(a<0) continue; }
    if(rw.contains(rg.endContainer)){ const p=offsetIn(rw,rg.endContainer,rg.endOffset); b=-1; words.forEach((w,i)=>{ if(w[0]<p) b=i; }); }
    if(a>=0&&a<=b) out.push({r:+rw.dataset.r,a,b,t:rw.dataset.t||S.tr});
  }
  return out.length?out:null;
}
function applyMark(kind,val){
  const ws=selectedWords(); if(!ws) return;
  const slot=kind==='h'?0:1, Mof=t=>MARKS[t]||(MARKS[t]={});
  // the same colour on words that all have it already takes it off again
  const all=kind!=='x'&&ws.every(({r,a,b,t})=>{ const M=Mof(t); for(let w=a;w<=b;w++){ const c=(M[r]||{})[w]; if(!c||c[slot]!==val) return false; } return true; });
  for(const {r,a,b,t} of ws){
    const M=Mof(t), m=M[r]||(M[r]={});
    for(let w=a;w<=b;w++){
      let c=m[w]||'--';
      if(kind==='x') c='--'; else c=slot===0?(all?'-':val)+c[1]:c[0]+(all?'-':val);
      if(c==='--') delete m[w]; else m[w]=c;
    }
    if(!Object.keys(m).length) delete M[r];
    for(const el of flow.querySelectorAll('.rw[data-r="'+r+'"]')){ if((el.dataset.t||S.tr)!==t) continue; el.outerHTML=el.dataset.t?sideRow(t,r):rowHTML(t,r,S.xref==='on'); }   // colour never moves the text, so no re-paging
  }
  saveMarks(); getSelection().removeAllRanges(); clearPick(); hideMarkbar();
}
function hideMarkbar(){ markbar.classList.remove('on'); }
let mbT=0;
function placeMarkbar(){
  const rg=pickedRange(); if(!rg||!selectedWords()){ hideMarkbar(); return; }
  const r=rg.getBoundingClientRect(); markbar.classList.add('on');
  const w=markbar.offsetWidth, h=markbar.offsetHeight, coarse=matchMedia('(pointer: coarse)').matches;
  let y=coarse? r.bottom+38 : r.top-h-10; if(y<8) y=r.bottom+10; if(y+h>innerHeight-8) y=Math.max(8,r.top-h-10);
  markbar.style.left=Math.min(Math.max(8,r.left+r.width/2-w/2),innerWidth-w-8)+'px'; markbar.style.top=y+'px';
}
document.addEventListener('selectionchange',()=>{ if(PICK.range) return; clearTimeout(mbT); mbT=setTimeout(placeMarkbar,140); });

/* On a touch screen the phone's own text selection is switched off (it brings up Copy, Select all and
   Web search). Instead: hold a word, then slide to take in more words; the marking bar appears on release.
   Tap anywhere else to let go of the selection. */
const PICK={range:null,a:null,b:null,hold:0,drag:false,swallow:false,x:0,y:0};
function textNodesOf(rw){ const out=[]; let acc=0;
  const tw=document.createTreeWalker(rw,NodeFilter.SHOW_TEXT,{acceptNode:n=>n.parentElement.closest('.xm')?NodeFilter.FILTER_REJECT:NodeFilter.FILTER_ACCEPT});
  let n; while((n=tw.nextNode())){ out.push([n,acc]); acc+=n.data.length; } return out; }
function rangeAt(nodes,a,z){ const r=document.createRange();
  const at=(pos,end)=>{ for(let i=0;i<nodes.length;i++){ const [n,o]=nodes[i]; if(pos<o+n.data.length||(end&&pos===o+n.data.length)) return [n,pos-o]; } const [n,o]=nodes[nodes.length-1]; return [n,n.data.length]; };
  r.setStart(...at(a,false)); r.setEnd(...at(z,true)); return r; }
function wordAt(x,y){
  const el=document.elementFromPoint(x,y); const rw=el&&el.closest&&el.closest('#flow .rw'); if(!rw) return null;
  const nodes=textNodesOf(rw), txt=nodes.map(([n])=>n.data).join(''), re=/\S+/g; let m, w=0;
  while((m=re.exec(txt))){ const r=rangeAt(nodes,m.index,m.index+m[0].length);
    for(const q of r.getClientRects()) if(x>=q.left-3&&x<=q.right+3&&y>=q.top-2&&y<=q.bottom+2) return {rw,w,r};
    w++; }
  return null;
}
function paintPick(){
  const all=[...flow.querySelectorAll('.rw')], ia=all.indexOf(PICK.a.rw), ib=all.indexOf(PICK.b.rw);
  const [p,q]=(ia<ib||(ia===ib&&PICK.a.w<=PICK.b.w))?[PICK.a,PICK.b]:[PICK.b,PICK.a];
  const rg=document.createRange(); rg.setStart(p.r.startContainer,p.r.startOffset); rg.setEnd(q.r.endContainer,q.r.endOffset);
  PICK.range=rg; PICK.p=p; PICK.q=q; placeHandles();
  if(window.CSS&&CSS.highlights&&window.Highlight) CSS.highlights.set('pick',new Highlight(rg));
  else { const s=getSelection(); s.removeAllRanges(); s.addRange(rg); }
}
function clearPick(){ PICK.range=PICK.a=PICK.b=null; PICK.drag=false; clearTimeout(PICK.hold); hideHandles();
  if(window.CSS&&CSS.highlights) CSS.highlights.delete('pick'); }
book.addEventListener('pointerdown',e=>{

  PICK.hold=setTimeout(()=>{ const w=wordAt(PICK.x,PICK.y); if(!w) return;
    hideMarkbar(); PICK.a=PICK.b=w; PICK.drag=true; paintPick(); if(navigator.vibrate) navigator.vibrate(12); },450);
});
book.addEventListener('pointermove',e=>{

const endPick=e=>{ if(e.pointerType!=='touch') return; clearTimeout(PICK.hold);
  if(PICK.drag){ PICK.drag=false; PICK.swallow=true; placeMarkbar(); } };
book.addEventListener('pointerup',endPick); book.addEventListener('pointercancel',endPick);
book.addEventListener('contextmenu',e=>{ if(matchMedia('(pointer: coarse)').matches||PICK.range) e.preventDefault(); });
markbar.addEventListener('pointerdown',e=>e.preventDefault());       // keep the selection while a colour is chosen

/* The two handles: once a selection is made, either end can be dragged to take in more or fewer words.
   The word is found a little above the finger, so the finger does not hide what is being selected. */
const HA=$('#hA'), HB=$('#hB'); let HDRAG=null;
function hideHandles(){ HA.classList.remove('on','drag'); HB.classList.remove('on','drag'); }
function placeHandles(){
  const rg=PICK.range; if(!rg){ hideHandles(); return; }
  const rs=[...rg.getClientRects()].filter(r=>r.width>0&&r.height>0); if(!rs.length){ hideHandles(); return; }
  const f=rs[0], l=rs[rs.length-1];
  for(const [el,x,r] of [[HA,f.left,f],[HB,l.right,l]]){ el.style.left=x+'px'; el.style.top=r.top+'px'; el.style.setProperty('--lh',r.height+'px'); el.style.height=(r.height+22)+'px'; el.classList.add('on'); }
}
function handleDown(e){
  if(!PICK.range) return; e.preventDefault(); e.stopPropagation();
  const isA=e.currentTarget===HA, el=e.currentTarget, lh=parseFloat(el.style.getPropertyValue('--lh'))||20;
  PICK.a=isA?PICK.q:PICK.p; PICK.b=isA?PICK.p:PICK.q;              // the other end stays put
  HDRAG={el,off:e.clientY-(parseFloat(el.style.top)+lh/2)};
  el.classList.add('drag'); el.setPointerCapture(e.pointerId); hideMarkbar();
}
function handleMove(e){
  if(!HDRAG) return; e.preventDefault();
  const y=e.clientY-HDRAG.off;
  let w=wordAt(e.clientX,y); for(const dx of [-8,8,-16,16]){ if(w) break; w=wordAt(e.clientX+dx,y); }
  if(w&&(w.rw!==PICK.b.rw||w.w!==PICK.b.w)){ PICK.b=w; paintPick(); HDRAG.el.classList.add('drag'); if(navigator.vibrate) navigator.vibrate(4); }
}
function handleUp(){ if(!HDRAG) return; HDRAG.el.classList.remove('drag'); HDRAG=null; placeHandles(); placeMarkbar(); }
for(const h of [HA,HB]){ h.addEventListener('pointerdown',handleDown); h.addEventListener('pointermove',handleMove);
  h.addEventListener('pointerup',handleUp); h.addEventListener('pointercancel',handleUp); h.addEventListener('contextmenu',e=>e.preventDefault()); }
markbar.addEventListener('click',e=>{ const b=e.target.closest('button'); if(!b) return;
  if(b.dataset.h) applyMark('h',b.dataset.h); else if(b.dataset.c) applyMark('c',b.dataset.c); else applyMark('x'); });

// the handle and the whole title row of the sheet can be dragged (a finger lands on the row as often as on the handle)
function startGrab(e){
  if(!isPhone()||e.target.closest('button')) return;
  e.preventDefault(); grabbing={r:$('#work').getBoundingClientRect(),y:e.clientY};
  addEventListener('pointermove',moveGrab); addEventListener('pointerup',endGrab); addEventListener('pointercancel',endGrab);
}
function moveGrab(e){ if(!grabbing||Math.abs(e.clientY-grabbing.y)<4&&grabbing.f===undefined) return;
  const r=grabbing.r, f=Math.max(.12,Math.min(.92,(r.bottom-e.clientY)/r.height));
  grabbing.f=f; notesEl.style.setProperty('--nh',(f*100).toFixed(1)+'%'); }
function endGrab(){
  removeEventListener('pointermove',moveGrab); removeEventListener('pointerup',endGrab); removeEventListener('pointercancel',endGrab);
  if(!grabbing) return; const f=grabbing.f; grabbing=null; if(f===undefined) return;
  if(f<.2){ S.notesOpen=false; saveNotes(); notesEl.style.removeProperty('--nh'); S.notesH=0; } else S.notesH=+f.toFixed(3);
  persist(); applyNotesUI();
  requestAnimationFrame(()=>{ lastStage=''; if(CUR.G) relayout(false); }); }

notesEl.querySelector('.nhead').addEventListener('pointerdown',startGrab);

let downX=0,downY=0,swiped=false;
book.addEventListener('pointerdown',e=>{ downX=e.clientX; downY=e.clientY; swiped=false; });
book.addEventListener('pointerup',e=>{
  if(e.pointerType!=='touch'||PICK.range) return;
  const dx=e.clientX-downX, dy=e.clientY-downY;
  if(Math.abs(dx)>45&&Math.abs(dx)>Math.abs(dy)*1.3){ swiped=true; dx<0?next():prev(); }

book.addEventListener('click',e=>{
  if(PICK.swallow){ PICK.swallow=false; return; }
  if(PICK.range){ clearPick(); hideMarkbar(); return; }
  if(swiped){ swiped=false; return; }
  const xa=e.target.closest('.xa'); if(xa){ e.stopPropagation(); openPop(xa); return; }
  if(Math.hypot(e.clientX-downX,e.clientY-downY)>6) return;
  if(String(getSelection()).trim().length) return;
  if(pop.classList.contains('on')){ closePop(); return; }
  const x=e.clientX-book.getBoundingClientRect().left, P=CUR.G.P;
  if(CUR.G.ppv===2) (x<P?prev:next)();
  else if(isPhone()){ if(x<P*.3) prev(); else if(x>P*.7) next(); else document.body.classList.contains('chrome')?hideChrome():showChrome(); }
  else (x<P*.35?prev:next)();
});
document.addEventListener('click',e=>{
  if(!e.target.isConnected) return;
  if(setEl.classList.contains('on')&&!e.target.closest('#set,#aa')) setEl.classList.remove('on');

let wAcc=0,wLock=0;
$('#stage').addEventListener('wheel',e=>{

  e.preventDefault(); const now=Date.now(); if(now<wLock) return;
  wAcc+=Math.abs(e.deltaY)>=Math.abs(e.deltaX)?e.deltaY:e.deltaX;
  if(Math.abs(wAcc)>40){ (wAcc>0?next:prev)(); wAcc=0; wLock=now+380; }

/* ---------------- two translations side by side ----------------
   On a two-page spread the left page carries the translation you read and the right page a second one,
   verse beside verse: each verse gets the height of the taller of the two, so they stay level down the page. */
const parWanted=()=>S.par&&S.par!=='off'&&S.par!==S.tr&&!!BIB[S.par];
const parOn=()=>parWanted()&&CUR.G&&CUR.G.ppv===2&&CUR.G.cpp===1&&!!(NUM[S.par]&&NUM[S.par].t);
const sideRow=(t,r)=>rowHTML(t,r,false).replace('<span class="rw"','<span class="rw" data-t="'+t+'"');
function parUnits(b){
  const A=S.tr, nA=NUM[A], nB=NUM[S.par], ord=orderOf(A,b), V=[]; let i=0;
  while(i<ord.length){ const r0=ord[i], c=nA.c[r0], v=nA.v[r0], rows=[r0]; i++;
    while(i<ord.length&&nA.c[ord[i]]===c&&nA.v[ord[i]]===v){ rows.push(ord[i]); i++; }
    if(rows.some(r=>nA.t[r]||nB.t[r])) V.push({r:r0,rows,c,v}); }
  return V;
}
function parSide(t,b,V,k,xs){
  const n=NUM[t], u=V[k], r0=u.rows[0], c=n.c[r0], isPs=b===18;
  const prevC=k?n.c[V[k-1].rows[0]]:-1, cs=c!==prevC;
  let h='<div class="pu'+(cs?' cs':'')+'" data-k="'+k+'"'+(t===S.tr?'':' data-side="b"')+'>';
  if(cs&&isPs) h+='<div class="psh">Psalm '+c+'</div>';
  const cn=cs&&!isPs;
  h+='<span class="vs'+(cn?' hascn':'')+'"'+(t===S.tr?' data-i="'+k+'"':'')+'>'+(cn?'<span class="cn">'+c+'</span>':'');
  let lastV=null;   // a verse this translation already began in the line above is not numbered again
  if(k){ for(const r of V[k-1].rows) if(n.t[r]) lastV=n.c[r]+':'+n.v[r]; }
  for(const r of u.rows){ if(!n.t[r]) continue; const vv=n.c[r]+':'+n.v[r];
    if(vv!==lastV){ h+='<span class="vn">'+n.v[r]+'</span>'; lastV=vv; }
    h+=(t===S.tr?rowHTML(t,r,xs):sideRow(t,r))+' '; }
  return h+'</span></div>';
}
const parTitle=(t,b)=>'<div class="ptl"><h1 class="bt">'+esc(bookName(b,t))+'</h1></div>';
function parRender(b){
  const G=CUR.G, A=S.tr, B=S.par, xs=S.xref==='on', V=parUnits(b);
  const m=document.createElement('div');
  m.className=flowClasses(Object.assign({},S,{layout:'lines'}));
  m.style.cssText='position:fixed;left:-9999px;top:0;visibility:hidden;width:'+G.cw+'px;font-size:'+G.fs+'px;height:auto;column-count:auto';
  document.body.appendChild(m);
  const heights=t=>{ let h=parTitle(t,b); for(let k=0;k<V.length;k++) h+=parSide(t,b,V,k,t===A&&xs); m.innerHTML=h;
    const els=m.querySelectorAll('.pu'), out=new Float64Array(V.length); els.forEach((e,i)=>{ out[i]=e.getBoundingClientRect().height; });
    return {u:out,t:m.querySelector('.ptl').getBoundingClientRect().height}; };
  const ha=heights(A), hb=heights(B); m.remove();
  const H=V.map((_,k)=>Math.ceil(Math.max(ha.u[k],hb.u[k]))), TH=Math.ceil(Math.max(ha.t,hb.t)), cap=G.h-2;
  const pages=[]; let cur=[], used=TH;
  for(let k=0;k<V.length;k++){ if(cur.length&&used+H[k]>cap){ pages.push(cur); cur=[]; used=0; } cur.push(k); used+=H[k]; }
  pages.push(cur);
  const col=new Int32Array(V.length);
  pages.forEach((pg,i)=>pg.forEach(k=>{ col[k]=2*i; }));
  const rm=new Map(); V.forEach((x,i)=>{ for(const row of x.rows) rm.set(row,i); });
  Object.assign(CUR,{b,t:A,xs,V,rowMap:rm,par:B,parPages:pages,parH:H,parTH:TH,col,end:col.slice(),pages:2*pages.length,spreads:pages.length});
  flow.className=flowClasses(Object.assign({},S,{layout:'lines'})); styleFlow(flow,G); flow.style.columnCount='1'; flow.lang=A==='aov'?'af':'en';
}
function parPaint(s){
  const G=CUR.G, b=CUR.b, V=CUR.V, ks=CUR.parPages[s]||[], xs=S.xref==='on';
  const side=(t,left)=>{ let h=s===0?'<div style="min-height:'+CUR.parTH+'px">'+parTitle(t,b)+'</div>':'';
    for(const k of ks) h+=parSide(t,b,V,k,left&&xs).replace('<div class="pu','<div style="min-height:'+CUR.parH[k]+'px" class="pu'+(k===ks[0]?' first':''));
    return '<div class="pside" lang="'+(t==='aov'?'af':'en')+'" style="left:'+(left?0:G.w+G.g)+'px;width:'+G.cw+'px">'+h+'</div>'; };
  flow.innerHTML=side(CUR.t,true)+side(CUR.par,false);
}

/* ---------------- search ---------------- */
const findEl=$('#find'), FIND={q:'',scope:'all',book:-1,hits:[],shown:0,t:''};
const FOLD={};
function foldText(s){ let o=''; for(let i=0;i<s.length;i++){ const ch=s[i]; let f=FOLD[ch];
  if(f===undefined){ f=ch.normalize('NFD')[0].toLowerCase(); if(f.length!==1) f=ch; FOLD[ch]=f; } o+=f; } return o; }
const FOLDED={};
function folded(t){ if(!FOLDED[t]){ const n=NUM[t]; FOLDED[t]=n.t.map(x=>x?foldText(x):''); } return FOLDED[t]; }
const reEsc=x=>x.replace(/[.*+?^${}()|[\]\\]/g,'\\$&');
function termsOf(q){
  const out=[], f=foldText(q.trim()); let m; const re=/"([^"]+)"|(\S+)/g;
  while((m=re.exec(f))){ const ph=(m[1]||m[2]).split(/[^\p{L}\p{N}]+/u).filter(Boolean); if(!ph.length) continue;
    out.push(new RegExp('(?<![\\p{L}\\p{N}])'+ph.map(reEsc).join('[^\\p{L}\\p{N}]+'),'gu')); }
  return out;
}
function runSearch(){
  const q=FIND.q, t=S.tr, res=findEl.querySelector('#fres'); FIND.t=t;
  if(q.trim().length<2){ res.innerHTML=''; FIND.hits=[]; return; }
  const terms=termsOf(q), F=folded(t), n=NUM[t];
  const [a,z]=FIND.scope==='ot'?[0,D.bs[39]]:FIND.scope==='nt'?[D.bs[39],N]:FIND.scope==='book'&&CUR.b>=0?[D.bs[CUR.b],D.bs[CUR.b+1]]:[0,N];
  const hits=[];
  if(terms.length) for(let r=a;r<z;r++){ const s=F[r]; if(!s) continue; let ok=true;
    for(const re of terms){ re.lastIndex=0; if(!re.test(s)){ ok=false; break; } } if(ok) hits.push(r); }
  FIND.hits=hits; FIND.book=-1; FIND.shown=0; FIND.terms=terms; drawHits(true);
}
function snippetHTML(t,r,terms){
  const s=NUM[t].t[r], f=folded(t)[r], mark=new Uint8Array(s.length);
  for(const re of terms){ re.lastIndex=0; for(const m of f.matchAll(re)) mark.fill(1,m.index,m.index+m[0].length); }
  let a=0, z=s.length; if(s.length>260){ const first=mark.indexOf(1); a=Math.max(0,first-90); a=a?s.lastIndexOf(' ',a)+1:0; z=Math.min(s.length,a+240); }
  let h=a?'\u2026':'', on=false;
  for(let i=a;i<z;i++){ const ch=s[i]; if(ch==='['||ch===']') continue;
    if(mark[i]&&!on){ h+='<mark>'; on=true; } else if(!mark[i]&&on){ h+='</mark>'; on=false; }
    h+=ch==='<'?'&lt;':ch==='>'?'&gt;':ch==='&'?'&amp;':ch; }
  return h+(on?'</mark>':'')+(z<s.length?'\u2026':'');
}
function drawHits(reset){
  const t=FIND.t, n=NUM[t], res=findEl.querySelector('#fres'), list=FIND.book>=0?FIND.hits.filter(r=>bookOf[r]===FIND.book):FIND.hits;
  let h='';
  if(reset){
    const key=keyFromText(FIND.q);
    if(key){ const [o,c]=key.split('.'), b=OSIS.indexOf(o); h+='<button type="button" class="go" data-b="'+b+'" data-c="'+c+'">'+esc(L.fGo.replace('{x}',(b===18?'Psalm':bookName(b))+' '+c))+'</button>'; }
    if(!FIND.hits.length){ res.innerHTML=h+(FIND.terms&&FIND.terms.length&&!key?'<p class="fsum">'+L.fNone+'</p>':''); return; }
    const per=new Map(); for(const r of FIND.hits){ const b=bookOf[r]; per.set(b,(per.get(b)||0)+1); }
    h+='<p class="fsum">'+L.fCount.replace('{n}',FIND.hits.length.toLocaleString())+'</p>';
    if(per.size>1) h+='<div class="fbooks">'+[...per].map(([b,c])=>'<button type="button" data-fb="'+b+'" aria-pressed="'+(FIND.book===b)+'">'+esc(bookName(b))+' '+c+'</button>').join('')+'</div>';
    h+='<div class="fres"></div>'; res.innerHTML=h; FIND.shown=0;
  }
  const box=res.querySelector('.fres'); if(!box) return;
  const more=res.querySelector('.more'); if(more) more.remove();
  const from=FIND.shown, to=Math.min(list.length,from+150); let out='';
  for(let i=from;i<to;i++){ const r=list[i], b=bookOf[r];
    out+='<button type="button" class="hit" data-r="'+r+'"><span class="rf">'+esc((b===18?'Psalm':bookName(b))+' '+n.c[r]+':'+n.v[r])+'</span>'+snippetHTML(t,r,FIND.terms)+'</button>'; }
  box.insertAdjacentHTML('beforeend',out); FIND.shown=to;
  if(to<list.length) box.insertAdjacentHTML('afterend','<button type="button" class="btn more lnk">'+L.fMore+' ('+(list.length-to)+')</button>');
}
function openFind(){

  if(FIND.q) runSearch();
}

let fT=0;
