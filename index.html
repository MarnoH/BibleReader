/* ---------------- the map of Strong's numbers ----------------
   Strong numbered each lexicon in alphabetical order, so every first letter is one stretch of numbers
   (\u05d0 = H1\u2013871 \u2026 \u05ea = H8372\u20138674), cut again by the second letter (\u05d0\u05d1 = H1\u201388). The map is worked out from
   the dictionary itself. \u05e9\u05c2 and \u05e9\u05c1 are one letter here, as in Strong. A few Greek entries sit out of order. */
const smapEl=$('#smap');
const HLET='\u05d0\u05d1\u05d2\u05d3\u05d4\u05d5\u05d6\u05d7\u05d8\u05d9\u05db\u05dc\u05de\u05e0\u05e1\u05e2\u05e4\u05e6\u05e7\u05e8\u05e9\u05ea'.split('');
const HNAME=['Aleph','Bet','Gimel','Dalet','He','Vav','Zayin','Chet','Tet','Yod','Kaf','Lamed','Mem','Nun','Samekh','Ayin','Pe','Tsadi','Qof','Resh','Shin / Sin','Tav'];
const GLET='\u03b1\u03b2\u03b3\u03b4\u03b5\u03b6\u03b7\u03b8\u03b9\u03ba\u03bb\u03bc\u03bd\u03be\u03bf\u03c0\u03c1\u03c3\u03c4\u03c5\u03c6\u03c7\u03c8\u03c9'.split('');
const GNAME=['Alpha','Beta','Gamma','Delta','Epsilon','Zeta','Eta','Theta','Iota','Kappa','Lambda','Mu','Nu','Xi','Omicron','Pi','Rho','Sigma','Tau','Upsilon','Phi','Chi','Psi','Omega'];
const HFIN={'\u05da':'\u05db','\u05dd':'\u05de','\u05df':'\u05e0','\u05e3':'\u05e4','\u05e5':'\u05e6'};
function lettersOf(pre,lemma){
  if(pre==='H'){ const o=[]; for(const c of lemma) if(c>='\u05d0'&&c<='\u05ea') o.push(HFIN[c]||c); return o; }
  const o=[]; for(const c of lemma.toLowerCase().normalize('NFD')) if((c>='\u03b1'&&c<='\u03c9')||c==='\u03c2') o.push(c==='\u03c2'?'\u03c3':c); return o;
}
const MAPS={};
function buildMap(pre){
  if(MAPS[pre]) return MAPS[pre];
  const ids=Object.keys(SG.dict).filter(k=>k[0]===pre).map(k=>+k.slice(1)).sort((a,b)=>a-b);
  const AL=pre==='H'?HLET:GLET, letters=AL.map((l,i)=>({l,i,a:Infinity,z:0,n:0,blocks:[],odd:[]}));
  const byL=new Map(AL.map((l,i)=>[l,letters[i]]));
  // each letter's stretch is its longest unbroken run; the odd entries elsewhere are listed apart
  const seq=ids.map(n=>{ const c=lettersOf(pre,SG.dict[pre+n][0]); return {n,L1:byL.get(c[0]),two:c.slice(0,2).join('')}; }).filter(x=>x.L1);
  const runsOf=list=>{ const rs=[]; for(const x of list){ const r=rs[rs.length-1]; if(r&&r.L1===x.L1) r.items.push(x); else rs.push({L1:x.L1,items:[x]}); } return rs; };
  // a few entries of another letter sitting inside a letter's stretch don't break it
  const r0=runsOf(seq), inset=new Set();
  for(let i=1;i<r0.length-1;i++){ let j=i, tot=0;
    while(j<r0.length-1&&tot+r0[j].items.length<=3&&r0[j].L1!==r0[i-1].L1){ tot+=r0[j].items.length; j++; }
    if(j>i&&r0[j].L1===r0[i-1].L1) for(let k=i;k<j;k++) r0[k].items.forEach(x=>inset.add(x)); }
  const runs=runsOf(seq.filter(x=>!inset.has(x)));
  const main=new Map(); for(const r of runs){ const m=main.get(r.L1); if(!m||r.items.length>m.items.length) main.set(r.L1,r); }
  const inMain=new Set(); for(const r of main.values()) r.items.forEach(x=>inMain.add(x));
  let prev=null;
  for(const x of seq){
    const L1=x.L1, n=x.n, two=x.two;
    if(!inMain.has(x)){ L1.odd.push(n); continue; }
    L1.a=Math.min(L1.a,n); L1.z=Math.max(L1.z,n); L1.n++;
    const bl=L1.blocks[L1.blocks.length-1];
    if(bl&&bl.p===two&&prev===L1) bl.z=n, bl.n++; else L1.blocks.push({p:two,a:n,z:n,n:1});
    prev=L1; }
  const live=letters.filter(x=>x.n), max=Math.max(...live.flatMap(x=>x.blocks.map(b=>b.n)));

const MAPST={pre:'H',letter:-1,block:-1,pin:0,quiz:null,score:[0,0]};
const hue=(i,cnt)=>Math.round(i*360/cnt);
function locate(pre,n){ const M=buildMap(pre);

    if(n>=L1.a&&n<=L1.z){ const b=L1.blocks.findIndex(x=>n>=x.a&&n<=x.z); return {L1,b}; } } return null; }

/* ---------------- checking and correcting the links to the Hebrew and Greek ----------------
   KJV: every phrase with a Strong's number is linked to the original word with that number (the first phrase with it
   to the first such word, and so on). AOV: a first draft from a word aligner. Both can be corrected word by word, a
   whole chapter at a time, with the English (or Afrikaans) beside the Hebrew or Greek:
   - select words, then tap the original word; or
   - tap an original word first to pick it up as a "brush", then tap or drag over the words that render it.
   Verses you have checked can be ticked off as approved. Kept on this device; saved and loaded as one file. */
const amapEl=$('#amap'), ALN={rows:[],mode:'kjv',sel:null,brush:null,b:0,c:1,focus:null};

function setAlignChapter(b,c,focus){

function chapterStep(d){ const n=NUM[ALN.mode]; let b=ALN.b, c=ALN.c+d;
  const last=bb=>{ let m=0; for(let r=D.bs[bb];r<D.bs[bb+1];r++) if(n.t[r]) m=Math.max(m,n.c[r]); return m; };
  if(c<1){ if(b===0) return; b--; c=last(b); } else if(c>last(b)){ if(b===65) return; b++; c=1; }
  ALN.sel=null; ALN.brush=null; setAlignChapter(b,c,null); }

function wordLinks(t,r){

  for(let w=0;w<tk.length;w++){ const gr=groupAt(t,r,w); if(!gr) continue;
    const l=t==='aov'?(gr.p!=null?{rr:r,j:gr.j,p:gr.p}:{rr:r,j:gr.j}):kjvLinkP(r,gr), lab=gr.pre+gr.nums.join(','+gr.pre);

const hueOfL=(r,rr,j,p)=>Math.round(((j+(rr-r)*7+(p!=null?p*0.37:0))*137.5)%360+360)%360;

/* ---------------- ribbon markers ----------------
   Three silk ribbons, as in a good Bible. Each keeps a place; it hangs out at the foot of the book, and lies
   across the page when that place is open. Kept per verse, so they stay put whatever the translation. */
const RIBKEY='bybel-linte-v1', RIBC=['#9e1b22','#c39a3e','#27477a'];
let RIBS=[{n:'',r:null},{n:'',r:null},{n:'',r:null}];
try{ const p=JSON.parse(localStorage.getItem(RIBKEY)||'null'); if(Array.isArray(p)) p.slice(0,3).forEach((x,i)=>{ RIBS[i]=Object.assign({n:'',r:null},x); }); }catch(e){}
const saveRibs=()=>{ try{ localStorage.setItem(RIBKEY,JSON.stringify(RIBS)); }catch(e){} };
const ribsEl=$('#ribs'), ribMenu=$('#ribmenu');
const ribName=i=>RIBS[i].n||(L.ribbon+' '+(i+1));
function ribRef(r){ const n=NUM[S.tr], b=bookOf[r]; return (b===18?'Psalm':bookName(b))+' '+n.c[r]+':'+n.v[r]; }
function ribHere(i){ const r=RIBS[i].r; if(r==null||bookOf[r]!==CUR.b||!CUR.rowMap) return -1;
  const v=verseOfRow(r), pg=Math.floor(CUR.col[v]/CUR.G.cpp); return Math.floor(pg/CUR.G.ppv)===CUR.spread?pg%CUR.G.ppv:-1; }
function drawRibbons(){
  if(!CUR.G) return; const G=CUR.G, H=G.H, phone=isPhone(), tail=phone?0:Math.min(30,Math.max(14,($('#stage').clientHeight-H)/2-4));
  let h='';
  // ribbons lying in the book stay inside the inner margin, side by side towards the fold
  const sides=RIBS.map((_,i)=>ribHere(i)), margin=G.ppv===2?(G.P-G.mo-G.w):G.mo, cnt=[0,0];
  const lying=k=>sides.filter(x=>x===k).length;
  RIBS.forEach((rb,i)=>{
    const side=sides[i], set=rb.r!=null;
    const tip=esc(ribName(i)+' \u00b7 '+(set?ribRef(rb.r):L.ribEmpty)+'\n'+L.ribTip);
    let x,top,ht;
    if(side>=0){   // lying in the book at this page, near the inner edge
      const n=lying(side), k=cnt[side]++, room=Math.max(9,margin-8), step=n>1?Math.min(11,(room-9)/(n-1)):0;
      if(G.ppv===2) x=step>=4?(side===0?G.P-4-9-k*step:G.P+4+k*step):(side===0?G.P-13+k*5:G.P+4-k*5);   // a narrow margin: they fan over the fold
      else x=G.P-4-9-k*step;          // one page: in the outer margin, clear of the text
      top=-2; ht=H+2+(phone?0:tail*.9);
    } else {
      const c=G.ppv===2?G.P:G.P/2; x=c-16+i*12; top=phone?H-Math.max(16,G.mb*.7):H-6; ht=phone?Math.max(16,G.mb*.7):tail+6;
    }
    h+='<button type="button" class="rbn'+(set?'':' unset')+'" data-rb="'+i+'" title="'+tip+'" aria-label="'+esc(ribName(i))+'" style="--rc:'+RIBC[i]+';left:'+x+'px;top:'+top+'px;height:'+ht+'px"></button>';
  });
  ribsEl.innerHTML=h;
}
function placeRibbon(i){ const p0=CUR.spread*CUR.G.ppv, v=CUR.V[startsOnSpread(CUR.spread)]||CUR.V[firstOnPage(p0)]; if(!v) return;
  RIBS[i].r=v.r; saveRibs(); drawRibbons(); }
function openRibMenu(i,el){
  const rb=RIBS[i], r=el.getBoundingClientRect();
  ribMenu.innerHTML='<div class="w">'+L.ribName+'</div><input type="text" value="'+esc(rb.n)+'" placeholder="'+esc(L.ribbon+' '+(i+1))+'">'+

    '<div class="acts"><button type="button" class="main" data-ra="here">'+L.ribHere+'</button>'+(rb.r!=null?'<button type="button" data-ra="go">'+L.ribGo+'</button><button type="button" data-ra="out">'+L.ribRemove+'</button>':'')+'</div>';

  if(inp&&RIBS[i]){ RIBS[i].n=inp.value.trim(); saveRibs(); drawRibbons(); } ribMenu.classList.remove('on'); };

/* ---------------- every verse where a Strong's number occurs ----------------
   Read from the translation you are reading when it carries the numbers (KJV, BSB, AOV, or the Hebrew Old
   Testament); otherwise from the KJV. The words that render the number are marked in each verse. */
const CONC={id:'',t:'',hits:[],book:-1,shown:0};
function concRows(t,id){
  const pre=id[0], num=id.slice(1), [a,z]=pre==='H'?[0,D.bs[39]]:[D.bs[39],N], out=[];
  const hasNum=list=>list.split(',').includes(num);
  for(let r=a;r<z;r++){
    let ws=null;
    if(t==='kjv'){ const tk=SG.kjv[r]; if(!tk||tk.indexOf(num)<0) continue; const p=tk.split(' '); let head=null;
      p.forEach((x,w)=>{ if(x!=='+') head=x; if(head&&head!=='-'&&hasNum(head.split('/')[0])) (ws||(ws=[])).push(w); }); }
    else if(ORIGS.has(t)){ const tk=pre==='H'?SG.heb&&SG.heb[r]:NUM[t].g&&NUM[t].g[r]; if(!tk||tk.indexOf(num)<0) continue;
      tk.split(' ').forEach((x,w)=>{ if(hasNum(x.split('/')[0])) (ws||(ws=[])).push(w); }); }
    else { const tk=tokens(t,r); if(!tk) continue; const src=srcWords(r); if(!src.some(x=>x.nums.includes(num))) continue;
      tk.forEach((x,w)=>{ const gr=x!=='-'&&groupAt(t,r,w); if(gr&&gr.nums.includes(num)) (ws||(ws=[])).push(w); }); }
    if(ws) out.push({r,ws});
  }
  return out;
}
async function openConc(id){
  if(!await ensureStrongs()) return;
  let t=S.tr; if(t==='bsb') await ensureBsb(); if(t==='aov') await ensureAov();
  const ok=t==='kjv'||(t==='bsb'&&SG.bsb)||(t==='aov'&&SG.aov)||(ORIGS.has(t)&&id[0]==='H')||((t==='byz'||t==='na')&&NUM[t].g); if(!ok) t='kjv';
  CONC.id=id; CONC.t=t; CONC.book=-1; CONC.hits=concRows(t,id);
  closePop(); smapEl.classList.remove('on'); amapEl.classList.remove('on');
  drawConc(true); findEl.classList.add('on');
}
function drawConc(reset){

      '<p class="fsum">'+L.cCount.replace('{n}',CONC.hits.length.toLocaleString()).replace('{t}',BIB[t].label)+' \u00b7 <button type="button" class="sgr" data-map="'+CONC.id+'">'+L.mapOpen+'</button> <button type="button" class="sgr" data-cadd="'+CONC.id+'">'+(WORDS.list[CONC.id]?L.sIn:L.sAdd)+'</button></p>'+
      (d[3]?'<p class="sgk" style="margin:0 0 8px">'+esc(d[3])+'</p>':'')+
      (per.size>1?'<div class="fbooks">'+[...per].map(([b,c])=>'<button type="button" data-cb="'+b+'" aria-pressed="'+(CONC.book===b)+'">'+esc(bookName(b,t))+' '+c+'</button>').join('')+'</div>':'')+
      '<div class="fres"></div>'; CONC.shown=0; }
  const res=box.querySelector('.fres'); if(!reset&&CONC.shown===0) res.innerHTML='';
  const m=box.querySelector('.cmore'); if(m) m.remove();

  for(let i=from;i<to;i++){ const {r,ws}=list[i], set=new Set(ws), words=(n.t[r]||'').split(' ');

/* ---------------- questions ----------------
   Questions that come up while reading, tied to the verse (and the words) that raised them, gathered in one place to
   be answered later. Asked from the selection bar ("?") or with "+ Question" for the open pages. An open question
   puts a small ? beside its verse number; answering it keeps the answer with the question. */
const QKEY='bybel-vrae-v1';
let QS=[]; try{ const q=JSON.parse(localStorage.getItem(QKEY)||'null'); if(Array.isArray(q)) QS=q; }catch(e){}
let QV=0, qSaveT=0;
const QST={show:'open'};
function saveQ(){ clearTimeout(qSaveT); try{ localStorage.setItem(QKEY,JSON.stringify(QS)); }catch(e){ alert(L.nFull); } }
const saveQSoon=()=>{ clearTimeout(qSaveT); qSaveT=setTimeout(saveQ,400); };
const qRef=q=>{ const n=NUM[q.t]&&NUM[q.t].t?NUM[q.t]:NUM[S.tr]; const c=n.c[q.r], v=n.v[q.r];
  let s=(q.b===18?'Psalm':bookName(q.b))+' '+c+':'+v;
  if(q.r2!=null&&q.r2!==q.r){ const c2=n.c[q.r2], v2=n.v[q.r2]; s+='\u2013'+(c2===c?v2:c2+':'+v2); } return s; };
const qOrder=(a,z)=>(a.b-z.b)||(a.r-z.r)||(a.made||'').localeCompare(z.made||'');
// the ? beside verse numbers on the page
function qPaint(){
  if(!CUR.V||!CUR.V.length) return;
  for(const el of flow.querySelectorAll('.vs.q')) el.classList.remove('q');
  for(const q of QS){ if(q.done||q.b!==CUR.b) continue; const i=CUR.rowMap.get(q.r); if(i==null) continue;
    const el=flow.querySelector('.vs[data-i="'+i+'"]'); if(el) el.classList.add('q'); }
}
function qOnPages(){
  if(!CUR.G||!CUR.V.length) return new Set();

  return new Set(QS.filter(q=>{ if(q.b!==CUR.b) return false; const i=CUR.rowMap.get(q.r); return i>=fv&&i<=lv; }).map(q=>q.id));
}

  const q=QS.find(x=>x.id===(b.dataset.qgo||b.dataset.qdel||b.dataset.qdone)); if(!q) return;
  if(b.dataset.qgo){ if(isPhone()&&!S.notesPinned){ S.notesOpen=false; applyNotesUI(); } go(q.b,q.r,{push:true,flash:true}); return; }
  if(b.dataset.qdel){ if((q.q.trim()||q.a.trim())&&!confirm(L.qDelConfirm)) return; QS.splice(QS.indexOf(q),1); }
  else if(b.dataset.qdone){ q.done=q.done?null:todayISO(); }
  q.u=todayISO(); QV++; saveQ(); qPaint(); renderNotes(true);
});

/* ---------------- memory palace ----------------
   The A5-sheet method (all of Ephesians was learned this way): a passage is split into rooms of about five verses;
   in each room 3–4 keywords per verse are numbered as places (15–20 a room) and listed on the bottom half of the
   sheet, each with a note of the spot and the image put there; the top half is the drawing of the room.
   Keywords are chosen by tapping words in the Bible text; their place numbers stand above them on the page while
   the palace is open. Practice covers the room's verses on the page itself, so they stay where they are in the
   book, showing only the keywords or each word's first letter, and uncovers them a word at a time.
   One palace belongs to one translation. Keywords are kept by verse row and word number (as word marks are),
   place notes by the word they belong to, so changing the rooms never loses them. */
const PKEY='bybel-paleis-v1';
let PAL={cur:'',list:{},ink:{}};
try{ const p=JSON.parse(localStorage.getItem(PKEY)||'null');
     if(p&&p.list){ PAL=Object.assign({cur:'',list:{},ink:{}},p); unpackInk(PAL.ink); } }catch(e){}
let PALV=0, PALC=null, PR=null, palShown=false, pSaveT=0;
const PALST={kw:false,form:false};
const palCur=()=>PAL.list[PAL.cur]||null;
const escA=s=>esc(String(s)).replace(/"/g,'&quot;');
function savePal(){ clearTimeout(pSaveT); try{ localStorage.setItem(PKEY,JSON.stringify(PAL,packInk)); }catch(e){ alert(L.nFull); } }
const savePalSoon=()=>{ clearTimeout(pSaveT); pSaveT=setTimeout(savePal,350); };
// the verses of a book in one translation, grouped as the page groups them
const VOF={};
function versesOf(t,b){ const k=t+':'+b; if(VOF[k]) return VOF[k];
  const n=NUM[t]; if(!n||!n.t) return [];
  const ord=orderOf(t,b), V=[]; let i=0;
  while(i<ord.length){ const r0=ord[i], c=n.c[r0], v=n.v[r0], rows=[r0]; i++;
    while(i<ord.length&&n.c[ord[i]]===c&&n.v[ord[i]]===v){ rows.push(ord[i]); i++; }
    const rs=rows.filter(r=>n.t[r]); if(rs.length) V.push({r:rs[0],rows:rs,c,v}); }
  return VOF[k]=V; }
// rooms as even as possible and close to the chosen size: 23 verses in fives give 5,5,5,4,4, not 5,5,5,5,3
const roomCount=(n,size)=>Math.max(1,Math.round(n/size));
const cutsFor=(n,size)=>{ const k=roomCount(n,size), a=Math.floor(n/k), x=n%k; return Array.from({length:k},(_,i)=>a+(i<x?1:0)); };
const vRange=vs=>{ const a=vs[0], z=vs[vs.length-1]; return a.c+':'+a.v+(a===z?'':'\u2013'+(a.c===z.c?z.v:z.c+':'+z.v)); };
// rooms, and every keyword's place number, worked out again whenever the palace changes
function palCalc(){
  const p=palCur(); if(!p||!NUM[p.t]||!NUM[p.t].t) return null;
  if(PALC&&PALC.id===p.id&&PALC.v===PALV) return PALC;
  const all=versesOf(p.t,p.b); let a=all.findIndex(x=>x.rows.includes(p.a)), z=all.findIndex(x=>x.rows.includes(p.z));
  if(a<0) a=0; if(z<a) z=all.length-1;
  const V=all.slice(a,z+1);
  if(!p.cuts||p.cuts.reduce((s,n)=>s+n,0)!==V.length) p.cuts=cutsFor(V.length,p.size||5);
  const rooms=[], rowRoom=new Map(), place=new Map(); let k=0;
  p.cuts.forEach((n,ri)=>{ const vs=V.slice(k,k+n); k+=n; const room={i:ri,V:vs,places:[]};
    for(const x of vs) for(const r of x.rows){ rowRoom.set(r,ri);
      for(const w of (p.kw[r]||[])){ const pl={r,w,n:room.places.length+1,c:x.c,v:x.v}; room.places.push(pl); place.set(r+':'+w,pl); } }
    rooms.push(room); });
  return PALC={id:p.id,v:PALV,V,rooms,rowRoom,place};
}
const palShowNums=()=>!!PR||(notesOpen()&&S.notesTab==='p');
const palKwOn=()=>PALST.kw&&!PR&&notesOpen()&&S.notesTab==='p'&&!!palCur();
// what the typesetter needs for one verse row: its keywords' numbers, and where its words stand in the room being practised
function palRow(t,r){
  if(!PAL.cur) return null; const p=palCur(); if(!p||p.t!==t) return null;
  const prac=!!(PR&&PR.rows.has(r)), nums=palShowNums();
  if(!prac&&!nums) return null;
  const kw=p.kw[r]||[]; if(!prac&&!kw.length) return null;
  const C=palCalc(); if(!C||!C.rowRoom.has(r)) return null;
  return {kw:new Map(kw.map(w=>[w,(C.place.get(r+':'+w)||{}).n||0])), base:prac?PR.base.get(r):-1, nums};
}
// the rows of the open palace are typeset again (numbers and covering never move the text, so no re-paging)
function refreshPalRows(){
  const p=palCur(); if(!p||!CUR.G||CUR.b!==p.b) return; const C=palCalc(); if(!C) return;
  for(const el of [...flow.querySelectorAll('.rw')]){ const r=+el.dataset.r; if(!C.rowRoom.has(r)) continue;
    const t=el.dataset.t||S.tr; if(t!==p.t) continue; el.outerHTML=el.dataset.t?sideRow(t,r):rowHTML(t,r,S.xref==='on'); }
}
function palSync(){
  document.body.classList.toggle('kwmode',palKwOn());
  const on=palShowNums(); if(on!==palShown){ palShown=on; if(palCur()) refreshPalRows(); }
}
const kwWord=(t,r,w)=>(((NUM[t].t[r]||'').match(/\S+/g)||[])[w]||'').replace(/[\[\]]/g,'').replace(/^[^\p{L}\p{N}]+|[^\p{L}\p{N}]+$/gu,'');
function toggleKw(p,r,w){
  const a=p.kw[r]||(p.kw[r]=[]), i=a.indexOf(w);
  if(i>=0) a.splice(i,1); else { a.push(w); a.sort((x,y)=>x-y); }
  if(!a.length) delete p.kw[r];
  p.u=todayISO(); PALV++; savePal(); refreshPalRows();
  // only the sheet of that room changes
  const C=palCalc(), ri=C&&C.rowRoom.get(r), sec=nBody.querySelector('.room[data-ri="'+ri+'"]');
  if(sec&&C){ const room=C.rooms[ri]; sec.querySelector('.rplaces').innerHTML=placesHTML(p,room); sec.querySelector('.rt small').textContent=L.pPlaces.replace('{n}',room.places.length); }
  for(const chip of nBody.querySelectorAll('[data-proom="'+ri+'"] small')) chip.textContent=C.rooms[ri].places.length;
}

/* finding a passage: "Ef 1", "Efesiërs 1-3", "Eph 1:15-2:10", "Psalm 23" or a whole book */
function bookFromName(s){
  const q=normName(s||''); if(!q) return -1;
  for(const list of [D.names.af,D.names.en]) for(let i=0;i<66;i++){ const [n,a]=list[i]; if(normName(n)===q||normName(a)===q) return i; }
  for(const list of [D.names.af,D.names.en]) for(let i=0;i<66;i++) if(normName(list[i][0]).startsWith(q)) return i;
  return OSIS.findIndex(x=>x.toLowerCase()===q);
}
function parsePassage(txt,t){
  const m=/^\s*(\d?\s*[^\d]+?)\s*(\d+)?(?:\s*[:.]\s*(\d+))?(?:\s*[-\u2013\u2014]\s*(\d+)(?:\s*[:.]\s*(\d+))?)?\s*$/.exec(txt||''); if(!m) return null;
  const b=bookFromName(m[1]); if(b<0) return null;
  const all=versesOf(t,b); if(!all.length) return null;
  const g=i=>m[i]===undefined?null:+m[i];
  let c1=g(2), v1=g(3), c2, v2;
  if(g(5)!=null){ c2=g(4); v2=g(5); }
  else if(g(4)!=null){ if(v1!=null){ c2=c1; v2=g(4); } else { c2=g(4); v2=null; } }
  else { c2=c1; v2=v1; }
  if(c1==null){ c1=all[0].c; c2=all[all.length-1].c; }
  const a=all.findIndex(x=>x.c===c1&&(v1==null||x.v===v1));
  let z=-1; for(let i=all.length-1;i>=0;i--) if(all[i].c===c2&&(v2==null||all[i].v===v2)){ z=i; break; }
  if(a<0||z<a) return null;
  return {b,V:all.slice(a,z+1)};
}
function passageName(b,t,V){
  const a=V[0], z=V[V.length-1], all=versesOf(t,b);
  const first=all.find(x=>x.c===a.c), last=all.filter(x=>x.c===z.c).pop();
  const whole=first.v===a.v&&last.v===z.v;
  return (b===18&&a.c===z.c?'Psalm':bookName(b,t))+' '+(whole?(a.c===z.c?a.c:a.c+'\u2013'+z.c):vRange(V));
}
function previewText(){
  const ref=nBody.querySelector('.pref'), sz=nBody.querySelector('.psize'); if(!ref) return null;
  const P=parsePassage(ref.value,S.tr), n=Math.max(2,Math.min(12,+sz.value||5));
  const el=nBody.querySelector('.pprev');
  if(!P){ el.textContent=L.pBad; el.classList.add('bad'); return null; }
  el.classList.remove('bad');
  el.textContent=L.pPrev.replace('{ref}',passageName(P.b,S.tr,P.V)).replace('{v}',P.V.length).replace('{r}',roomCount(P.V.length,n)).replace('{t}',BIB[S.tr].label);
  return {P,n};
}

/* the palace tab of the notes panel */
function roomsOnSpread(p,C){
  if(!CUR.G||CUR.b!==p.b||CUR.t!==p.t||!CUR.V.length) return [];
  const p0=CUR.spread*CUR.G.ppv, fv=firstOnPage(p0), lv=lastOnPage(Math.min(CUR.pages-1,p0+CUR.G.ppv-1));
  return C.rooms.filter(room=>room.V.some(x=>{ const i=CUR.rowMap.get(x.r); return i>=fv&&i<=lv; })).map(room=>room.i);
}
function placesHTML(p,room){
  if(!room.places.length) return '<li class="rnone">'+esc(L.pNoPlaces)+'</li>';
  return room.places.map(pl=>{ const k=pl.r+':'+pl.w;
    return '<li><b class="pn">'+pl.n+'</b><button type="button" class="pkw" data-pgo="'+pl.r+'" title="'+escA(pl.c+':'+pl.v)+'">'+esc(kwWord(p.t,pl.r,pl.w))+'<small>'+(room.V[0].c===room.V[room.V.length-1].c?pl.v:pl.c+':'+pl.v)+'</small></button>'+
      '<input class="pnote" data-pn="'+k+'" value="'+escA(p.pn[k]||'')+'" placeholder="'+escA(L.pNotePh)+'" autocomplete="off" spellcheck="true"></li>'; }).join('');
}
function roomHTML(p,room,C){
  const last=room.i===C.rooms.length-1;
  return '<section class="sheet room" data-st="p" data-k="'+p.id+'|'+room.i+'" data-ri="'+room.i+'">'+
    '<div class="rhead"><span class="rt">'+esc(L.pRoom)+' '+(room.i+1)+'<i>'+esc(vRange(room.V))+'</i><small>'+esc(L.pPlaces.replace('{n}',room.places.length))+'</small></span>'+
    '<button type="button" class="rb rstep" data-pr="less" title="'+escA(L.pLess)+'" aria-label="'+escA(L.pLess)+'"'+(room.V.length<2?' disabled':'')+'>\u2212</button>'+
    '<button type="button" class="rb rstep" data-pr="more" title="'+escA(L.pMore)+'" aria-label="'+escA(L.pMore)+'"'+(last?' disabled':'')+'>+</button>'+
    '<button type="button" class="rb rprac" data-pr="prac">'+esc(L.pPractise)+'</button></div>'+
    '<div class="a5"><div class="paper"><canvas></canvas><span class="rph">'+esc(L.pDraw)+'</span></div><ol class="rplaces">'+placesHTML(p,room)+'</ol></div></section>';
}
function formHTML(){
  const cs=CUR.G&&CUR.b>=0?middleChapter():1, b=CUR.b>=0?CUR.b:48;
  return '<div class="pform"><b>'+esc(L.pNew)+'</b>'+
    '<label><span>'+esc(L.pPassage)+'</span><input class="pref" value="'+escA(bookName(b)+' '+cs)+'" placeholder="'+escA(L.pPassPh)+'" autocomplete="off"></label>'+
    '<label><span>'+esc(L.pSize)+'</span><input class="psize" type="number" min="2" max="12" value="5" inputmode="numeric"></label>'+

    (Object.keys(PAL.list).length?'<button type="button" class="rb" data-pa="cancel">'+esc(L.pCancel)+'</button>':'')+'</div></div>';

function sizeRoom(sec){
  const paper=sec.querySelector('.paper'), cv=paper.querySelector('canvas'), W=paper.clientWidth||LW, h=Math.round(W*SQ2/2);
  paper.style.height=h+'px'; sec.style.setProperty('--half',h+'px');

}
function renderPalace(force){
  const p=palCur();
  if(p&&!(NUM[p.t]&&NUM[p.t].t)){ if(nSig!=='p|wait'){ nSig='p|wait'; nBody.innerHTML='<p class="wempty">'+esc(L.loadingTr.replace('{x}',BIB[p.t].label))+'</p>';
      ensureTr(p.t).then(ok=>{ if(ok&&S.notesTab==='p') renderNotes(true); }); } return; }
  const C=p?palCalc():null, here=p?roomsOnSpread(p,C):[];
  const sig='p|'+(p?p.id:'')+'|'+PALV+'|'+here.join()+'|'+(PALST.form?1:0)+'|'+(PALST.kw?1:0)+'|'+S.tr+'|'+S.lang+'|'+(PR?PR.ri:'');
  if(!force&&sig===nSig) return;
  if(drawing) return;
  saveNotes(); nSig=sig;
  notesEl.querySelector('.npass').textContent='';
  notesEl.classList.toggle('nopal',!p||PALST.form);
  const ids=Object.keys(PAL.list).sort((x,y)=>(PAL.list[x].b-PAL.list[y].b)||(PAL.list[x].a-PAL.list[y].a));
  let h='';
  if(ids.length) h+='<div class="ptop"><select class="psel" aria-label="'+escA(L.pTab)+'">'+ids.map(id=>'<option value="'+id+'"'+(id===PAL.cur?' selected':'')+'>'+esc(PAL.list[id].name+' \u00b7 '+BIB[PAL.list[id].t].label)+'</option>').join('')+'</select>'+
    (PALST.form?'':'<button type="button" class="rb" data-pa="new">+ '+esc(L.pNew)+'</button>')+(p?'<button type="button" class="sdel" data-pa="del" title="'+escA(L.pDelete)+'" aria-label="'+escA(L.pDelete)+'">'+TRASH+'</button>':'')+'</div>';
  else h+='<p class="pintro">'+esc(L.pIntro)+'</p>';

  if(p&&!PALST.form){
    h+='<div class="pctl"><button type="button" class="pkwb" data-pa="kw" aria-pressed="'+PALST.kw+'">'+esc(L.pKw)+'</button><span class="grow"></span>'+
      '<span>'+esc(L.pSize)+'</span><span class="pstep"><button type="button" data-pa="smaller" aria-label="\u2212">\u2212</button><b>'+(p.size||5)+'</b><button type="button" data-pa="bigger" aria-label="+">+</button></span></div>';
    if(p.t!==S.tr) h+='<p class="phelp">'+esc(L.pOtherTr.replace('{t}',BIB[p.t].label))+' <button type="button" class="rb" data-pa="read">'+esc(L.pReadTr.replace('{t}',BIB[p.t].label))+'</button></p>';
    else if(PALST.kw) h+='<p class="phelp">'+esc(L.pKwHelp)+'</p>';

    else h+='<p class="sempty">'+esc(L.pNoneHere)+'</p>';
    h+='<div class="nmore"><b>'+esc(L.pAllRooms)+'</b><div class="prooms">'+C.rooms.map(room=>'<button type="button" class="lnkb'+(here.includes(room.i)?' here':'')+'" data-proom="'+room.i+'">'+(room.i+1)+' \u00b7 '+esc(vRange(room.V))+' <small>'+room.places.length+'</small></button>').join('')+'</div>';
  } else h+='<div class="nmore">';
  h+='<div class="acts"><button type="button" data-n="backup">'+esc(L.nBackup)+'</button><button type="button" data-n="restore">'+esc(L.nRestore)+'</button></div>'+storageLine()+'</div>';
  const top=nBody.scrollTop, same=nBody.dataset.pal===sig.split('|').slice(0,4).join('|');

}
nBody.addEventListener('input',e=>{
  if(S.notesTab!=='p') return;

  if(pn){ const p=palCur(); if(!p) return; const v=pn.value; if(v.trim()) p.pn[pn.dataset.pn]=v; else delete p.pn[pn.dataset.pn]; p.u=todayISO(); savePalSoon(); return; }
  if(e.target.closest('.pref,.psize')) previewText();
});
nBody.addEventListener('keydown',e=>{ if(S.notesTab==='p'&&e.key==='Enter'&&e.target.closest('.pref,.psize')){ e.preventDefault(); nBody.querySelector('[data-pa=make]').click(); } });
nBody.addEventListener('change',async e=>{
  const s=e.target.closest('.psel'); if(!s) return;
  endPractice(); PAL.cur=s.value; PALV++; PALST.form=false; savePal();
  await relayout(true); renderNotes(true);

nBody.addEventListener('click',async e=>{
  if(S.notesTab!=='p') return;
  const b=e.target.closest('[data-pa],[data-pr],[data-pgo],[data-proom]'); if(!b||b.disabled) return;
  const p=palCur();
  if(b.dataset.pgo){ const r=+b.dataset.pgo; go(bookOf[r],r,{push:true,flash:true}); return; }
  if(b.dataset.proom){ const C=palCalc(); if(!C) return; const room=C.rooms[+b.dataset.proom]; go(p.b,room.V[0].r,{push:CUR.b>=0,flash:true}); renderNotes(true); return; }
  const a=b.dataset.pa;
  if(a==='new'){ PALST.form=true; renderNotes(true); const r=nBody.querySelector('.pref'); if(r){ r.focus(); r.select(); } return; }
  if(a==='cancel'){ PALST.form=false; renderNotes(true); return; }
  if(a==='make'){ const q=previewText(); if(!q) return; const {P,n}=q, V=P.V;
    endPractice(); const id='p'+Date.now().toString(36);
    PAL.list[id]={id,t:S.tr,b:P.b,a:V[0].r,z:V[V.length-1].r,size:n,cuts:cutsFor(V.length,n),kw:{},pn:{},name:passageName(P.b,S.tr,V),made:todayISO(),u:todayISO()};
    const old=palCur(); PAL.cur=id; PALV++; PALST.form=false; PALST.kw=true; savePal();
    if(old&&CUR.b===old.b) await relayout(true);
    go(P.b,V[0].r,{push:CUR.b>=0}); palSync(); renderNotes(true); return; }
  if(!p) return;
  if(a==='del'){ if(!confirm(L.pDelConfirm)) return; endPractice();
    delete PAL.list[p.id]; for(const k of Object.keys(PAL.ink)) if(k.startsWith(p.id+'|')) delete PAL.ink[k];
    PAL.cur=Object.keys(PAL.list)[0]||''; PALV++; savePal(); if(CUR.b===p.b) await relayout(true); renderNotes(true); return; }
  if(a==='kw'){ PALST.kw=!PALST.kw; palSync(); renderNotes(true); return; }
  if(a==='read'){ await setSetting('tr',p.t); const C=palCalc(); if(C&&CUR.b!==p.b) go(p.b,C.V[0].r,{push:true}); renderNotes(true); return; }
  if(a==='smaller'||a==='bigger'){ const n=Math.max(2,Math.min(12,(p.size||5)+(a==='bigger'?1:-1))); if(n===p.size) return;
    endPractice(); p.size=n; p.cuts=null; p.u=todayISO(); PALV++; palCalc(); savePal(); refreshPalRows(); renderNotes(true); return; }
  const sec=b.closest('.room'); if(!sec) return; const ri=+sec.dataset.ri;
  if(b.dataset.pr==='prac'){ startPractice(ri); return; }
  endPractice(); const cuts=p.cuts;
  // move the boundary with the next room by one verse
  if(b.dataset.pr==='less'){ if(cuts[ri]<2) return; cuts[ri]--; if(ri+1<cuts.length) cuts[ri+1]++; else cuts.push(1); }
  else if(b.dataset.pr==='more'){ if(ri+1>=cuts.length) return; cuts[ri]++; cuts[ri+1]--; if(!cuts[ri+1]) cuts.splice(ri+1,1); }
  p.u=todayISO(); PALV++; savePal(); refreshPalRows(); renderNotes(true);
});

/* practice: the room's verses are covered on the page and uncovered a word at a time */
const palbar=$('#palbar');
async function startPractice(ri){
  const p=palCur(); if(!p) return;
  if(S.tr!==p.t) await setSetting('tr',p.t);
  const C=palCalc(), room=C&&C.rooms[ri]; if(!room) return;
  let k=0; const base=new Map(), rows=new Set(), vend=[];
  for(const x of room.V){ for(const r of x.rows){ base.set(r,k); rows.add(r); k+=((NUM[p.t].t[r]||'').match(/\S+/g)||[]).length; } vend.push(k); }
  const was=PR; PR={pid:p.id,ri,base,rows,vend,n:0,total:k};
  document.body.classList.add('prac'); applyHint();
  go(p.b,room.V[0].r,{push:!was&&CUR.b>=0});
  palShown=true; refreshPalRows(); palSync(); drawPalbar(); renderNotes(false);
}
// called before the palace or its rooms change, so the covered words are typeset back while the old rooms still apply
function endPractice(){
  if(!PR) return; PR=null;
  document.body.classList.remove('prac','pm-kw','pm-fl'); palbar.classList.remove('on');
  refreshPalRows(); palSync(); renderNotes(false);
}
function applyHint(){ document.body.classList.toggle('pm-fl',S.palHint==='fl'); document.body.classList.toggle('pm-kw',S.palHint!=='fl'); }
function spreadOfEl(el){
  const G=CUR.G, fr=flow.getBoundingClientRect(), er=el.getBoundingClientRect();
  const col=Math.floor((er.left+Math.min(er.width/2,4)-fr.left)/G.pitch); return Math.floor(Math.floor(col/G.cpp)/G.ppv);
}
function prReveal(to){
  if(!PR) return; to=Math.max(0,Math.min(PR.total,to));
  if(to<PR.n){ PR.n=to; for(const el of flow.querySelectorAll('.pw.on')) if(+el.dataset.pw>=to) el.classList.remove('on'); drawPalbar(); return; }
  const from=PR.n; PR.n=to;
  for(const el of flow.querySelectorAll('.pw')){ const k=+el.dataset.pw; if(k>=from&&k<to) el.classList.add('on'); }
  // a room can run over onto the next page: turn to the newest word
  const last=to>0&&flow.querySelector('.pw[data-pw="'+(to-1)+'"]');
  if(last&&!CUR.par){ const s=spreadOfEl(last); if(s>=0&&s<CUR.spreads&&s!==CUR.spread) show(s,s>CUR.spread?1:-1); }
  drawPalbar();
}
const prVerse=()=>{ if(PR) prReveal(PR.vend.find(e=>e>PR.n)??PR.total); };
function drawPalbar(){
  if(!PR){ palbar.classList.remove('on'); return; }
  const C=palCalc(), room=C&&C.rooms[PR.ri]; if(!room){ endPractice(); return; }
  const done=PR.n>=PR.total;
  palbar.innerHTML='<div class="pbrow"><span class="pbl">'+esc(L.pRoom)+' '+(PR.ri+1)+' <i>'+esc(vRange(room.V))+'</i> <small>'+PR.n+'/'+PR.total+'</small></span>'+
    '<div class="seg pbm"><button type="button" data-pb="kw" aria-pressed="'+(S.palHint!=='fl')+'">'+esc(L.pKeywords)+'</button><button type="button" data-pb="fl" aria-pressed="'+(S.palHint==='fl')+'">'+esc(L.pLetters)+'</button></div>'+
    '<button type="button" class="x" data-pb="end" aria-label="'+escA(L.close)+'">\u00d7</button></div><div class="pbrow">'+
    (done?'<span class="pbdone">'+esc(L.pDone)+'</span><button type="button" data-pb="again">'+esc(L.pAgain)+'</button>'+(C.rooms[PR.ri+1]?'<button type="button" class="pbmain" data-pb="nextroom">'+esc(L.pNextRoom)+'</button>':'')
         :'<button type="button" class="pbmain" data-pb="word">'+esc(L.pWord)+'</button><button type="button" data-pb="verse">'+esc(L.pVerse)+'</button><button type="button" data-pb="all">'+esc(L.pShowAll)+'</button>'+
          (PR.n?'<button type="button" data-pb="again">'+esc(L.pHide)+'</button>':'<span class="pbhelp">'+esc(L.pTapHelp)+'</span>'))+'</div>';
  palbar.classList.add('on');
}
palbar.addEventListener('click',e=>{ const b=e.target.closest('[data-pb]'); if(!b||!PR) return; const a=b.dataset.pb;
  if(a==='kw'||a==='fl'){ S.palHint=a; persist(); applyHint(); drawPalbar(); }
  else if(a==='word') prReveal(PR.n+1);
  else if(a==='verse') prVerse();
  else if(a==='all') prReveal(PR.total);
  else if(a==='again'){ prReveal(0); const C=palCalc(); if(C) go(palCur().b,C.rooms[PR.ri].V[0].r); }
  else if(a==='nextroom') startPractice(PR.ri+1);
  else if(a==='end') endPractice();
});
palbar.addEventListener('pointerdown',e=>e.stopPropagation());
// a tap on the text: in practice the next word is uncovered; while choosing keywords, a word becomes a place (or stops being one)
$('#stage').addEventListener('click',e=>{
  if(!PR&&!palKwOn()) return;
  if(!e.target.closest('#book')||PICK.range||PICK.swallow||swiped||String(getSelection()).trim()) return;
  const hit=wordAt(e.clientX,e.clientY); if(!hit) return;
  const p=palCur(); if(!p) return;
  const t=hit.rw.dataset.t||S.tr, r=+hit.rw.dataset.r; if(t!==p.t) return;
  if(PR){ if(!PR.rows.has(r)) return; e.stopImmediatePropagation(); e.preventDefault(); prReveal(PR.n+1); return; }
  const C=palCalc(); if(!C||!C.rowRoom.has(r)) return;      // outside the palace the page turns as usual
  e.stopImmediatePropagation(); e.preventDefault();
  toggleKw(p,r,domToSrc(hit.rw,hit.w,false));
},true);
document.addEventListener('keydown',e=>{
  if(!PR||e.altKey||e.ctrlKey||e.metaKey) return;
  if(e.target.closest&&e.target.closest('textarea,input,select,[contenteditable]')) return;
  if(findEl.classList.contains('on')||navEl.classList.contains('on')||shelfOpen()) return;
  if(e.key===' '&&!e.shiftKey){ e.preventDefault(); e.stopImmediatePropagation(); prReveal(PR.n+1); }
  else if(e.key===' '&&e.shiftKey){ e.preventDefault(); e.stopImmediatePropagation(); prReveal(PR.n-1); }
  else if(e.key==='Enter'){ e.preventDefault(); e.stopImmediatePropagation(); prVerse(); }
  else if(e.key==='Escape'){ e.preventDefault(); e.stopImmediatePropagation(); endPractice(); }
},true);

/* ---------------- open ---------------- */
$('#status').hidden=S.status==='off';
labelChrome(); loadReg(); labelNotes(); labelMarkbar(); applyNotesUI(); applyPhone();
if(NUM.orig&&NUM.orig.t) applyAccents();     // the travel copy carries the Hebrew already
shareOT();
if(firstRun){
  await ensureTr(S.tr);
  // Your A5 density by default; on smaller screens, fall back to one column at a readable size.
  const z=stageSize(), k2=await calibrate(S.tr,2,S.layout);
  if(k2*z.P<12){ S.cols=1; const k1=await calibrate(S.tr,1,S.layout); S.scale=Math.max(1,15/(k1*z.P)); }
  persist();
}
await relayout(true);
openShelf();
renderNotes(true);
{ const r=+new URLSearchParams(location.search).get('r');
  if(r>=0&&r<bookOf.length&&new URLSearchParams(location.search).has('r')){ closeShelf(); go(bookOf[r],r,{push:false,flash:true}); history.replaceState(null,'',location.pathname); } }
window.__reader={CNT:()=>CNT,CAL:()=>CAL,PAL:()=>PAL,CUR,S,D,calibrate,next,prev,go,relayout,a5page,geomFor,openShelf,closeShelf,buildShelf};
})();
</script>
<script>
/* Installed as an app (from a web address), keep a copy of everything on the device so it opens without signal,
   and ask the browser to keep this app's saved readings and notes even when the phone runs low on space.
   When a newer version has been put online, a small bar offers to reload into it. */
if('serviceWorker' in navigator&&/^https?:$/.test(location.protocol)){
  const af=()=>(document.documentElement.lang||'af').slice(0,2)==='af';
  const updateBar=()=>{ if(document.getElementById('updbar')) return;
    const d=document.createElement('div'); d.id='updbar'; d.setAttribute('role','status');
    d.style.cssText='position:fixed;left:50%;bottom:calc(56px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:100;display:flex;gap:14px;align-items:center;background:#1f1d1a;color:#f6f4ee;padding:10px 12px 10px 16px;border-radius:10px;font:14px system-ui,sans-serif;box-shadow:0 10px 30px rgba(0,0,0,.3);max-width:calc(100vw - 24px)';
    d.innerHTML='<span>'+(af()?'\u2019n Nuwe weergawe is gereed.':'A new version is ready.')+'</span><button type="button" style="background:none;border:0;color:#f6f4ee;font:600 14px system-ui,sans-serif;text-decoration:underline;text-underline-offset:3px;cursor:pointer;padding:4px 6px">'+(af()?'Herlaai':'Reload')+'</button>';
    d.querySelector('button').onclick=()=>location.reload(); document.body.appendChild(d); };
  const hadController=!!navigator.serviceWorker.controller;
  navigator.serviceWorker.addEventListener('controllerchange',()=>{ if(hadController) updateBar(); });
  navigator.serviceWorker.addEventListener('message',e=>{ if(e.data&&e.data.type==='updated') updateBar(); });
  addEventListener('load',()=>{ navigator.serviceWorker.register('sw.js').then(r=>r.update()).catch(e=>console.warn('offline copy not set up',e)); });
  if(navigator.storage&&navigator.storage.persist) navigator.storage.persist().catch(()=>{});
}
</script>
