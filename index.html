/* ---------------- ribbon markers ----------------
   Three silk ribbons, as in a good Bible. Each keeps a place; it hangs out at the foot of the book, and lies
   across the page when that place is open. Kept per verse, so they stay put whatever the translation. */
const RIBKEY='bybel-linte-v1', RIBC=['#9e1b22','#c39a3e','#27477a'];
let RIBS=[{n:'',r:null},{n:'',r:null},{n:'',r:null}];
try{ const p=JSON.parse(localStorage.getItem(RIBKEY)||'null'); if(Array.isArray(p)) p.slice(0,3).forEach((x,i)=>{ RIBS[i]=Object.assign({n:'',r:null},x); }); }catch(e){}
const saveRibs=()=>{ try{ localStorage.setItem(RIBKEY,JSON.stringify(RIBS)); }catch(e){} };
const ribsEl=$('#ribs'), ribMenu=$('#ribmenu');
const ribName=i=>RIBS[i].n||(L.ribbon+' '+(i+1));
function ribRef(r){ const n=NUM[S.tr], b=bookOf[r]; return (b===18?'Psalm':bookName(b))+' '+n.c[r]+':'+n.v[r]; }
function ribHere(i){ const r=RIBS[i].r; if(r==null||bookOf[r]!==CUR.b||!CUR.rowMap) return -1;
  const v=verseOfRow(r), pg=Math.floor(CUR.col[v]/CUR.G.cpp); return Math.floor(pg/CUR.G.ppv)===CUR.spread?pg%CUR.G.ppv:-1; }
function drawRibbons(){
  if(!CUR.G) return; const G=CUR.G, H=G.H, phone=isPhone(), tail=phone?0:Math.min(30,Math.max(14,($('#stage').clientHeight-H)/2-4));
  let h='';
  // ribbons lying in the book stay inside the inner margin, side by side towards the fold
  const sides=RIBS.map((_,i)=>ribHere(i)), margin=G.ppv===2?(G.P-G.mo-G.w):G.mo, cnt=[0,0];
  const lying=k=>sides.filter(x=>x===k).length;
  RIBS.forEach((rb,i)=>{
    const side=sides[i], set=rb.r!=null;
    const tip=esc(ribName(i)+' \u00b7 '+(set?ribRef(rb.r):L.ribEmpty)+'\n'+L.ribTip);
    let x,top,ht;
    if(side>=0){   // lying in the book at this page, near the inner edge
      const n=lying(side), k=cnt[side]++, room=Math.max(9,margin-8), step=n>1?Math.min(11,(room-9)/(n-1)):0;
      if(G.ppv===2) x=step>=4?(side===0?G.P-4-9-k*step:G.P+4+k*step):(side===0?G.P-13+k*5:G.P+4-k*5);   // a narrow margin: they fan over the fold
      else x=G.P-4-9-k*step;          // one page: in the outer margin, clear of the text
      top=-2; ht=H+2+(phone?0:tail*.9);
    } else {
      const c=G.ppv===2?G.P:G.P/2; x=c-16+i*12; top=phone?H-Math.max(16,G.mb*.7):H-6; ht=phone?Math.max(16,G.mb*.7):tail+6;
    }
    h+='<button type="button" class="rbn'+(set?'':' unset')+'" data-rb="'+i+'" title="'+tip+'" aria-label="'+esc(ribName(i))+'" style="--rc:'+RIBC[i]+';left:'+x+'px;top:'+top+'px;height:'+ht+'px"></button>';
  });
  ribsEl.innerHTML=h;
}
function placeRibbon(i){ const p0=CUR.spread*CUR.G.ppv, v=CUR.V[startsOnSpread(CUR.spread)]||CUR.V[firstOnPage(p0)]; if(!v) return;
  RIBS[i].r=v.r; saveRibs(); drawRibbons(); }
function openRibMenu(i,el){
  const rb=RIBS[i], r=el.getBoundingClientRect();
  ribMenu.innerHTML='<div class="w">'+L.ribName+'</div><input type="text" value="'+esc(rb.n)+'" placeholder="'+esc(L.ribbon+' '+(i+1))+'">'+
    '<div class="w" style="margin-bottom:8px">'+esc(rb.r!=null?ribRef(rb.r):L.ribEmpty)+'</div>'+
    '<div class="acts"><button type="button" class="main" data-ra="here">'+L.ribHere+'</button>'+(rb.r!=null?'<button type="button" data-ra="go">'+L.ribGo+'</button><button type="button" data-ra="out">'+L.ribRemove+'</button>':'')+'</div>';
  ribMenu.dataset.i=i; ribMenu.classList.add('on');
  const w=ribMenu.offsetWidth, hh=ribMenu.offsetHeight;
  ribMenu.style.left=Math.min(innerWidth-w-10,Math.max(10,r.left+r.width/2-w/2))+'px';
  ribMenu.style.top=Math.max(10,Math.min(innerHeight-hh-10,r.top-hh-8))+'px';
}
const closeRibMenu=()=>{ if(!ribMenu.classList.contains('on')) return; const i=+ribMenu.dataset.i, inp=ribMenu.querySelector('input');
  if(inp&&RIBS[i]){ RIBS[i].n=inp.value.trim(); saveRibs(); drawRibbons(); } ribMenu.classList.remove('on'); };
ribMenu.addEventListener('click',e=>{ const b=e.target.closest('[data-ra]'); if(!b) return; const i=+ribMenu.dataset.i;
  if(b.dataset.ra==='here') placeRibbon(i); else if(b.dataset.ra==='out'){ RIBS[i].r=null; saveRibs(); }
  else if(b.dataset.ra==='go'){ closeRibMenu(); const r=RIBS[i].r; go(bookOf[r],r,{push:true,flash:true}); return; }
  closeRibMenu(); drawRibbons(); });
ribMenu.addEventListener('keydown',e=>{ if(e.key==='Enter') closeRibMenu(); e.stopPropagation(); });

let ribT=0, ribLong=false;

<script>
/* Installed as an app (from a web address), keep a copy of everything on the device so it opens without signal,
   and ask the browser to keep this app's saved readings and notes even when the phone runs low on space.
   When a newer version has been put online, a small bar offers to reload into it. */
if('serviceWorker' in navigator&&/^https?:$/.test(location.protocol)){
  const af=()=>(document.documentElement.lang||'af').slice(0,2)==='af';
  const updateBar=()=>{ if(document.getElementById('updbar')) return;
    const d=document.createElement('div'); d.id='updbar'; d.setAttribute('role','status');
    d.style.cssText='position:fixed;left:50%;bottom:calc(56px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:100;display:flex;gap:14px;align-items:center;background:#1f1d1a;color:#f6f4ee;padding:10px 12px 10px 16px;border-radius:10px;font:14px system-ui,sans-serif;box-shadow:0 10px 30px rgba(0,0,0,.3);max-width:calc(100vw - 24px)';
    d.innerHTML='<span>'+(af()?'\u2019n Nuwe weergawe is gereed.':'A new version is ready.')+'</span><button type="button" style="background:none;border:0;color:#f6f4ee;font:600 14px system-ui,sans-serif;text-decoration:underline;text-underline-offset:3px;cursor:pointer;padding:4px 6px">'+(af()?'Herlaai':'Reload')+'</button>';
    d.querySelector('button').onclick=()=>location.reload(); document.body.appendChild(d); };
  const hadController=!!navigator.serviceWorker.controller;
  navigator.serviceWorker.addEventListener('controllerchange',()=>{ if(hadController) updateBar(); });
  navigator.serviceWorker.addEventListener('message',e=>{ if(e.data&&e.data.type==='updated') updateBar(); });
  addEventListener('load',()=>{ navigator.serviceWorker.register('sw.js').then(r=>r.update()).catch(e=>console.warn('offline copy not set up',e)); });
  if(navigator.storage&&navigator.storage.persist) navigator.storage.persist().catch(()=>{});
}
</script>
