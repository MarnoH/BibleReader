<!DOCTYPE html>
<html lang="en" data-theme="auto">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-visual">
<title>Biblioteek</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="theme-color" content="#d3d0c8" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#131211" media="(prefers-color-scheme: dark)">
<meta name="mobile-web-app-capable" content="yes">
<style>
@font-face{font-family:"SS4";src:url(fonts/SourceSerif4-Regular.woff2) format("woff2");font-weight:400;font-style:normal;font-display:block}
@font-face{font-family:"SS4";src:url(fonts/SourceSerif4-It.woff2) format("woff2");font-weight:400;font-style:italic;font-display:block}
@font-face{font-family:"SS4";src:url(fonts/SourceSerif4-Semibold.woff2) format("woff2");font-weight:600;font-style:normal;font-display:block}
:root{
  color-scheme:light;
  --desk:#d3d0c8; --page:#f6f4ee; --page2:#ece9e1; --ink:#1f1d1a; --soft:#6d675d; --faint:#a29c91;
  --rule:#cfcac0; --panel:#fbfaf7; --line:#dcd8cf; --sel:#2a2724; --sel-ink:#f6f4ee;
  --rubric:#a2392a; --shadow:rgba(46,36,24,.20); --fold:rgba(70,52,30,.24); --fold2:rgba(70,52,30,.07); --sheen:rgba(255,255,255,.5); --edgebg:#f1eee7; --edgeln2:#d3ccbe;
  --edgeln:#dcd6ca; --case:#e4ddd0; --plank:#8d6239; --plank-hi:#b07d4c; --plank-lo:#5e3f22;
  --serif:"SS4","Iowan Old Style","Palatino Linotype",Georgia,serif;
  --sans:system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
}
[data-theme=dark]{
  color-scheme:dark;
  --desk:#0e0d0c; --page:#211f1c; --page2:#2b2926; --ink:#e5e0d5; --soft:#9a948a; --faint:#69645c;
  --rule:#302d2a; --panel:#22201e; --line:#393633; --sel:#d8d1c2; --sel-ink:#1c1b19;
  --rubric:#d8806a; --shadow:rgba(0,0,0,.5); --fold:rgba(0,0,0,.6); --fold2:rgba(0,0,0,.2); --sheen:rgba(255,255,255,.04); --edgebg:#5e574d; --edgeln2:#37332e;
  --edgeln:#33302c; --case:#1a1816; --plank:#4b3322; --plank-hi:#664631; --plank-lo:#2c1d12;
}
@media (prefers-color-scheme:dark){
  [data-theme=auto]{
    color-scheme:dark;
    --desk:#0e0d0c; --page:#211f1c; --page2:#2b2926; --ink:#e5e0d5; --soft:#9a948a; --faint:#69645c;
    --rule:#302d2a; --panel:#22201e; --line:#393633; --sel:#d8d1c2; --sel-ink:#1c1b19;
    --rubric:#d8806a; --shadow:rgba(0,0,0,.5); --fold:rgba(0,0,0,.6); --fold2:rgba(0,0,0,.2); --sheen:rgba(255,255,255,.04); --edgebg:#5e574d; --edgeln2:#37332e;
    --edgeln:#33302c; --case:#1a1816; --plank:#4b3322; --plank-hi:#664631; --plank-lo:#2c1d12;
  }
}
/* marking colours, as in the Bible reader */
:root{--hy:rgba(255,212,0,.42);--hg:rgba(90,190,110,.36);--hb:rgba(90,160,240,.33);--hp:rgba(240,110,170,.32);--ho:rgba(255,150,40,.36);--hv:rgba(155,95,220,.30);--cr:#b3261e;--cb:#1f4fa3;--cg:#2e7d32;--cy:#a07800;--co:#c25400;--cv:#7b3fa0}
[data-theme=dark]{--hy:rgba(240,200,40,.30);--hg:rgba(110,200,120,.26);--hb:rgba(110,170,250,.27);--hp:rgba(245,120,180,.26);--ho:rgba(255,160,60,.28);--hv:rgba(175,125,240,.30);--cr:#ff8a80;--cb:#8ab4f8;--cg:#81c995;--cy:#f2c94c;--co:#ffab61;--cv:#c79bf2}
@media (prefers-color-scheme:dark){[data-theme=auto]{--hy:rgba(240,200,40,.30);--hg:rgba(110,200,120,.26);--hb:rgba(110,170,250,.27);--hp:rgba(245,120,180,.26);--ho:rgba(255,160,60,.28);--hv:rgba(175,125,240,.30);--cr:#ff8a80;--cb:#8ab4f8;--cg:#81c995;--cy:#f2c94c;--co:#ffab61;--cv:#c79bf2}}
.h-y,.h-g,.h-b,.h-p,.h-o,.h-v{border-radius:2px;-webkit-box-decoration-break:clone;box-decoration-break:clone}
.h-y{background:var(--hy)}.h-g{background:var(--hg)}.h-b{background:var(--hb)}.h-p{background:var(--hp)}.h-o{background:var(--ho)}.h-v{background:var(--hv)}
.c-r{color:var(--cr)}.c-b{color:var(--cb)}.c-g{color:var(--cg)}.c-y{color:var(--cy)}.c-o{color:var(--co)}.c-v{color:var(--cv)}
#markbar{position:fixed;z-index:90;display:none;align-items:center;gap:4px;padding:5px 6px;background:var(--panel);border:1px solid var(--line);
  border-radius:10px;box-shadow:0 12px 30px -10px var(--shadow);flex-wrap:wrap;max-width:calc(100vw - 16px)}
#markbar.on{display:flex}
#markbar button{width:28px;height:28px;border-radius:7px;border:1px solid transparent;background:none;cursor:pointer;padding:0;
  font-family:var(--serif);font-size:17px;font-weight:600;display:flex;align-items:center;justify-content:center}
#markbar button:hover{border-color:var(--line)}
#markbar [data-h]{background-clip:content-box;padding:4px}
#markbar [data-h=y]{background-color:var(--hy)}#markbar [data-h=g]{background-color:var(--hg)}#markbar [data-h=b]{background-color:var(--hb)}#markbar [data-h=p]{background-color:var(--hp)}#markbar [data-h=o]{background-color:var(--ho)}#markbar [data-h=v]{background-color:var(--hv)}
#markbar [data-c=r]{color:var(--cr)}#markbar [data-c=b]{color:var(--cb)}#markbar [data-c=g]{color:var(--cg)}#markbar [data-c=y]{color:var(--cy)}#markbar [data-c=o]{color:var(--co)}#markbar [data-c=v]{color:var(--cv)}
#markbar [data-x]{color:var(--soft)} #markbar [data-x] svg{width:16px;height:16px}
.mg{display:flex;align-items:center;gap:4px}
.msep{width:1px;height:20px;background:var(--line);margin:0 3px}
body.phone #markbar button{width:36px;height:36px}
/* on a touch screen the phone's own selection is off (it brings up Copy, Select all and the Google search); words are
   chosen by holding instead, as in the Bible, with a handle at each end to take in more or fewer words */
@media (pointer:coarse){ #flow{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none} }
::highlight(pick){background-color:rgba(70,130,220,.32)}
.hdl{position:fixed;z-index:89;width:44px;margin-left:-22px;display:none;touch-action:none;-webkit-user-select:none;user-select:none;cursor:grab}
.hdl.on{display:block}
.hdl::before{content:"";position:absolute;left:21px;top:0;width:2px;height:var(--lh,20px);background:#3c78d0;border-radius:1px}
.hdl::after{content:"";position:absolute;left:12px;top:var(--lh,20px);width:20px;height:20px;background:#3c78d0;box-shadow:0 1px 3px rgba(0,0,0,.35)}
#hA::after{border-radius:50% 0 50% 50%}
#hB::after{border-radius:0 50% 50% 50%}
.hdl.drag::after{transform:scale(1.15)}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{height:100%}
body{margin:0;height:100vh;height:100dvh;display:flex;flex-direction:column;overflow:hidden;background:var(--desk);color:var(--ink);
  font:14px/1.4 var(--sans);padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit}
button:focus-visible,a:focus-visible{outline:2px solid var(--rubric);outline-offset:2px}
.scroll{scrollbar-width:thin;scrollbar-color:var(--line) transparent;scrollbar-gutter:stable}
.scroll::-webkit-scrollbar{width:9px;height:9px}.scroll::-webkit-scrollbar-thumb{background:var(--line);border-radius:6px}.scroll::-webkit-scrollbar-track{background:transparent}

/* ---------- chrome ---------- */
#top{flex:none;height:48px;display:flex;align-items:center;gap:6px;padding:0 12px}
.tb{background:none;border:0;padding:6px 10px;border-radius:7px;cursor:pointer;color:var(--ink);text-decoration:none;display:flex;align-items:center;gap:7px;font-family:var(--serif);font-size:15px;white-space:nowrap}
.tb:hover{background:color-mix(in srgb,var(--ink) 7%,transparent)}
.tb svg{width:19px;height:19px;flex:none}
#aa{font-size:19px}
#titlebtn{position:relative;font-size:16px;padding:5px 15px;border-radius:4px;color:#efe2bf;max-width:46vw;overflow:hidden;
  background:linear-gradient(90deg,rgba(0,0,0,.3),rgba(255,255,255,.11) 28%,rgba(255,255,255,.04) 60%,rgba(0,0,0,.3)),var(--c,#4a4642);box-shadow:inset 0 0 0 1px rgba(0,0,0,.28),0 1px 3px var(--shadow)}
#titlebtn span{overflow:hidden;text-overflow:ellipsis}
#titlebtn:hover{filter:brightness(1.1);background:linear-gradient(90deg,rgba(0,0,0,.3),rgba(255,255,255,.11) 28%,rgba(255,255,255,.04) 60%,rgba(0,0,0,.3)),var(--c,#4a4642)}
#resume{border:1px solid var(--line)}
/* the top bar never makes the page wider than the screen: a long "Continue · …" gives way with … (a phone otherwise
   zooms the whole page out, or lets it slide sideways) */
#top{max-width:100vw}
/* nothing in the page area may reach past the screen's sides either (a book's page edges did, by 3 px on a narrow phone) */
#stage{overflow:clip}
#top>*{flex:none}
#top>#resume,#top>#titlebtn{flex:0 1 auto;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
body.phone #top{gap:2px;padding:0 6px}
body.phone #top>.tb{padding-left:7px;padding-right:7px}
.grow{flex:1}
#write{position:fixed;top:48px;right:0;bottom:0;width:min(420px,94vw);z-index:41;display:none;flex-direction:column;background:var(--panel);border-left:1px solid var(--line);box-shadow:-10px 0 30px -18px var(--shadow)}
body.writing #write{display:flex}
body.writing:not(.phone) #stage,body.writing:not(.phone) #status{margin-right:min(420px,94vw)}
body.phone #write{top:auto;left:0;right:0;width:auto;height:52vh;border-left:0;border-top:1px solid var(--line);border-radius:14px 14px 0 0;box-shadow:0 -12px 30px -16px var(--shadow)}
body.phone.writing #stage{margin-bottom:calc(52vh - 36px)}
#wbody{flex:1;overflow:auto;padding:4px 14px 18px;display:flex;flex-direction:column}
#wbody .pf{flex:none}
.wh{font:600 11.5px var(--sans);letter-spacing:.06em;text-transform:uppercase;color:var(--faint);margin:16px 2px 6px}
.wh small{text-transform:none;letter-spacing:0;font-weight:400;margin-left:4px}
.wrow{display:flex;align-items:center;gap:4px;border-bottom:1px solid var(--rule);padding:3px 0}
.wn{width:1.6em;text-align:right;color:var(--faint);font:12px var(--sans);flex:none}
.wlab{flex:1;min-width:0;text-align:left;border:0;background:none;cursor:pointer;padding:5px 6px;border-radius:7px;font:15px var(--serif);color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.wlab:hover{background:color-mix(in srgb,var(--ink) 6%,transparent)}
.wlab small{display:block;font:11.5px var(--sans);color:var(--faint)}
.wb{border:0;background:none;cursor:pointer;color:var(--soft);font-size:15px;padding:4px 7px;border-radius:6px}
.wb:hover{background:color-mix(in srgb,var(--ink) 7%,transparent)}
.wb:disabled{opacity:.25;cursor:default}
.wdel:hover{color:var(--rubric)}
.wadd{margin:12px 0 0;align-self:flex-start}
.wexp{display:flex;gap:8px;margin-top:18px;padding-top:12px;border-top:1px solid var(--line)}
.wtop{display:flex;align-items:center;gap:8px;margin:0 0 8px}
.wcount{margin-left:auto;font-size:12px;color:var(--faint)}
.wtools{display:flex;gap:4px;flex-wrap:wrap;margin:0 0 6px}
.wtools button{border:1px solid var(--line);background:var(--page);border-radius:6px;padding:3px 9px;cursor:pointer;font:600 13.5px var(--serif);color:var(--ink);min-width:32px}
.wtools button:hover{border-color:var(--soft)}
#wtext{flex:1;min-height:240px;width:100%;resize:none;border:1px solid var(--line);border-radius:8px;background:var(--page);color:var(--ink);padding:10px 12px;
  font:15px/1.55 ui-monospace,"SF Mono",Menlo,Consolas,monospace;outline:0}
#wtext:focus{border-color:var(--soft)}
.whelp{font-size:12px;color:var(--faint);margin:6px 2px 0;line-height:1.45}
#writebtn[aria-pressed=true]{background:color-mix(in srgb,var(--ink) 9%,transparent)}
#notes{position:fixed;top:48px;right:0;bottom:0;width:min(380px,92vw);z-index:40;display:none;flex-direction:column;background:var(--panel);border-left:1px solid var(--line);box-shadow:-10px 0 30px -18px var(--shadow)}
body.notes #notes{display:flex}
body.notes:not(.phone) #stage,body.notes:not(.phone) #status{margin-right:min(380px,92vw)}
body.phone #notes{top:auto;left:0;right:0;width:auto;height:48vh;border-left:0;border-top:1px solid var(--line);border-radius:14px 14px 0 0;box-shadow:0 -12px 30px -16px var(--shadow)}
body.phone.notes #stage{margin-bottom:calc(48vh - 36px)}
.nh{display:flex;align-items:center;padding:10px 12px 6px 16px;font:600 16px var(--serif)}
.nh b{flex:1}
.nh .x{border:0;background:none;font-size:22px;cursor:pointer;color:var(--soft)}
#nlist{flex:1;overflow:auto;padding:4px 14px 20px}
.nadd{margin:2px 0 12px}
.nc{background:var(--page);border:1px solid var(--line);border-radius:8px;margin:0 0 10px;box-shadow:0 1px 2px var(--shadow)}
.nch{display:flex;align-items:flex-start;gap:6px;padding:7px 8px 0 11px;font:13px/1.35 var(--serif);color:var(--soft)}
.nch span{flex:1;min-width:0}
.nch b{color:var(--ink);font-weight:600}
.ndel{border:0;background:none;color:var(--faint);font-size:17px;cursor:pointer;line-height:1;padding:0 2px}
.ndel:hover{color:var(--rubric)}
.nc textarea{display:block;width:100%;border:0;background:transparent;resize:none;padding:6px 11px 10px;font:15.5px/1.5 var(--serif);color:var(--ink);outline:0;
  background-image:linear-gradient(transparent calc(1.5em - 1px),var(--rule) calc(1.5em - 1px),var(--rule) 1.5em,transparent 1.5em);background-size:100% 1.5em;background-position:0 6px}
.nc textarea::placeholder{color:var(--faint);font-style:italic}
.nnone{color:var(--faint);font:italic 14px var(--serif);margin:4px 2px 12px}
.nall{margin-top:16px;padding-top:10px;border-top:1px solid var(--line)}
.nall>b{display:block;font:600 11.5px var(--sans);letter-spacing:.06em;text-transform:uppercase;color:var(--faint);margin:0 0 6px}
.nlink{display:block;width:100%;text-align:left;border:0;background:none;border-radius:7px;padding:5px 7px;cursor:pointer;color:var(--ink)}
.nlink:hover{background:color-mix(in srgb,var(--ink) 6%,transparent)}
.nlink.here{border-left:3px solid var(--rubric)}
.nlink span{display:block;font:14px var(--serif)}
.nlink small{display:block;font:12px var(--sans);color:var(--faint);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#notesbtn{position:relative}
#notesbtn .dot{position:absolute;top:7px;right:7px;width:6px;height:6px;border-radius:50%;background:var(--rubric)}
#notesbtn[aria-pressed=true]{background:color-mix(in srgb,var(--ink) 9%,transparent)}
.drv{margin-top:12px;padding-top:12px;border-top:1px solid var(--line);font-size:12.5px;color:var(--soft)}
.drv b{display:block;font:600 14px var(--sans);color:var(--ink);margin-bottom:3px}
.drv p{margin:0 0 8px;line-height:1.45}
.drst{margin:8px 0 2px!important;color:var(--faint);min-height:1em}
.drv a{font-size:12px;color:var(--faint)}
.bkrow{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px;padding-top:12px;border-top:1px solid var(--line)}
.bkrow p{flex-basis:100%;margin:0 0 4px;font-size:12.5px;color:var(--soft)}
#stage{flex:1;min-height:0;min-width:0;position:relative;display:flex;align-items:center;justify-content:center}
#status{flex:none;height:36px;display:flex;align-items:center;justify-content:center;gap:12px;border-top:1px solid var(--rule);
  font-family:var(--serif);font-size:14px;color:var(--soft);padding:0 10px;white-space:nowrap;overflow:hidden}
#status .st{overflow:hidden;text-overflow:ellipsis;max-width:60vw}
#status .pc{color:var(--faint)}
body.phone .lbl{display:none}

/* ---------- the open book ---------- */
#book{position:relative;touch-action:pan-y pinch-zoom;filter:drop-shadow(0 14px 28px var(--shadow)) drop-shadow(0 1px 1px var(--shadow))}
body.phone #book{touch-action:none;filter:none}
.pg{position:absolute;top:0;background:var(--page)}
.pg.l{left:0;border-radius:4px 0 0 4px;background:linear-gradient(to left,var(--fold) 0,var(--fold2) 2.5%,transparent 8%,var(--sheen) 12%,transparent 19%),var(--page);}
.pg.r{border-radius:0 4px 4px 0;background:linear-gradient(to right,var(--fold) 0,var(--fold2) 2.5%,transparent 8%,var(--sheen) 12%,transparent 19%),var(--page);}
/* the hard cover the pages lie on: a board in the book's cloth colour, a little larger than the pages */
.cover{position:absolute;z-index:-2;display:none;pointer-events:none;top:calc(-1 * var(--bd,7px));bottom:calc(-1 * var(--bd,7px));
  left:calc(-1 * (var(--wl,0px) + var(--bd,7px)));right:calc(-1 * (var(--wr,0px) + var(--bd,7px)));border-radius:6px;
  background:linear-gradient(to right,rgba(0,0,0,.38),rgba(255,255,255,.07) 1.2%,transparent 3.5%,transparent 96.5%,rgba(255,255,255,.07) 98.8%,rgba(0,0,0,.38)),
    linear-gradient(rgba(255,255,255,.09),transparent 25%,transparent 75%,rgba(0,0,0,.2)),var(--coverc,#5a1f22);
  box-shadow:inset 0 0 0 1px rgba(0,0,0,.4),inset 0 1px 0 rgba(255,255,255,.14)}
#book.covered .cover{display:block}
/* the crease where the two pages meet in the binding */
#book:not(.single)::before{content:"";position:absolute;left:calc(50% - 1.5px);top:var(--dip,0);bottom:0;width:3px;z-index:2;pointer-events:none;
  background:linear-gradient(to right,transparent,var(--fold) 40%,var(--fold) 60%,transparent)}
/* page edges beside the open book: the left stack grows and the right one shrinks as you read on */
.edge{position:absolute;width:var(--w,4px);z-index:-1;top:var(--sag,0);bottom:var(--sag,0);
  background:repeating-linear-gradient(to right,var(--edgebg) 0 1px,var(--edgeln2) 1px 2px);box-shadow:inset 0 0 0 .5px rgba(0,0,0,.18)}
.edge.l{right:100%;border-radius:3px 0 0 3px}.edge.r{left:100%;border-radius:0 3px 3px 0}
#book.single .pg.l{border-radius:4px;background:var(--page)}
#book.single .pg.r{display:none}
.rh,.fo{position:absolute;font-family:var(--serif);font-size:calc(var(--fs) * .78);color:var(--soft);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:calc(100% - 2 * var(--mo))}
.rh{top:calc(var(--mt) * .36);text-transform:uppercase;letter-spacing:.08em}
.fo{bottom:calc(var(--mb) * .32);font-feature-settings:"lnum"}
.pg.l .rh,.pg.l .fo{left:var(--mo)}
.pg.r .rh,.pg.r .fo{right:var(--mo);text-align:right}
#book.single .pg.l .fo{left:auto;right:var(--mo)}
#vp{position:absolute;overflow:hidden}
.flow{position:absolute;left:0;top:0;column-fill:auto;font-family:var(--serif);line-height:1.42;color:var(--ink);text-align:justify;
  hyphens:auto;-webkit-hyphens:auto;orphans:2;widows:2;font-kerning:normal;text-rendering:optimizeLegibility}
body.phone .flow{text-align:left;hyphens:manual}
.flow p{margin:0;text-indent:1.3em}
.flow p.r{text-align:right;text-indent:0}
.flow p.sub{text-align:center;font-style:italic;text-indent:0;margin:-.2em 1.5em .8em}
.flow p.r+p:not(.r){margin-top:.6em}
.flow p.first,.flow .bh1+p,.flow .bh2+p,.flow .bh3+p{text-indent:0}
.flow .bh1,.flow .bh2,.flow .bh3{text-align:center;font-weight:600;break-after:avoid;text-indent:0;margin:1.1em 0 .6em;line-height:1.25}
.flow .bh1{font-size:1.32em;letter-spacing:.04em}
.flow .bh1,.flow .bh2{break-before:column}
.flow .bh1+.bh2,.flow .bh1:first-child,.flow .bh2:first-child,.flow .tp+.bk{break-before:auto}
.flow p.note{font-size:.8em;line-height:1.4;text-indent:0;color:var(--soft);margin:0 0 .25em}
.flow p.note.n1{margin-top:1.2em;padding-top:.5em;border-top:1px solid var(--line)}
.flow sup.fn{font-size:.62em;line-height:0;color:var(--rubric);padding:0 .08em;font-feature-settings:"lnum"}
.flow a.sref{color:inherit;text-decoration:underline;text-decoration-color:color-mix(in srgb,var(--rubric) 45%,transparent);text-underline-offset:.15em}
.flow a.sref:hover{color:var(--rubric)}
.flow p.c{text-align:center;text-indent:0;letter-spacing:.04em;margin:.2em 0}
.flow .bh2{font-size:1.14em;letter-spacing:.03em}
.flow .bh3{font-size:1em;letter-spacing:.02em}
.flow .unitstart{break-before:avoid}
.tp{break-after:column;text-align:center;padding-top:8%;display:flex;flex-direction:column;align-items:center;gap:.6em}
.tp img{max-width:62%;max-height:46%;border-radius:2px;box-shadow:0 6px 18px -6px var(--shadow);margin-bottom:.8em}
.tp .t{font-size:1.7em;line-height:1.15;font-weight:600;letter-spacing:.03em}
.tp .s{font-style:italic;color:var(--soft)}
.tp .a{margin-top:.6em;font-size:1.15em;letter-spacing:.12em;text-transform:uppercase}
.tp .y{color:var(--soft);font-feature-settings:"lnum"}
.tp .src{margin-top:auto;font-size:.72em;color:var(--faint);max-width:90%}
.flash{animation:flash 1.8s ease-out}
@keyframes flash{from{background:color-mix(in srgb,var(--rubric) 22%,transparent)}to{background:transparent}}
#measure{position:fixed;left:0;top:0;width:0;height:0;overflow:hidden;visibility:hidden;pointer-events:none;contain:strict}

/* ---------- the bookshelf ---------- */
#shelf{position:absolute;inset:0;z-index:30;overflow:auto;background:var(--desk);padding:6px 16px calc(48px + env(safe-area-inset-bottom,0px));display:none}
#shelf.on{display:block}
.case{margin:14px auto 0;max-width:1180px;background:var(--case);border:12px solid var(--plank);border-bottom:0;border-radius:3px 3px 0 0;padding:0 22px;
  box-shadow:inset 0 10px 24px -14px rgba(0,0,0,.45),0 18px 40px -18px var(--shadow);position:relative}
.casename{position:absolute;top:-13px;left:50%;transform:translateX(-50%);z-index:2;white-space:nowrap;font-family:var(--serif);font-size:11.5px;
  letter-spacing:.08em;color:#3a2a14;padding:1px 12px 0;border-radius:2px;background:linear-gradient(#e7d29c,#bf9d5a);box-shadow:0 1px 1px rgba(0,0,0,.35)}
.row{display:flex;align-items:flex-end;gap:1px;height:var(--rowh);padding:18px 0 0;margin-bottom:22px;position:relative}
.row::after{content:"";position:absolute;left:-22px;right:-22px;bottom:-22px;height:22px;background:linear-gradient(var(--plank-hi),var(--plank) 35%,var(--plank-lo));box-shadow:0 6px 10px -6px rgba(0,0,0,.45)}
.bmrib{position:absolute;top:-5px;right:16%;z-index:6;width:15px;height:52px;display:none;pointer-events:none;
  background:linear-gradient(90deg,#7a1f1a,#b03a30 45%,#8a241e);clip-path:polygon(0 0,100% 0,100% 100%,50% 82%,0 100%);box-shadow:0 2px 3px rgba(0,0,0,.3)}
.bmrib.on{display:block}
#bmbtn[aria-pressed=true]{color:#b03a30}
#bmbtn[aria-pressed=true] svg path{fill:currentColor}
.bmh{font:600 11.5px var(--sans);letter-spacing:.06em;text-transform:uppercase;color:var(--faint);margin:12px 8px 4px}
.bmi{display:flex;align-items:center}
.bmi>button:first-child{flex:1}
.bmi b{font-weight:600}
.bmdel{width:auto!important;flex:none;color:var(--faint)!important;font-size:17px!important;padding:4px 8px!important}
.bmdel:hover{color:var(--rubric)!important}
.grp{position:relative;display:flex;align-items:flex-end;gap:1px;height:100%}
.grp+.grp{margin-left:30px}
.grp+.grp::before{content:"";position:absolute;left:-17px;bottom:0;width:4px;height:46%;border-radius:2px 2px 0 0;background:linear-gradient(90deg,var(--plank-lo),var(--plank-hi),var(--plank-lo));box-shadow:1px 0 2px rgba(0,0,0,.3)}
.plate{position:absolute;bottom:-18px;left:0;z-index:2;white-space:nowrap;font-family:var(--serif);font-size:11px;letter-spacing:.06em;color:#3a2a14;
  padding:1px 9px 0;border-radius:2px;background:linear-gradient(#e7d29c,#bf9d5a);box-shadow:0 1px 1px rgba(0,0,0,.35)}
.sp{position:relative;width:var(--w);height:var(--h);padding:0;border:0;cursor:pointer;border-radius:2px 2px 1px 1px;flex:none;
  background:linear-gradient(90deg,rgba(0,0,0,.34),rgba(255,255,255,.12) 28%,rgba(255,255,255,.05) 55%,rgba(0,0,0,.36)),var(--c);
  box-shadow:inset 0 0 0 1px rgba(0,0,0,.28),2px 0 3px -1px rgba(0,0,0,.35);color:#efe2bf;transition:transform .16s cubic-bezier(.2,.7,.2,1);
  display:flex;flex-direction:column;align-items:center;justify-content:space-between;padding:16px 0 26px}
.sp::before,.sp::after{content:"";position:absolute;left:2px;right:2px;height:3px;border-top:1px solid rgba(226,196,122,.75);border-bottom:1px solid rgba(226,196,122,.75)}
.sp::before{top:8px}.sp::after{bottom:28px}
.sp:hover,.sp:focus-visible{transform:translateY(-9px)}
.sp.pull{transform:translateY(-24px) scale(1.03)}
.sp .nm{writing-mode:vertical-rl;font-family:var(--serif);font-size:var(--fz);letter-spacing:.04em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1 1 auto;min-height:0;margin:6px 0 10px}
.sp .au{writing-mode:vertical-rl;font-family:var(--serif);font-size:calc(var(--fz) * .72);letter-spacing:.12em;text-transform:uppercase;opacity:.85;white-space:nowrap;flex:none;margin-bottom:6px}
.tag{position:absolute;bottom:9px;left:4px;right:4px;height:11px;border-radius:1px;box-shadow:0 0 0 1px rgba(255,255,255,.35)}
.tag[data-l="2"]{background:#cfdbe4}.tag[data-l="4"]{background:#93afc3}.tag[data-l="6"]{background:#4e7c9a}.tag[data-l="7"]{background:#2b5a7d}.tag[data-l="8"]{background:#e3c25b}
.plate{z-index:4!important}   /* the name plate in front of the last-read ribbon's tail */
.rib{position:absolute;bottom:-34px;left:calc(50% - 4px);width:8px;height:42px;background:#e2bf35;z-index:3;clip-path:polygon(0 0,100% 0,100% 100%,50% 80%,0 100%);box-shadow:0 2px 2px rgba(0,0,0,.3)}
.empty{max-width:560px;margin:40px auto;text-align:center;font-family:var(--serif);font-size:16px;color:var(--soft);line-height:1.55}
.shelfnote{max-width:760px;margin:16px auto 0;text-align:center;color:var(--soft);font-size:13px;line-height:1.55;overflow-wrap:anywhere}
/* the buttons on a row of their own, the storage line under them: nothing runs off a narrow screen or large type */
.shelfacts{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;margin-top:10px}
.shelfacts .btn{margin:0!important;max-width:100%}
.stor{display:block;margin-top:8px;font-size:12px;color:var(--faint)}
.btn{background:none;border:1px solid var(--line);border-radius:8px;padding:6px 12px;cursor:pointer;color:var(--ink)}
.btn:hover{border-color:var(--soft)}
.pdfimp{display:flex;gap:16px;align-items:flex-start;margin:4px 0 12px}
.pcov{width:96px;border:1px solid var(--line);border-radius:3px;box-shadow:0 2px 8px -2px var(--shadow);flex:none}
.pf{flex:1;min-width:0;display:flex;flex-direction:column;gap:8px}
.pf label{display:flex;flex-direction:column;gap:3px;font-size:12px;color:var(--soft)}
.pf input,.pf select{font:15px var(--serif);color:var(--ink);background:var(--page);border:1px solid var(--line);border-radius:7px;padding:6px 8px;min-width:0}
.pst{margin:2px 0 0;font-size:12.5px;color:var(--faint)}
@media (max-width:520px){ .pcov{width:70px} }
.btn.main{background:var(--sel);color:var(--sel-ink);border-color:var(--sel)}

/* ---------- panels ---------- */
.panel{position:absolute;z-index:60;background:var(--panel);border:1px solid var(--line);border-radius:12px;box-shadow:0 22px 50px -12px var(--shadow);display:none;overflow:auto}
.panel.on{display:block}
#set{top:6px;right:12px;width:380px;max-width:calc(100vw - 24px);max-height:calc(100% - 12px);padding:12px 16px}
#toc,#info,#log{top:10px;left:50%;transform:translateX(-50%);width:min(620px,calc(100vw - 24px));max-height:calc(100% - 20px);padding:14px 18px 16px}
.ph{display:flex;align-items:center;gap:10px;margin:0 0 8px}
.ph b{font-family:var(--serif);font-size:19px;font-weight:600;flex:1;min-width:0}
.x{background:none;border:0;font-size:20px;line-height:1;color:var(--soft);cursor:pointer;padding:2px 6px;border-radius:6px}
.srow{display:grid;grid-template-columns:110px 1fr;align-items:center;gap:10px;margin:7px 0}
.seg{display:flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{flex:1;border:0;border-left:1px solid var(--line);background:transparent;padding:7px 4px;cursor:pointer;white-space:nowrap}
.seg button:first-child{border-left:0}
.seg button[aria-pressed=true]{background:var(--sel);color:var(--sel-ink)}
.tocl button{display:block;width:100%;text-align:left;background:none;border:0;border-radius:7px;padding:6px 8px;cursor:pointer;font-family:var(--serif);font-size:15px;color:var(--ink)}
.tocl button:hover{background:color-mix(in srgb,var(--ink) 7%,transparent)}
.tocl button.l3{padding-left:28px;font-size:14px;color:var(--soft)}
.tocl button.cur{color:var(--rubric)}
.tocl .pct{float:right;color:var(--faint);font-family:var(--sans);font-size:12px;font-feature-settings:"lnum"}
.card{display:grid;grid-template-columns:auto 1fr;gap:16px}
.card img{width:120px;border-radius:2px;box-shadow:0 6px 16px -6px var(--shadow)}
.card .fake{width:120px;height:180px;border-radius:2px;display:flex;align-items:center;justify-content:center;text-align:center;padding:10px;
  color:#efe2bf;font-family:var(--serif);font-size:15px;background:linear-gradient(90deg,rgba(0,0,0,.25),rgba(255,255,255,.08) 30%,rgba(0,0,0,.25)),var(--c)}
.card h3{margin:0;font-family:var(--serif);font-size:20px;line-height:1.2}
.card .sub{font-family:var(--serif);font-style:italic;color:var(--soft);margin-top:2px}
.card .au{margin-top:6px;font-family:var(--serif);letter-spacing:.08em;text-transform:uppercase;font-size:13px}
.stats{display:grid;grid-template-columns:repeat(3,auto);gap:4px 18px;margin:12px 0 4px;font-size:13px;color:var(--soft)}
.stats b{display:block;font-size:16px;color:var(--ink);font-family:var(--serif);font-weight:600;font-feature-settings:"lnum"}
.swatches{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0}
.swatches button{width:24px;height:24px;border-radius:4px;border:2px solid var(--panel);box-shadow:0 0 0 1px var(--line);cursor:pointer;background:var(--c)}
.swatches button[aria-pressed=true]{box-shadow:0 0 0 2px var(--ink)}
.acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.lic{font-size:12px;color:var(--faint);margin-top:10px;line-height:1.45}
select.sel{font:inherit;color:var(--ink);background:var(--page);border:1px solid var(--line);border-radius:7px;padding:5px 8px}
table.lg{width:100%;border-collapse:collapse;font-size:13.5px}
table.lg td,table.lg th{padding:6px 6px;border-bottom:1px solid var(--line);text-align:left}
table.lg th{font-weight:400;color:var(--soft);font-size:12px}
table.lg td.n{text-align:right;font-feature-settings:"lnum";white-space:nowrap}
table.lg td:first-child{font-family:var(--serif);font-size:15px}
#busy{position:absolute;inset:0;display:none;align-items:center;justify-content:center;background:var(--desk);z-index:70;font-family:var(--serif);font-size:17px;color:var(--soft);text-align:center;padding:20px}
#busy.on{display:flex}
@media (prefers-reduced-motion:reduce){.flash{animation:none}.sp{transition:none}}
/* ---------- stronger contrast, for screens that wash out the shading ---------- */
[data-contrast=strong]:not([data-theme=dark]){--desk:#b3ada0;--page:#fdfcf8;--page2:#e0dbcf;--ink:#100e0b;--soft:#4a443a;--rule:#b0a99b;--line:#c2bbad;
  --fold:rgba(60,40,15,.45);--fold2:rgba(60,40,15,.15);--sheen:rgba(255,255,255,.7);--edgebg:#fffdf8;--edgeln2:#9e937e;--shadow:rgba(30,20,10,.38)}

}

   "Sync" fetches the copy in Drive, merges it into this device (the newer of two versions wins), and saves the merged
   result back, so a phone and a computer agree after each sync. Nothing goes anywhere else: no server of ours. */
(function(){
const CLIENT='618969271604-ok33ioqe2dfstd5ljuifr1dv7grle46v.apps.googleusercontent.com', SCOPE='https://www.googleapis.com/auth/drive.file', FOLDER='Bybel-app', KEY='bybel-gdrive-v1';
const API='https://www.googleapis.com/drive/v3/files', UP='https://www.googleapis.com/upload/drive/v3/files';
let st={}; try{ st=JSON.parse(localStorage.getItem(KEY)||'{}'); }catch(e){}
const keep=()=>{ try{ localStorage.setItem(KEY,JSON.stringify(st)); }catch(e){} };
let token=null, until=0, gis=null, client=null;
function loadGis(){
  if(gis) return gis;
  gis=new Promise((ok,no)=>{ if(window.google&&google.accounts&&google.accounts.oauth2) return ok();

    document.head.appendChild(s); });

  for(const b of all){ const s=shelfOf(b); if(!groups.has(s)) groups.set(s,[]); groups.get(s).push(b); }

  const room=Math.min(1180,shelf.clientWidth-32)-24-44;
  let h='<div class="case"><div class="casename">'+esc(L.library)+'</div>';
  // categories share a shelf while they fit (each with its own plate), unless each is to have a shelf of its own
  const GAP=30, rows=[]; let cur=[], curW=0;

  const place=(grp,w)=>{ if(cur.length&&curW+GAP+w>room) endRow(); curW+=(cur.length?GAP:0)+w; cur.push(grp); };
  for(const [sid,books] of groups){ if(!books.length) continue;
    if(ST.s.pack==='own') endRow();
    books.sort((a,z)=>(a.author||'').localeCompare(z.author||'')||(a.title||'').localeCompare(z.title||''));
    let row=[], width=0, firstRow=true;

    if(cur.length&&curW+GAP+Math.min(total,room)>room) endRow();

    const lw=Math.round(shelfName(sid).length*6.9+24);
    const flush=()=>{ const w=firstRow?Math.max(width,lw):width, grp='<div class="grp" style="min-width:'+w+'px">'+row.join('')+(firstRow?'<div class="plate">'+esc(shelfName(sid))+'</div>':'')+'</div>';

        '<span class="nm">'+esc(b.short||b.title)+'</span><span class="au">'+esc(au)+'</span>'+(tag?'<i class="tag" data-l="'+tag+'"></i>':'')+(ST.last===b.id?'<i class="rib"></i>':'')+'</button>');
      width+=w+1; }
    if(row.length) flush(); }
  endRow();
  for(const r of rows) h+='<div class="row" style="--rowh:'+(H+18)+'px">'+r.join('')+'</div>';
  h+='</div><p class="shelfnote">'+esc(L.hint)+'<span class="shelfacts"><button class="btn" type="button" data-act="add">'+esc(L.add)+'</button><button class="btn" type="button" data-act="newbook">'+esc(L.ownNew)+'</button></span><span class="stor"></span></p>';
  shelf.innerHTML=h;

}

/* ---------------- a PDF made into a book, on this device ----------------
   For PDFs that carry their text (most made on a computer). A scan is only pictures of pages: it is turned away,
   since reading text from pictures (OCR) needs more than a phone can do well. PDF.js (Mozilla, Apache 2.0) is
   fetched the first time a PDF is added and kept for offline use.
   The text is rebuilt into the library's own blocks: headings by type size, paragraphs from the line layout
   (an indent, a short last line or a wider gap starts a new one; a paragraph runs on over the page), words broken

    const gaps=[]; for(let i=1;i<p.lines.length;i++){ const g=p.lines[i-1].y-p.lines[i].y; if(g>0&&Math.abs(p.lines[i].size-body)<body*.12) gaps.push(g); }
    gaps.sort((a,b)=>a-b); const lg=gaps.length?gaps[Math.floor(gaps.length/2)]:body*1.3;
    let prev=null;
    for(const ln of p.lines){

      const foot=ln.size<body*.88&&ln.y<p.h*.2;
      if(lv){ // a heading; one set over two lines is one heading
        const last=B[B.length-1];
        if(!para&&last&&last[0]===lv&&prev&&prev.lv===lv) last[1]+=' '+ln.txt; else { close(); B.push([lv,ln.txt]); }
        prev={lv,ln}; continue;
      }

        if(pl&&pl.x1<right-body*2.5&&(/[.!?:\u201d\u2019"')\]]$/.test(pl.txt)||pl.x1<left+(right-left)*.6)) fresh=true;

  try{ const pg=await doc.getPage(1), v0=pg.getViewport({scale:1}), sc=216/v0.width, v=pg.getViewport({scale:sc});
    const cv=document.createElement('canvas'); cv.width=Math.round(v.width); cv.height=Math.round(v.height);

  const words=B.reduce((s,[,t])=>s+t.replace(/<[^>]+>/g,'').split(/\s+/).filter(Boolean).length,0);
  return {v:1,id:bookId('pdf',title,B),
    title,short:title.length>30?title.slice(0,30).replace(/\s+\S*$/,''):title,author:(info.Author||'').trim(),year:'',shelf:'other',lang:ST.s.lang==='af'&&/\b(die|en|van|het)\b/.test(B.slice(0,30).map(x=>x[1]).join(' '))?'af':'en',
    source:file.name,license:L.pdfPersonal,cover,words,b:B,_pages:N,_heads:B.filter(x=>x[0][0]==='h').length};
}

function confirmPdf(bk){

      '<label>'+esc(L.pdfAuthor)+'<input id="pa" value="'+esc(bk.author)+'"></label>'+

/* ---------------- a Markdown (or plain text) file made into a book ----------------
   An easy way to prepare a book by hand. Optional details at the top, between two lines of "---":
     title: …   author: …   year: …   shelf: Puritans (or puritans, devotional, sermons …)   subtitle: …
   Then "#", "##", "###" for headings (the highest level used becomes the chapter level), a blank line between
   paragraphs, *italic* or _italic_, **bold**, "> " for a quotation (small print), "- " or "1. " for list items,
   "***" or "---" alone for a break. A "# Title" on the very first line is taken as the book's title.
   Links keep only their words; anything else is kept as plain text. */
// Bible references in Markdown: [[Rom 8:28]], or [your words](1 Kor 13) — book names in English or Afrikaans, in full
// or abbreviated (from the app's own book list, kept on the device). Each becomes a link that opens the Bible there.
let BNAMES=null;
async function bibleNames(){ if(BNAMES) return BNAMES; try{ const b=await (await fetch('data/base.v1.json')).json(); BNAMES=[b.names.af,b.names.en]; }catch(e){ BNAMES=[]; } return BNAMES; }
const nName=x=>x.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[\s.]/g,'');
function bibleRef(s){
  if(!BNAMES||!BNAMES.length) return null;
  const m=/^\s*(\d?\s*[^\d:]+?)\.?\s*(\d+)?(?:\s*[:.,]\s*(\d+))?(?:\s*[-\u2013\u2014]\s*\d+(?:\s*[:.,]\s*\d+)?)?\s*$/.exec(s||''); if(!m) return null;
  const q=nName(m[1]); if(q.length<2) return null;
  let b=-1;
  for(const list of BNAMES){ b=list.findIndex(([n,a])=>nName(n)===q||nName(a)===q); if(b>=0) break; }
  if(b<0) b=OSIS66.findIndex(o=>o.toLowerCase()===q);
  if(b<0&&q.length>=3) for(const list of BNAMES){ b=list.findIndex(([n])=>nName(n).startsWith(q)); if(b>=0) break; }
  if(b<0) return null;
  return OSIS66[b]+'.'+(m[2]||1)+'.'+(m[3]||1);
}
const unescT=s=>s.replace(/&lt;/g,'<').replace(/&gt;/g,'>').replace(/&amp;/g,'&');
const srefA=(o,words)=>'<a class="sref" href="./?ref='+o+'">'+words+'</a>';
function inlineMd(s){
  let h=escT(s);
  h=h.replace(/!\[[^\]]*\]\([^)]*\)/g,'');                                                        // images out
  h=h.replace(/\[\[([^\]]+)\]\]/g,(m,r)=>{ const o=bibleRef(unescT(r)); return o?srefA(o,r):r; });       // [[Rom 8:28]]
  h=h.replace(/\[([^\]]+)\]\(([^)]*)\)/g,(m,w,tg)=>{ const o=bibleRef(unescT(tg)); return o?srefA(o,w):w; });   // [words](Rom 8:28); other links keep their words
  h=h.replace(/\*\*([^*]+)\*\*|__([^_]+)__/g,(m,a,b)=>'<b>'+(a||b)+'</b>');
  h=h.replace(/(^|[^\p{L}\p{N}*])\*([^*\s][^*]*?)\*(?![\p{L}\p{N}*])/gu,'$1<i>$2</i>').replace(/(^|[^\p{L}\p{N}_])_([^_\s][^_]*?)_(?![\p{L}\p{N}_])/gu,'$1<i>$2</i>');
  return h.replace(/\\([*_#>\-\\])/g,'$1');
}
function mdToBook(text,name){
  text=text.replace(/^\ufeff/,'').replace(/\r\n?/g,'\n').replace(/<!--[\s\S]*?-->/g,'');   // notes to the writer are not part of the book
  const meta={}; const fm=/^---\n([\s\S]*?)\n---\n/.exec(text);
  if(fm){ for(const l of fm[1].split('\n')){ const m=/^\s*([A-Za-z\u00c0-\u024f]+)\s*:\s*(.*)$/.exec(l); if(m) meta[m[1].toLowerCase()]=m[2].trim().replace(/^["']|["']$/g,''); } text=text.slice(fm[0].length); }
  const out=mdParse(text,/\.(md|markdown)$/i.test(name));
  // a "# Title" first of all is the book's title, unless it is one chapter among others of its level
  let title=meta.title||'';
  if(out.length&&out[0][0][0]==='#'){
    const lv=out[0][0], same=out.filter(b=>b[0]===lv).length;
    if(!title&&same===1){ title=out[0][1]; out.shift(); }
    else if(title&&out[0][1].trim().toLowerCase()===title.toLowerCase()) out.shift();
  }
  if(!title) title=name.replace(/\.(md|markdown|txt)$/i,'').replace(/[_-]+/g,' ').trim();
  const B=mdRank(out);
  // a shelf named in English or Afrikaans
  const sh=(meta.shelf||meta.rak||'').toLowerCase();
  const shelf=SHELF_ORDER.find(s=>s===sh||[UI.en.shelves[s],UI.af.shelves[s]].some(n=>n&&n.toLowerCase()===sh))||'other';
  const words=B.reduce((s,[,t])=>s+t.replace(/<[^>]+>/g,'').split(/\s+/).filter(Boolean).length,0);
  return {v:1,id:bookId('md',title,B),
    title,short:title.length>30?title.slice(0,30).replace(/\s+\S*$/,''):title,subtitle:meta.subtitle||'',author:meta.author||meta.skrywer||'',year:meta.year||meta.jaar||'',
    shelf,lang:/\b(die|het|van|nie)\b/.test(B.slice(0,20).map(x=>x[1]).join(' '))?'af':'en',source:name,license:L.pdfPersonal,words,b:B,
    _stats:L.mdStats.replace('{w}',words.toLocaleString()).replace('{h}',B.filter(x=>x[0][0]==='h').length)};
}
// Markdown lines into blocks, headings kept as "#1".."#6" (ranked afterwards, over the whole book)
function mdParse(text,isMd){
  text=text.replace(/\r\n?/g,'\n').replace(/<!--[\s\S]*?-->/g,'');
  const out=[];
  let para=[], quote=[];
  const flush=()=>{ if(para.length){ out.push(['p',inlineMd(para.join(' '))]); para=[]; } if(quote.length){ out.push(['ps',inlineMd(quote.join(' '))]); quote=[]; } };
  for(const raw of text.split('\n')){
    const l=raw.trim();
    if(!l){ flush(); continue; }
    let m;
    if(isMd&&(m=/^(#{1,6})\s+(.*?)\s*#*$/.exec(l))){ flush(); out.push(['#'+m[1].length,m[2].replace(/\*\*|__|\*|_/g,'')]); continue; }
    if(isMd&&/^([-*_])(\s*\1){2,}$/.test(l)){ flush(); out.push(['ps','* * *']); continue; }
    if(isMd&&(m=/^>\s?(.*)$/.exec(l))){ if(para.length){ out.push(['p',inlineMd(para.join(' '))]); para=[]; } quote.push(m[1]); continue; }
    if(isMd&&(m=/^(?:[-*+]|\d+[.)])\s+(.*)$/.exec(l))){ flush(); out.push(['p',(/^\d/.test(l)?escT(l.match(/^\d+[.)]/)[0])+' ':'\u2022 ')+inlineMd(m[1])]); continue; }
    if(quote.length){ out.push(['ps',inlineMd(quote.join(' '))]); quote=[]; }
    para.push(l);
  }
  flush();
  return out;
}
// heading levels from the highest used: that one is the chapter
function mdRank(out){
  const used=[...new Set(out.filter(b=>b[0][0]==='#').map(b=>+b[0].slice(1)))].sort((a,b)=>a-b);
  return out.map(([k,t])=>k[0]==='#'?['h'+Math.min(3,used.indexOf(+k.slice(1))+1),t]:[k,t]);
}
async function addText(f){
  await bibleNames();
  let bk; try{ bk=mdToBook(await f.text(),f.name); }catch(e){ console.warn(e); alert(L.pdfFailed.replace('{f}',f.name)); return 0; }
  if(!bk.b.length){ alert(L.pdfFailed.replace('{f}',f.name)); return 0; }
  bk=await confirmPdf(bk); if(!bk) return 0;
  return storeBook(bk);
}

/* ---------------- a ThML book (Christian Classics Ethereal Library) ----------------
   ThML marks a book's parts by what they are, so it is read as such: the div1/div2 titles are the chapters and
   sections (the capitalised heading CCEL repeats under each title is left out, as are the title page and the
   indexes at the end); the author, translator and title come from the head; footnotes keep their number in the
   text and are printed at the end of their chapter; a Scripture reference becomes a link that opens the Bible
   there; poetry keeps its lines. */
const OSIS66=['Gen','Exod','Lev','Num','Deut','Josh','Judg','Ruth','1Sam','2Sam','1Kgs','2Kgs','1Chr','2Chr','Ezra','Neh','Esth','Job','Ps','Prov','Eccl','Song','Isa','Jer','Lam','Ezek','Dan','Hos','Joel','Amos','Obad','Jonah','Mic','Nah','Hab','Zeph','Hag','Zech','Mal','Matt','Mark','Luke','John','Acts','Rom','1Cor','2Cor','Gal','Eph','Phil','Col','1Thess','2Thess','1Tim','2Tim','Titus','Phlm','Heb','Jas','1Pet','2Pet','1John','2John','3John','Jude','Rev'];
function parseThml(text){
  let d=new DOMParser().parseFromString(text,'application/xml');
  if(d.querySelector('parsererror')){
    // ThML often uses HTML's named characters (&nbsp; &mdash; …), which plain XML does not know
    const tmp=document.createElement('textarea');
    const fixed=text.replace(/<!DOCTYPE[^>]*>/i,'').replace(/&([a-zA-Z][a-zA-Z0-9]+);/g,(m,n)=>['amp','lt','gt','quot','apos'].includes(n)?m:(tmp.innerHTML=m,tmp.value.length===1||tmp.value!==m?'&#'+tmp.value.codePointAt(0)+';':m));
    d=new DOMParser().parseFromString(fixed,'application/xml');
    if(d.querySelector('parsererror')) return null;
  }
  return d.documentElement&&d.documentElement.nodeName==='ThML'?d:null;
}
function thmlToBook(d,name){
  const q=(sel,root=d)=>[...root.getElementsByTagName(sel)];
  const titles=q('DC.Title'), creators=q('DC.Creator');
  const title=(titles.find(t=>!t.getAttribute('sub'))||titles[0]||{textContent:''}).textContent.replace(/\s+/g,' ').trim()||name.replace(/\.(xml|thml)$/i,'');
  const who=(sub)=>{ const c=creators.find(c=>c.getAttribute('sub')===sub&&c.getAttribute('scheme')==='short-form')||creators.find(c=>c.getAttribute('sub')===sub); return c?c.textContent.replace(/\s+/g,' ').trim():''; };
  const author=who('Author'), translator=who('Translator');
  const rights=(q('DC.Rights')[0]||{textContent:''}).textContent.trim();
  const B=[]; let notes=[];
  const norm=s=>s.toLowerCase().normalize('NFD').replace(/[^a-z0-9]/g,'');
  const inline=el=>{ let h='';
    for(const n of el.childNodes){
      if(n.nodeType===3){ h+=escT(n.nodeValue.replace(/\s+/g,' ')); continue; }
      if(n.nodeType!==1) continue;
      const t=n.nodeName.toLowerCase();
      if(t==='note'){ const k=n.getAttribute('n')||String(notes.length+1); notes.push([k,inline(n).trim()]); h+='<sup class="fn">'+escT(k)+'</sup>'; }
      else if(t==='scripref'){ const o=(n.getAttribute('osisRef')||'').replace(/^Bible(\.[a-z]+)?:/i,'').split(/[-\s]/)[0], m=/^([1-3]?[A-Za-z]+)\.(\d+)(?:\.(\d+))?/.exec(o);
        h+=m&&OSIS66.includes(m[1])?'<a class="sref" href="./?ref='+m[1]+'.'+m[2]+'.'+(m[3]||1)+'">'+inline(n)+'</a>':inline(n); }
      else if(t==='i'||t==='em'||t==='cite') h+='<i>'+inline(n)+'</i>';
      else if(t==='b'||t==='strong') h+='<b>'+inline(n)+'</b>';
      else if(t==='sup') h+='<sup>'+inline(n)+'</sup>';
      else if(t==='br') h+='<br>';
      else if(t==='img'||t==='pb'||t==='insertindex') {}
      else h+=inline(n);
    }
    return h; };
  const flushNotes=()=>{ notes.forEach(([k,t],i)=>B.push(['pn','<sup>'+escT(k)+'</sup> '+t])); notes=[]; };
  const skipDiv=t=>/^(title page|table of contents|contents|indexes|index\b|index of)/i.test(t||'');
  // a heading's own words, without its footnotes (those still go with the chapter's notes)
  const headText=n=>{ const c=n.cloneNode(true); for(const x of [...c.getElementsByTagName('note')]){ notes.push([x.getAttribute('n')||String(notes.length+1),inline(x).trim()]); x.remove(); }
    return c.textContent.replace(/\s+/g,' ').trim(); };
  let sinceTitle=-1;     // where the last div title went: a heading right after it repeats it
  const walk=(el,depth,divTitle)=>{
    for(const n of el.children){
      const t=n.nodeName.toLowerCase(), dm=/^div(\d)?$/.exec(t);
      if(dm){ const ti=(n.getAttribute('title')||'').replace(/\s+/g,' ').trim(); if(skipDiv(ti)) continue;
        const lv=dm[1]?+dm[1]:depth+1;
        if(ti){ B.push(['h'+Math.min(3,lv),ti]); sinceTitle=B.length; }
        walk(n,lv,ti); if(lv===1) flushNotes(); continue; }
      if(/^h[1-6]$/.test(t)){ const tx=headText(n), a=norm(tx), z=norm(divTitle||'');
        // the heading CCEL repeats under the div's own title (often in capitals)
        if(B.length===sinceTitle&&z&&(a===z||z.startsWith(a)||a.startsWith(z.slice(0,20)))) continue;
        // the same heading with another chapter number (CCEL's title for XXV says "Chapter XV"): the printed one wins
        const num=/^\s*(chapter|book|part|section|hoofstuk)\s+([ivxlcdm]+|\d+)\b\.?\s*/i, ma=num.exec(tx), mz=num.exec(divTitle||'');
        if(B.length===sinceTitle&&ma&&mz&&norm(tx.slice(ma[0].length))===norm(divTitle.slice(mz[0].length))){
          B[sinceTitle-1][1]=mz[1]+' '+ma[2].toUpperCase()+'. '+divTitle.slice(mz[0].length); continue; }
        if(tx) B.push(['h3',tx]); continue; }
      if(t==='p'){ const h=inline(n).trim(); if(h) B.push(['p',h]); }
      else if(t==='verse'){ const ls=[...n.children].filter(c=>c.nodeName.toLowerCase()==='l').map(l=>inline(l).trim()).filter(Boolean); B.push(['ps',(ls.length?ls:[inline(n).trim()]).join('<br>')]); }
      else if(t==='ul'||t==='ol'){ let i=0; for(const li of n.children) if(li.nodeName.toLowerCase()==='li') B.push(['p',(t==='ol'?(++i)+'. ':'\u2022 ')+inline(li).trim()]); }
      else if(t==='blockquote'){ const ps=[...n.children].filter(c=>c.nodeName.toLowerCase()==='p'); for(const p of (ps.length?ps:[n])) B.push(['ps',inline(p).trim()]); }
      else if(t==='table'||t==='style'||t==='insertindex') {}
      else walk(n,depth,divTitle);
    }
  };
  const body=q('ThML.body')[0]; if(!body) return null;
  walk(body,0,''); flushNotes();
  const words=B.reduce((s,[,t])=>s+t.replace(/<[^>]+>/g,'').split(/\s+/).filter(Boolean).length,0);
  return {v:1,id:bookId('thml',title,B),
    title,short:title.length>30?title.slice(0,30).replace(/\s+\S*$/,''):title,subtitle:translator?L.thmlTr.replace('{t}',translator):'',author,year:'',shelf:'other',lang:'en',
    source:'Christian Classics Ethereal Library (ccel.org)'+(name?' \u00b7 '+name:''),license:rights||L.pdfPersonal,words,b:B,
    _stats:L.mdStats.replace('{w}',words.toLocaleString()).replace('{h}',B.filter(x=>x[0][0]==='h').length)};
}
async function addThml(f){
  const d=parseThml(await f.text());
  const bk=d&&thmlToBook(d,f.name);
  if(!bk||!bk.b.length){ alert(L.thmlBad.replace('{f}',f.name)); return 0; }
  const ok=await confirmPdf(bk); if(!ok) return 0;
  return storeBook(ok);
}

/* ---------------- adding books (kept on this device) ---------------- */
$('#addfile').onchange=async e=>{
  let n=0;
  for(const f of e.target.files){

/* ---------------- marking in a book ----------------
   As in the Bible: select words (drag, or hold on a phone) and the bar offers six highlight colours, six text
   colours and "clear". Marks are kept per book on this device, by block and word number (words as the page shows

function paintMarks(){
  const bm=CUR.bk&&ST.marks[CUR.bk.id]; if(!bm) return;
  for(const el of flow.querySelectorAll('.bk[data-i]')){
    const list=bm[el.dataset.i]; if(!list||!list.length) continue;
    const txt=el.textContent, n=(txt.match(/\S+/g)||[]).length, [H,C]=expand(list,n);
    const ch=new Array(txt.length).fill(-1); { const re=/\S+/g; let m,w=0; while((m=re.exec(txt))){ for(let i=m.index;i<m.index+m[0].length;i++) ch[i]=w; w++; }
      // the space between two marked words of the same colour is marked too, so a highlight runs on unbroken
      for(let i=0;i<txt.length;i++) if(ch[i]<0){ let a=i-1; while(a>=0&&ch[a]<0) a--; let z=i+1; while(z<txt.length&&ch[z]<0) z++;
        if(a>=0&&z<txt.length&&H[ch[a]]&&H[ch[a]]===H[ch[z]]) ch[i]=-2-ch[a]; } }
    const cls=i=>{ const w=ch[i]; if(w===-1) return ''; if(w<=-2) return 'h-'+H[-2-w]; return [H[w]?'h-'+H[w]:'',C[w]?'c-'+C[w]:''].filter(Boolean).join(' '); };

    let pos=0;

  // the word this character belongs to (or the next one, from a space)
  const re=/\S+/g; let m,w=0,last=0; while((m=re.exec(txt))){ if(ci<m.index+m[0].length) return (end&&ci<m.index)?Math.max(0,w-1):w; last=w; w++; } return last;

/* Choosing words on a touch screen: hold a word, then slide to take in more; the marking bar appears on release.

const PICK={range:null,a:null,b:null,p:null,q:null,hold:0,drag:false,swallow:false,x:0,y:0};
function pickNodes(el){ const out=[]; let acc=0; const tw=document.createTreeWalker(el,NodeFilter.SHOW_TEXT); let n;

/* ---------------- a book of your own, written in the library ----------------
   "New book" on the shelf; then a Write panel beside the book (like the notes) holds its pages, each a piece of
   Markdown (a chapter usually begins with "# …"). As you type, the book beside it is set again, so the page is its
   own preview. Pages can be added, moved and deleted at any time; each has an id, and the notes, marks and place
   in the book move with the text they belong to. Kept with your own books, in the backup, and exported as .md. */
const writeEl=$('#write'), wBody=$('#wbody');

// the pages as one book: blocks, and where each page's blocks lie
function buildOwn(bk){
  const lay={}, out=[];
  for(const pg of bk.pages){ const part=mdParse(pg.md||'',true); lay[pg.id]=[out.length,part.length]; out.push(...part); }
  let B=mdRank(out); if(!B.length) B=[['p','\u2026']];

// notes, marks and the place in the book follow their page when pages grow, shrink or move
function remapOwn(id,oldLay,newLay){
  const map=i=>{ for(const [p,[s,n]] of Object.entries(oldLay)) if(i>=s&&i<s+n){ const nw=newLay[p]; if(!nw||!nw[1]) return null; return nw[0]+Math.min(i-s,nw[1]-1); } return null; };
  for(const k of ['notes','marks','bmk']){ const old=ST[k][id]; if(!old) continue; const nw={};
    for(const [i,v] of Object.entries(old)){ const j=map(+i); if(j!=null&&!(j in nw)) nw[j]=v; }
    if(Object.keys(nw).length) ST[k][id]=nw; else delete ST[k][id]; }

const CAN_SHARE=(()=>{ try{ return !!(navigator.canShare&&navigator.canShare({files:[new File(['{}'],'x.json',{type:'application/json'})]})); }catch(e){ return false; } })();
async function shareLibBackup(){
  busy(L.bkSaving); const f=new File([await libBackupBlob()],'biblioteek-rugsteun-'+iso(new Date())+'.json',{type:'application/json'}); busy(null);
  try{ await navigator.share({files:[f],title:f.name}); }catch(e){ if(e&&e.name!=='AbortError') alert(e.message||e); }
}
async function saveLibBackup(){
  busy(L.bkSaving);
  const a=document.createElement('a'); a.href=URL.createObjectURL(await libBackupBlob());
  a.download='biblioteek-rugsteun-'+iso(new Date())+'.json'; document.body.appendChild(a); a.click(); setTimeout(()=>{ URL.revokeObjectURL(a.href); a.remove(); },800);
  busy(null);
}
async function loadLibBackup(f){
  let d; try{ d=JSON.parse(await f.text()); }catch(e){ d=null; }
  if(!d||d.app!=='bybel-biblioteek-rugsteun'){ alert(L.bkBad); return; }
  busy(L.bkLoading); const {nb,nn}=await mergeLibData(d); busy(null);
  alert(L.bkDone.replace('{b}',nb).replace('{n}',nn));
}
// another copy of the library (a backup file, or the one in Google Drive) merged into this device
async function mergeLibData(d){ let nb=0, nn=0;
  for(const bk of d.books||[]){ if(!bk||!bk.id||!Array.isArray(bk.b)) continue;
    let have=null; try{ have=await idbGet('books',bk.id); }catch(e){}
    const newer=have&&have.id&&bk.pages&&(bk.u||0)>(have.u||0);      // a book you are writing: the newer copy wins
    if(!(have&&have.id)||newer){ const meta={id:bk.id,title:bk.title,short:bk.short,subtitle:bk.subtitle,author:bk.author,year:bk.year,shelf:bk.shelf,cloth:bk.cloth,words:bk.words,source:bk.source,license:bk.license};
      if(bk.pages) meta.own=true;
      try{ await idbPut('books',bk); await idbPut('meta',meta); nb++; }catch(e){ alert(L.full); break; } } }
  for(const [id,bn] of Object.entries(d.notes||{})){ const mine=ST.notes[id]||(ST.notes[id]={});
    for(const [i,n] of Object.entries(bn)) if(!mine[i]||(n.u||0)>(mine[i].u||0)){ mine[i]=n; nn++; } }
  for(const [id,bm] of Object.entries(d.marks||{})){ const mine=ST.marks[id]||(ST.marks[id]={}); for(const [i,l] of Object.entries(bm)) if(!mine[i]) mine[i]=l; }
  for(const [id,bm] of Object.entries(d.bmk||{})){ const mine=ST.bmk[id]||(ST.bmk[id]={}); for(const [i,l] of Object.entries(bm)) if(!mine[i]) mine[i]=l; }
  for(const k of ['pos','cloth','shelf']) for(const [id,v] of Object.entries(d[k]||{})) if(ST[k][id]==null) ST[k][id]=v;
  for(const [id,v] of Object.entries(d.far||{})) ST.far[id]=Math.max(ST.far[id]||0,v||0);
  for(const [id,t] of Object.entries(d.time||{})){ const mine=ST.time[id]||(ST.time[id]={total:0,days:{}});
    for(const [day,s] of Object.entries(t.days||{})) mine.days[day]=Math.max(mine.days[day]||0,s);
    mine.total=Math.max(mine.total||0,Object.values(mine.days).reduce((a,b)=>a+b,0),t.total||0); }
  if(!ST.last&&d.last) ST.last=d.last;
  persist(); MINE=await idbAll('meta'); BOOKS.clear();
  if(shelfOpen()) buildShelf(); else if(CUR.bk){ const s=CUR.spread; renderUnit(CUR.u); show(s,0); }
  return {nb,nn};
}
/* Google Drive (optional): the library as one file, "biblioteek.json", in the Drive folder "Bybel-app" */
const LDRIVE='biblioteek.json', hasDrive=()=>typeof GDrive!=='undefined'&&GDrive.ready;
const dWhen=iso=>{ if(!iso) return ''; const d=new Date(iso); return d.toLocaleDateString(ST.s.lang==='af'?'af-ZA':'en-GB',{day:'numeric',month:'short'})+' '+d.toTimeString().slice(0,5); };
function driveHTML(){
  if(!hasDrive()) return '';
  const on=GDrive.on(), last=GDrive.last(LDRIVE);
  return '<div class="drv"><b>Google Drive</b><p>'+esc(on?L.drOn:L.drAbout)+'</p><div class="acts">'+
    (on?'<button type="button" class="btn main" data-drv="sync">'+esc(L.drSync)+'</button><button type="button" class="btn" data-drv="off">'+esc(L.drOff)+'</button>'
       :'<button type="button" class="btn main" data-drv="connect">'+esc(L.drConnect)+'</button>')+'</div>'+
    '<p class="drst">'+esc(last?L.drLast.replace('{t}',dWhen(last)):'')+'</p><a href="privacy.html" target="_blank" rel="noopener">'+esc(L.drPrivacy)+'</a> \u00b7 <a href="terms.html" target="_blank" rel="noopener">'+esc(L.drTerms)+'</a></div>';
}
async function libDriveSync(){
  const say=s=>{ const el=$('#set .drst'); if(el) el.textContent=s; }; say(L.drBusy);
  try{ const r=await GDrive.sync(LDRIVE,libData,async remote=>{ if(!remote||remote.app!=='bybel-biblioteek-rugsteun') return 0; const x=await mergeLibData(remote); return x.nb+x.nn; });
    $('#set').innerHTML=settingsHTML(); say(L.drDone.replace('{n}',r.brought).replace('{t}',dWhen(r.when))); }
  catch(e){ say(driveErr(e)); }
}
// Google's refusal (e.g. an account not among the app's testers) or a closed sign-in window, said plainly
const driveErr=e=>/offline|Failed to fetch/i.test(e.message)?L.drOffline:/access_denied|denied|popup_closed|popup_failed|closed/i.test(e.message)?L.drDenied:L.drFail.replace('{e}',e.message);
$('#set').addEventListener('click',async e=>{ const b=e.target.closest('[data-drv]'); if(!b) return; e.stopPropagation();
  if(b.dataset.drv==='connect'){ try{ await GDrive.connect(); await libDriveSync(); }catch(x){ const el=$('#set .drst'); if(el) el.textContent=driveErr(x); } }
  else if(b.dataset.drv==='sync') libDriveSync();
  else if(b.dataset.drv==='off'){ if(confirm(L.drOffQ)){ GDrive.disconnect(); $('#set').innerHTML=settingsHTML(); } } },true);
$('#libfile').onchange=async e=>{ const f=e.target.files[0]; e.target.value=''; if(f) await loadLibBackup(f); };

/* ---------------- turning pages ---------------- */
let downX=0,downY=0,swiped=false;
let swallow=false;   // a tap that only puts away the marking bar does not turn the page
book.addEventListener('pointerdown',e=>{ downX=e.clientX; downY=e.clientY; swiped=false; swallow=markbar.classList.contains('on'); });
book.addEventListener('pointerup',e=>{ if(e.pointerType!=='touch'||PICK.range) return; const dx=e.clientX-downX, dy=e.clientY-downY;
  if(Math.abs(dx)>45&&Math.abs(dx)>Math.abs(dy)*1.3){ swiped=true; dx<0?next():prev(); } });
book.addEventListener('click',e=>{
  if(PICK.swallow){ PICK.swallow=false; return; }
  if(PICK.range){ clearPick(); hideMarkbar(); swallow=false; return; }   // a tap lets go of held words
  if(swallow){ swallow=false; return; }
  if(swiped){ swiped=false; return; } if(Math.hypot(e.clientX-downX,e.clientY-downY)>6) return; if(String(getSelection()).trim()) return;
  const x=e.clientX-book.getBoundingClientRect().left, P=CUR.G.P;
  if(CUR.G.ppv===2) (x<P?prev:next)(); else (x<P*.35?prev:next)();
});
let wAcc=0,wLock=0;
$('#stage').addEventListener('wheel',e=>{ if(e.target.closest('.panel,#shelf')||!CUR.bk) return; e.preventDefault(); const now=Date.now(); if(now<wLock) return;
  wAcc+=Math.abs(e.deltaY)>=Math.abs(e.deltaX)?e.deltaY:e.deltaX; if(Math.abs(wAcc)>40){ (wAcc>0?next:prev)(); wAcc=0; wLock=now+380; } },{passive:false});
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'){ closePanels(); return; }
  if(shelfOpen()||!CUR.bk||e.altKey||e.ctrlKey||e.metaKey||(e.target.closest&&e.target.closest('input,select,textarea'))) return;
  const k=e.key;
  if(k==='ArrowRight'||k==='PageDown'||(k===' '&&!e.shiftKey)){ e.preventDefault(); next(); }
  else if(k==='ArrowLeft'||k==='PageUp'||(k===' '&&e.shiftKey)){ e.preventDefault(); prev(); }
  else if(k==='b'||k==='B'){ e.preventDefault(); toggleBm(); }
});
let rzT=0,lastStage='';
new ResizeObserver(()=>{ const st=$('#stage'), key=st.clientWidth+'x'+st.clientHeight; if(key===lastStage) return; lastStage=key;
  clearTimeout(rzT); rzT=setTimeout(()=>{ document.body.classList.toggle('phone',isPhone()); if(CUR.bk) relayout(); if(shelfOpen()) buildShelf(); },120); }).observe($('#stage'));

/* ---------------- open ---------------- */
document.body.classList.toggle('phone',isPhone());
label(); openShelf(); busy(null);
window.__lib={ST,CUR,catalogue,openBook,openShelf,idbAll,goBlock};
})();
</script>
<script>
/* Installed as an app (from a web address), keep a copy of everything on the device so it opens without signal,
   and ask the browser to keep this app's saved readings and notes even when the phone runs low on space.
   When a newer version has been put online, a small bar offers to reload into it. */
if('serviceWorker' in navigator&&/^https?:$/.test(location.protocol)){
  const af=()=>(document.documentElement.lang||'af').slice(0,2)==='af';
  const updateBar=()=>{ if(document.getElementById('updbar')) return;
    const d=document.createElement('div'); d.id='updbar'; d.setAttribute('role','status');
    d.style.cssText='position:fixed;left:50%;bottom:calc(56px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:100;display:flex;gap:14px;align-items:center;background:#1f1d1a;color:#f6f4ee;padding:10px 12px 10px 16px;border-radius:10px;font:14px system-ui,sans-serif;box-shadow:0 10px 30px rgba(0,0,0,.3);max-width:calc(100vw - 24px)';
    d.innerHTML='<span>'+(af()?'\u2019n Nuwe weergawe is gereed.':'A new version is ready.')+'</span><button type="button" style="background:none;border:0;color:#f6f4ee;font:600 14px system-ui,sans-serif;text-decoration:underline;text-underline-offset:3px;cursor:pointer;padding:4px 6px">'+(af()?'Herlaai':'Reload')+'</button>';
    d.querySelector('button').onclick=()=>location.reload(); document.body.appendChild(d); };
  const hadController=!!navigator.serviceWorker.controller;
  navigator.serviceWorker.addEventListener('controllerchange',()=>{ if(hadController) updateBar(); });
  navigator.serviceWorker.addEventListener('message',e=>{ if(e.data&&e.data.type==='updated') updateBar(); });
  addEventListener('load',()=>{ navigator.serviceWorker.register('sw.js').then(r=>r.update()).catch(e=>console.warn('offline copy not set up',e)); });
  if(navigator.storage&&navigator.storage.persist) navigator.storage.persist().catch(()=>{});
}
</script>
