:root{
  color-scheme:light;
  --desk:#d3d0c8; --page:#f6f4ee; --page2:#ece9e1; --ink:#1f1d1a; --soft:#6d675d; --faint:#a29c91;
  --rule:#cfcac0; --panel:#fbfaf7; --line:#dcd8cf; --sel:#2a2724; --sel-ink:#f6f4ee;
  --rubric:#a2392a; --shadow:rgba(46,36,24,.20); --fold:rgba(70,52,30,.24); --fold2:rgba(70,52,30,.07); --sheen:rgba(255,255,255,.5); --edgebg:#f1eee7; --edgeln2:#d3ccbe;
  --edgeln:#dcd6ca; --case:#e4ddd0; --plank:#8d6239; --plank-hi:#b07d4c; --plank-lo:#5e3f22;

}

  color-scheme:dark;
  --desk:#0e0d0c; --page:#211f1c; --page2:#2b2926; --ink:#e5e0d5; --soft:#9a948a; --faint:#69645c;

/* ---------- paper tone: softer light pages, for long reading or a bright screen ---------- */
[data-paper=cream][data-theme=light]{--page:#f4eddc;--page2:#e8dfca;--edgebg:#efe7d4;--sheen:rgba(255,250,236,.38);--panel:#f9f5eb;--desk:#d1ccc0;--case:#e2d9c8}

*{box-sizing:border-box}
[hidden]{display:none!important}
html{background:var(--desk)}
body{margin:0;min-height:100vh;background:var(--desk);color:var(--ink);font:15px/1.45 var(--sans);-webkit-text-size-adjust:100%}
button,select,input{font:inherit;color:inherit}
a{color:inherit}
/* the bar along the top */
#top{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:10px;padding:calc(8px + env(safe-area-inset-top,0px)) 14px 8px;
  background:color-mix(in srgb,var(--desk) 88%,transparent);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
#top h1{flex:1;margin:0;font:600 18px var(--serif);letter-spacing:.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tb{display:inline-flex;align-items:center;gap:6px;border:1px solid transparent;background:none;border-radius:8px;padding:6px 10px;cursor:pointer;text-decoration:none;font:15px var(--serif);color:var(--ink)}
.tb:hover{border-color:var(--line)}
.tb svg{width:17px;height:17px}
main{max-width:980px;margin:0 auto;padding:14px 14px calc(40px + env(safe-area-inset-bottom,0px))}
/* the controls, on a sheet of paper */
#ctl{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px 14px;box-shadow:0 1px 2px var(--shadow)}
.row{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;margin:0 0 10px}
.row:last-child{margin-bottom:0}
.lab{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--faint);min-width:74px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:var(--page);border-radius:999px;padding:4px 11px;cursor:pointer;font:600 14px var(--serif);color:var(--soft)}
.chip[aria-pressed=true]{background:var(--sel);color:var(--sel-ink);border-color:var(--sel)}
.chip small{font:400 11px var(--sans);opacity:.75;margin-left:3px}
select{background:var(--page);border:1px solid var(--line);border-radius:8px;padding:5px 8px;max-width:100%}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{border:0;background:var(--page);padding:5px 10px;cursor:pointer;font-size:13.5px;color:var(--soft)}
.seg button+button{border-left:1px solid var(--line)}
.seg button[aria-pressed=true]{background:var(--sel);color:var(--sel-ink)}
/* agreement patterns */
#pats{display:flex;flex-direction:column;gap:2px;margin-top:4px}
.pat{display:grid;grid-template-columns:1fr auto;align-items:center;gap:10px;border:0;background:none;text-align:left;padding:5px 8px;border-radius:7px;cursor:pointer;font:15px var(--serif)}
.pat:hover{background:color-mix(in srgb,var(--ink) 6%,transparent)}
.pat[aria-pressed=true]{background:var(--sel);color:var(--sel-ink)}
.pat .n{font:13px var(--sans);color:var(--faint);font-feature-settings:"tnum"}
.pat[aria-pressed=true] .n{color:inherit;opacity:.8}
.pat .bar{display:block;height:3px;border-radius:2px;background:var(--rubric);opacity:.45;margin-top:3px}
.ne{color:var(--rubric);font-weight:600;padding:0 .2em}
.pat[aria-pressed=true] .ne{color:inherit}
details.pd{margin-top:2px}
details.pd>summary{cursor:pointer;list-style:none;font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--faint)}
details.pd>summary::-webkit-details-marker{display:none}
details.pd>summary::before{content:"\25b8";display:inline-block;margin-right:6px;transition:transform .15s}
details.pd[open]>summary::before{transform:rotate(90deg)}
/* the results */
#sum{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:16px 4px 10px;color:var(--soft);font-size:14px}
#sum b{color:var(--ink);font:600 16px var(--serif)}
#sum .grow{flex:1}
.vc{background:var(--page);border:1px solid var(--line);border-radius:10px;padding:10px 14px 12px;margin:0 0 10px;box-shadow:0 1px 2px var(--shadow)}
.vh{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;margin-bottom:6px}
.ref{font:600 16px var(--serif);color:var(--rubric);text-decoration:none}
.ref:hover{text-decoration:underline}
.vpat{font:13.5px var(--serif);color:var(--soft)}
.kinds{margin-left:auto;font-size:11.5px;color:var(--faint)}
.ln{display:grid;grid-template-columns:3.6em 1fr;gap:10px;align-items:baseline;padding:3px 0}
.ln+.ln{border-top:1px dotted var(--line)}
.tl{font:600 12px var(--sans);letter-spacing:.03em;color:var(--soft);display:flex;align-items:center;gap:5px;white-space:nowrap}
.tl i{width:8px;height:8px;border-radius:50%;display:inline-block;flex:none}
.gk{font:17px/1.6 var(--serif);word-spacing:.04em}
.gk .d{background:color-mix(in srgb,var(--rubric) 17%,transparent);color:var(--ink);border-radius:3px;box-shadow:0 0 0 1px color-mix(in srgb,var(--rubric) 17%,transparent)}
.gap{display:inline-block;color:var(--rubric);font:700 14px var(--sans);padding:0 2px;cursor:pointer;vertical-align:.25em;line-height:1;outline:0;position:relative}
.gap:focus::after,.gap:hover::after{content:attr(data-w);position:absolute;left:50%;bottom:130%;transform:translateX(-50%);white-space:nowrap;max-width:80vw;overflow:hidden;text-overflow:ellipsis;
  background:var(--sel);color:var(--sel-ink);font:400 14px var(--serif);padding:5px 9px;border-radius:7px;box-shadow:0 6px 18px -6px var(--shadow);z-index:5}
.gk.empty{color:var(--faint);font:italic 14px var(--serif)}
/* on a touch screen the missing words open in the line itself, where a finger does not cover them */
@media (hover:none){
  .gap:hover::after{content:none}
  .gap:focus::after{content:"[" attr(data-w) "]";position:static;transform:none;display:inline;white-space:normal;max-width:none;
    background:none;box-shadow:none;color:var(--rubric);font:italic 15px var(--serif);padding:0 .25em;vertical-align:baseline}
}
.tr-line{font:italic 14px/1.45 var(--serif);color:var(--soft);margin-top:6px;padding-top:6px;border-top:1px solid var(--line)}
.more{display:block;margin:14px auto;border:1px solid var(--line);background:var(--panel);border-radius:9px;padding:8px 18px;cursor:pointer;font:15px var(--serif)}
.empty-note{text-align:center;color:var(--soft);font:italic 16px var(--serif);padding:40px 10px}
#busy{text-align:center;color:var(--soft);font:italic 16px var(--serif);padding:60px 10px}
/* the note on the texts */
#about{position:fixed;inset:0;z-index:50;display:none;align-items:center;justify-content:center;background:rgba(0,0,0,.35);padding:16px}
#about.on{display:flex}
#about>div{background:var(--panel);border:1px solid var(--line);border-radius:12px;max-width:620px;max-height:85vh;overflow:auto;padding:16px 20px;box-shadow:0 20px 50px -20px #000}
#about h2{margin:0 0 8px;font:600 19px var(--serif)}
#about dl{margin:10px 0}
#about dt{font:600 15px var(--serif);margin-top:10px}
#about dd{margin:2px 0 0;color:var(--soft);font-size:13.5px}
#about p{font-size:14px;color:var(--soft);line-height:1.5}
#about .x{float:right;border:0;background:none;font-size:22px;cursor:pointer;color:var(--soft)}
@media (max-width:640px){
  main{padding:10px 8px 40px}
  #ctl{padding:10px 10px}
  .lab{min-width:0;width:100%}
  .ln{grid-template-columns:1fr;gap:0}
  .tl{margin-top:2px}
  .gk{font-size:16.5px}
  #top h1{font-size:16px}
  .tb span{display:none}
}
</style>
</head>
<body>
<header id="top">
  <a class="tb" id="back" href="./"><svg viewBox="0 0 20 20" aria-hidden="true"><path d="M12 4l-6 6 6 6" fill="none" stroke="currentColor" stroke-width="1.6"/></svg><span></span></a>
  <h1 id="title"></h1>
  <button class="tb" id="aboutbtn" type="button"><svg viewBox="0 0 20 20" aria-hidden="true"><circle cx="10" cy="10" r="7.5" fill="none" stroke="currentColor" stroke-width="1.3"/><path d="M10 9v5M10 6.2v.1" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg><span></span></button>

<main>
  <section id="ctl">

  <div id="sum"></div>

</main>

  if(sp==='ignore'&&s){
    s=s.replace(/\u03b5\u03b9/g,'\u03b9').replace(/([\u03bd\u03c1\u03c3\u03bb\u03c0\u03c4\u03ba])\1/g,'$1').replace(/\u03bc\u03c8/g,'\u03c8').replace(/\u03bb\u03b7\u03bc\u03c6/g,'\u03bb\u03b7\u03c6')
     .replace(/^\u03b4\u03b1\u03b2\u03b9\u03b4$/,'\u03b4\u03b1\u03c5\u03b9\u03b4');
    if(s.length>3&&/(\u03c3\u03b9\u03bd|\u03b5\u03bd|\u03c4\u03b9\u03bd)$/.test(s)) s=s.slice(0,-1);
    if(s==='\u03bf\u03c5\u03c4\u03c9\u03c3') s='\u03bf\u03c5\u03c4\u03c9';
  }
  return NC[k]=s;
}
function toks(text,sp){ const disp=text?text.split(/\s+/):[], ix=[], n=[]; disp.forEach((w,i)=>{ const s=norm(w,sp); if(s){ n.push(s); ix.push(i); } }); return {disp,n,ix}; }
// longest common subsequence: which words of a and b pair up
function lcs(a,b){
  const n=a.length, m=b.length; if(!n||!m) return {ma:new Int32Array(n).fill(-1),mb:new Int32Array(m).fill(-1)};
  const W=m+1, d=new Uint16Array((n+1)*W);
  for(let i=n-1;i>=0;i--) for(let j=m-1;j>=0;j--) d[i*W+j]=a[i]===b[j]?d[(i+1)*W+j+1]+1:Math.max(d[(i+1)*W+j],d[i*W+j+1]);
  const ma=new Int32Array(n).fill(-1), mb=new Int32Array(m).fill(-1); let i=0,j=0;
  while(i<n&&j<m){ if(a[i]===b[j]){ ma[i]=j; mb[j]=i; i++; j++; } else if(d[(i+1)*W+j]>=d[i*W+j+1]) i++; else j++; }
  return {ma,mb};
}
/* one verse compared among the chosen texts */
function compare(u,sel,sp){
  const T=sel.map(id=>toks(DATA.t[id][u],sp)), keyOf=T.map(t=>t.n.join(' '));
  const groups=[]; keyOf.forEach((k,i)=>{ const g=groups.find(g=>keyOf[g[0]]===k); if(g) g.push(i); else groups.push([i]); });
  if(groups.length<2) return null;
  const diff=T.map(t=>new Uint8Array(t.n.length)), gaps=T.map(()=>new Map()), kinds=new Set(); let size=0;
  for(let x=0;x<T.length;x++) for(let y=x+1;y<T.length;y++){
    if(keyOf[x]===keyOf[y]) continue;
    const a=T[x].n, b=T[y].n, {ma,mb}=lcs(a,b);
    let ua=0, ub=0; ma.forEach((v,i)=>{ if(v<0){ ua++; diff[x][i]=1; } }); mb.forEach((v,j)=>{ if(v<0){ ub++; diff[y][j]=1; } });
    size=Math.max(size,ua,ub);
    if(!ua&&!ub) kinds.add('order');
    else if(a.length&&b.length&&[...a].sort().join()===[...b].sort().join()) kinds.add('order');
    else if(!ua||!ub) kinds.add('addom');
    else { kinds.add('change'); if(ua!==ub) kinds.add('addom'); }
    // where one text has words the other lacks, with nothing in their place: a gap in the shorter text
    for(const [P,Q,mp,mq,ip,iq] of [[x,y,ma,mb,a,b],[y,x,mb,ma,b,a]]){
      let i=0, j=0;
      while(j<mq.length){
        if(mq[j]>=0){ i=mq[j]+1; j++; continue; }
        const run=[]; while(j<mq.length&&mq[j]<0){ run.push(j); j++; }
        const next=j<mq.length?mq[j]:mp.length;
        if(next===i){ const g=gaps[P].get(i)||new Map(), nk=run.map(k=>T[Q].n[k]).join(' ');
          // the same words in several texts (apart from accents) are listed once, with all their texts
          const e=g.get(nk)||g.set(nk,{w:run.map(k=>T[Q].disp[T[Q].ix[k]]).join(' '),ids:[]}).get(nk); if(!e.ids.includes(sel[Q])) e.ids.push(sel[Q]); gaps[P].set(i,g); }
      }
    }
  }
  if(!size&&!kinds.size) return null;
  return {T,groups,diff,gaps,kinds,size};
}
/* everything for the current choice of texts and spelling, worked out once */
let CMP=null;
function computeAll(){
  const sel=IDS.filter(i=>ST.sel.includes(i)), sp=ST.spell, key=sel.join()+'|'+sp;
  if(CMP&&CMP.key===key) return CMP;
  const res=new Array(NU), pats=new Map();
  if(sel.length>=2) for(let u=0;u<NU;u++){ const r=compare(u,sel,sp); if(r){ r.pat=patKey(r.groups,sel); res[u]=r; pats.set(r.pat,(pats.get(r.pat)||0)+1); } }
  return CMP={key,sel,res,pats};
}
const patKey=(groups,sel)=>groups.map(g=>g.map(i=>sel[i]).join('=')).join('|');
const patHTML=p=>p.split('|').map(g=>g.split('=').map(id=>esc(LAB[id])).join(' = ')).join('<span class="ne">\u2260</span>');
const patText=p=>p.split('|').map(g=>g.split('=').map(id=>LAB[id]).join(' = ')).join(' \u2260 ');

/* the controls */
function drawControls(){
  $('#texts').innerHTML=TX.map((t,i)=>'<button type="button" class="chip" data-id="'+t.id+'" title="'+esc(t.name)+'" aria-pressed="'+ST.sel.includes(t.id)+'">'+esc(t.label)+'</button>').join('');
  $('#book').innerHTML='<option value="-1">'+esc(L.allNT)+'</option>'+names.map((n,i)=>'<option value="'+i+'"'+(ST.book===i?' selected':'')+'>'+esc(n)+'</option>').join('');
  const chs=ST.book<0?0:Math.max(...U.filter(u=>u[0]===ST.book).map(u=>u[3]));
  $('#chap').hidden=ST.book<0;
  $('#chap').innerHTML='<option value="0">'+esc(L.allCh)+'</option>'+Array.from({length:chs},(_,i)=>'<option value="'+(i+1)+'"'+(ST.chap===i+1?' selected':'')+'>'+esc(L.ch)+' '+(i+1)+'</option>').join('');
  $('#kind').innerHTML=[['all',L.kAll],['addom',L.kAddom],['change',L.kChange],['order',L.kOrder]].map(([v,l])=>'<option value="'+v+'"'+(ST.kind===v?' selected':'')+'>'+esc(l)+'</option>').join('');
  $('#size').innerHTML=[[1,L.s1],[2,L.s2],[3,L.s3],[5,L.s5],[10,L.s10]].map(([v,l])=>'<option value="'+v+'"'+(ST.size===v?' selected':'')+'>'+esc(l)+'</option>').join('');
  $('#spell').querySelectorAll('button').forEach(b=>{ b.textContent=b.dataset.sp==='ignore'?L.spIgnore:L.spShow; b.setAttribute('aria-pressed',ST.spell===b.dataset.sp); });
}
const inPlace=u=>{ const x=U[u]; return (ST.book<0||x[0]===ST.book)&&(!ST.chap||(x[1]<=ST.chap&&x[3]>=ST.chap)); };
const fits=(r)=>(ST.kind==='all'||r.kinds.has(ST.kind))&&r.size>=ST.size;
let LIST=[], shown=0;
function refresh(){
  save(); drawControls();
  if(ST.sel.length<2){ $('#pats').innerHTML=''; $('#sum').innerHTML=''; $('#list').innerHTML='<p class="empty-note">'+esc(L.pickTwo)+'</p>'; return; }
  const C=computeAll();
  // the agreement patterns, counted within the place and kind chosen
  const counts=new Map(); let all=0, inArea=0;
  for(let u=0;u<NU;u++){ if(!inPlace(u)) continue; inArea++; const r=C.res[u]; if(!r||!fits(r)) continue; all++; counts.set(r.pat,(counts.get(r.pat)||0)+1); }
  if(ST.pat&&!counts.has(ST.pat)) ST.pat='';
  const pl=[...counts].sort((a,b)=>b[1]-a[1]), mx=Math.max(1,...pl.map(p=>p[1]));
  $('#pats').innerHTML='<button type="button" class="pat" data-pat="" aria-pressed="'+!ST.pat+'"><span>'+esc(L.allPat)+'</span><span class="n">'+all+'</span></button>'+
    pl.map(([p,n])=>'<button type="button" class="pat" data-pat="'+esc(p)+'" aria-pressed="'+(ST.pat===p)+'"><span>'+patHTML(p)+'<span class="bar" style="width:'+Math.max(2,Math.round(n/mx*100))+'%"></span></span><span class="n">'+n+'</span></button>').join('');
  LIST=[]; for(let u=0;u<NU;u++){ if(!inPlace(u)) continue; const r=C.res[u]; if(r&&fits(r)&&(!ST.pat||r.pat===ST.pat)) LIST.push(u); }
  $('#sum').innerHTML='<span><b>'+esc(L.nDiff.replace('{n}',LIST.length.toLocaleString(lang)).replace('{t}',inArea.toLocaleString(lang)))+'</b></span><span class="grow"></span>'+
    (LIST.length?'<button type="button" class="tb" id="csv"><svg viewBox="0 0 20 20" aria-hidden="true"><path d="M10 3v9M6 8l4 4 4-4M4 15h12" fill="none" stroke="currentColor" stroke-width="1.4"/></svg><span>'+esc(L.export)+'</span></button>':'');
  shown=0; $('#list').innerHTML=LIST.length?'':'<p class="empty-note">'+esc(L.none)+'</p>'; more();
}
function lineHTML(r,k,sel,u){
  const t=r.T[k], id=sel[k], d=r.diff[k], g=r.gaps[k];
  const col=COL[r.groups.findIndex(gr=>gr.includes(k))%COL.length];
  if(!t.disp.length) return '<div class="ln"><span class="tl"><i style="background:'+col+'"></i>'+esc(LAB[id])+'</span><span class="gk empty">'+esc(L.noText)+'</span></div>';
  const flag=new Uint8Array(t.disp.length); t.ix.forEach((di,ni)=>{ if(d[ni]) flag[di]=1; });
  const gapAt=new Map(); for(const [ni,m] of g){ const di=ni<t.ix.length?t.ix[ni]:t.disp.length; gapAt.set(di,m); }
  const gapHTML=m=>'<span class="gap" tabindex="0" data-w="'+esc([...m.values()].map(e=>e.ids.map(i=>LAB[i]).join(', ')+': '+e.w).join(' \u00b7 '))+'">\u2038</span>';
  let h='';
  t.disp.forEach((w,i)=>{ if(gapAt.has(i)) h+=gapHTML(gapAt.get(i))+' '; h+=(flag[i]?'<span class="d">'+esc(w)+'</span>':esc(w))+' '; });
  if(gapAt.has(t.disp.length)) h+=gapHTML(gapAt.get(t.disp.length));
  return '<div class="ln"><span class="tl"><i style="background:'+col+'"></i>'+esc(LAB[id])+'</span><span class="gk" lang="grc">'+h+'</span></div>';
}
function cardHTML(u){
  const r=CMP.res[u], sel=CMP.sel, x=U[u];
  const ks=[...r.kinds].map(k=>k==='addom'?L.kAddomS:k==='change'?L.kChangeS:L.kOrderS).join(' \u00b7 ')+' \u00b7 '+(r.size===1?L.word:L.words.replace('{n}',r.size));
  return '<article class="vc"><div class="vh"><a class="ref" href="./?r='+x[5]+'">'+esc(refOf(x))+'</a><span class="vpat">'+patHTML(r.pat)+'</span><span class="kinds">'+esc(ks)+'</span></div>'+
    sel.map((_,k)=>lineHTML(r,k,sel,u)).join('')+'</article>';
}
function more(){
  const list=$('#list'), old=list.querySelector('.more'); if(old) old.remove();
  const end=Math.min(LIST.length,shown+40); let h='';
  for(let i=shown;i<end;i++) h+=cardHTML(LIST[i]);
  list.insertAdjacentHTML('beforeend',h); shown=end;
  if(shown<LIST.length){ list.insertAdjacentHTML('beforeend','<button type="button" class="more">'+esc(L.more)+' ('+(LIST.length-shown)+')</button>'); }
}
// further results as the reader nears the end
new IntersectionObserver(es=>{ if(es.some(e=>e.isIntersecting)&&shown<LIST.length) more(); },{rootMargin:'600px'}).observe($('#sentinel')||document.body.appendChild(Object.assign(document.createElement('div'),{id:'sentinel'})));

/* events */
$('#texts').addEventListener('click',e=>{ const b=e.target.closest('.chip'); if(!b) return; const id=b.dataset.id;
  ST.sel=ST.sel.includes(id)?ST.sel.filter(x=>x!==id):[...ST.sel,id]; ST.pat=''; refresh(); });
$('#book').addEventListener('change',e=>{ ST.book=+e.target.value; ST.chap=0; ST.pat=''; refresh(); });
$('#chap').addEventListener('change',e=>{ ST.chap=+e.target.value; refresh(); });
$('#kind').addEventListener('change',e=>{ ST.kind=e.target.value; refresh(); });
$('#size').addEventListener('change',e=>{ ST.size=+e.target.value; refresh(); });
$('#spell').addEventListener('click',e=>{ const b=e.target.closest('button'); if(!b) return; ST.spell=b.dataset.sp; ST.pat=''; $('#list').innerHTML='<div id="busy">'+esc(L.loading)+'</div>'; setTimeout(refresh,20); });
$('#pats').addEventListener('click',e=>{ const b=e.target.closest('.pat'); if(!b) return; ST.pat=b.dataset.pat; refresh(); $('#sum').scrollIntoView({behavior:'smooth',block:'start'}); });
$('#list').addEventListener('click',e=>{ if(e.target.closest('.more')) more(); });
$('#sum').addEventListener('click',e=>{ if(!e.target.closest('#csv')) return;
  const q=s=>'"'+String(s).replace(/"/g,'""')+'"', sel=CMP.sel;
  const rows=[['Reference','Agreement','Kind','Words',...sel.map(i=>LAB[i])].map(q).join(',')];
  for(const u of LIST){ const r=CMP.res[u]; rows.push([refOf(U[u]),patText(r.pat),[...r.kinds].join(' '),r.size,...sel.map(i=>DATA.t[i][u])].map(q).join(',')); }
  const a=document.createElement('a'); a.href=URL.createObjectURL(new Blob(['\ufeff'+rows.join('\r\n')],{type:'text/csv;charset=utf-8'}));
  a.download='greek-texts-'+sel.join('-')+'.csv'; document.body.appendChild(a); a.click(); setTimeout(()=>{ URL.revokeObjectURL(a.href); a.remove(); },500); });
$('#aboutbtn').addEventListener('click',()=>{
  $('#about>div').innerHTML='<button class="x" type="button" aria-label="close">\u00d7</button><h2>'+esc(L.about)+'</h2><p>'+esc(L.aboutText)+'</p><dl>'+
    TX.map((t,i)=>'<dt>'+esc(t.label)+' \u2014 '+esc(t.name)+'</dt><dd>'+esc(t.lic)+'</dd>').join('')+'</dl><p>'+esc(L.aboutWh)+'</p>';
  $('#about').classList.add('on'); });
$('#about').addEventListener('click',e=>{ if(e.target.id==='about'||e.target.closest('.x')) $('#about').classList.remove('on'); });
document.addEventListener('keydown',e=>{ if(e.key==='Escape') $('#about').classList.remove('on'); });

refresh();
window.__tekste={ST,refresh,get CMP(){ return CMP; },U,DATA};
})();
</script>
<script>
/* Installed as an app (from a web address), keep a copy of everything on the device so it opens without signal,
   and ask the browser to keep this app's saved readings and notes even when the phone runs low on space.
   When a newer version has been put online, a small bar offers to reload into it. */
if('serviceWorker' in navigator&&/^https?:$/.test(location.protocol)){
  const af=()=>(document.documentElement.lang||'af').slice(0,2)==='af';
  const updateBar=()=>{ if(document.getElementById('updbar')) return;
    const d=document.createElement('div'); d.id='updbar'; d.setAttribute('role','status');
    d.style.cssText='position:fixed;left:50%;bottom:calc(56px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:100;display:flex;gap:14px;align-items:center;background:#1f1d1a;color:#f6f4ee;padding:10px 12px 10px 16px;border-radius:10px;font:14px system-ui,sans-serif;box-shadow:0 10px 30px rgba(0,0,0,.3);max-width:calc(100vw - 24px)';
    d.innerHTML='<span>'+(af()?'\u2019n Nuwe weergawe is gereed.':'A new version is ready.')+'</span><button type="button" style="background:none;border:0;color:#f6f4ee;font:600 14px system-ui,sans-serif;text-decoration:underline;text-underline-offset:3px;cursor:pointer;padding:4px 6px">'+(af()?'Herlaai':'Reload')+'</button>';
    d.querySelector('button').onclick=()=>location.reload(); document.body.appendChild(d); };
  const hadController=!!navigator.serviceWorker.controller;
  navigator.serviceWorker.addEventListener('controllerchange',()=>{ if(hadController) updateBar(); });
  navigator.serviceWorker.addEventListener('message',e=>{ if(e.data&&e.data.type==='updated') updateBar(); });
  addEventListener('load',()=>{ navigator.serviceWorker.register('sw.js').then(r=>r.update()).catch(e=>console.warn('offline copy not set up',e)); });
  if(navigator.storage&&navigator.storage.persist) navigator.storage.persist().catch(()=>{});
}
</script>
